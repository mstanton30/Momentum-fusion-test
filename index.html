 {"m": 12, "tag": "Long game", "t": "A day off", "b": "Some day soon will be a holiday or a celebration for you. When it comes, enjoy it completely. Eat the meal, be with your people, take a walk if the weather lets you. One day of rest and good food takes nothing from a year of work. This kind of day is part of what the work is for."},
 {"m": 12, "tag": "Long game", "t": "Put something on the calendar", "b": "Give next year an event to train toward. A 5K, a hiking trip, a pickleball tournament, a long ride, a first pull-up six months from now. A date on the calendar gives the weeks before it a purpose. Choose something that sounds like fun to you."},
 {"m": 12, "tag": "Long game", "t": "Book the checkups", "b": "Schedule next year's appointments now: the annual physical and blood work, any screenings that are due, a bone density scan if it's time, and a DEXA body scan if you want better body composition numbers. A year from now you'll have something to compare them with."},
 {"m": 12, "tag": "Long game", "t": "Skip the fresh start", "b": "You don't need a resolution or a big restart. Resolutions are large promises made on a day when motivation is high, and most are gone within weeks. You have a routine that has already run for a year. Keep it going on day 366 as if it were any other day."},
 {"m": 12, "tag": "Long game", "t": "Year-end test week", "b": "Take your final measurements for the year: weigh-in and body composition, waist and fitness test, same conditions as always. Put them next to the ones from your second month. Then put them away. These are your starting numbers for next year, and you'll check again in two months."},
 {"m": 12, "tag": "Long game", "t": "What I'd want you to remember", "b": "If you remember only a few things from this year, make them these. Lift three days a week for the rest of your life. Eat protein and produce at most meals. Move every day and stretch a little. Sleep. Don't miss twice. Everything else is detail."},
 {"m": 12, "tag": "Long game", "t": "Day 365", "b": "A year ago you opened this app for the first time. You've now read all 365 of these, and you've done most of what they asked. Tomorrow the lessons start again from the top, and you'll read them as a different person. Well done. See you in the morning."}

/* Lessons run on program days: day 1 is the day this person started (profile.start), whatever the calendar says. After day 365 the year repeats. */
const LESSON_MONTHS=["The program in one month","Protein and the plate","Body composition","Strength","Mobility and joints","Cardio and fitness","Sleep","Eating in the real world","Habits and mindset","Supplements and shortcuts","Heat, cold and stress","The long game"];
let libMonth=null;
function lessonsRead(){ const s=new Set(); for(const k in (S.lessons||{})) if(S.lessons[k]) s.add(programDay(k)%LESSONS.length+1); return s }
/* The library: every lesson, by month. The daily card is the drip; this is the shelf. */
function vLibrary(){ const cur=lessonFor(ymd(today())), read=lessonsRead(); if(libMonth==null) libMonth=cur.m;
  const months=LESSON_MONTHS.map((title,i)=>{ const m=i+1, ls=[]; LESSONS.forEach((x,j)=>{ if(x.m===m) ls.push({...x,n:j+1}) }); const done=ls.filter(x=>read.has(x.n)).length, open=libMonth===m;
    return `<div class="card lib${open?" open":""}"><button type="button" class="lib-head" data-lib="${m}" aria-expanded="${open}"><span class="lib-num">${m}</span><span><b>${esc(title)}</b><br><span class="muted xs">Days ${ls[0].n}–${ls[ls.length-1].n} · ${done} of ${ls.length} read${cur.m===m?" · you are here":""}</span></span><span class="chev" aria-hidden="true">${open?"–":"+"}</span></button>
    ${open?`<div class="lib-list">${ls.map(x=>`<details class="lib-lesson"${x.n===cur.n?" open":""}><summary><span class="tick${read.has(x.n)?" on":""}">${read.has(x.n)?CHECK:x.n}</span><span>${esc(x.t)}</span></summary><p>${esc(x.b)}</p></details>`).join("")}</div>`:""}</div>` }).join("");
  return header("Lessons","Library")+`<p class="muted">One lesson a day for a year. All of them live here, to read ahead or look back.</p><button class="btn small ghost" type="button" data-go="why" style="margin:0 0 16px">The program on one page</button>`+months+`<button class="btn small ghost" type="button" data-go="home">Back to Home</button>` }
const WHY={
 workout:["Three strength days are the centre of the week, because muscle protects your joints, bones and blood sugar and nothing else replaces it. Cardio is mostly easy, with one or two hard sessions. Ten minutes of mobility a day keeps you training for decades. The app gives you the type of day and leaves the class to you.",[[4,"Strength"],[5,"Mobility"],[6,"Cardio"]]],
 nutrition:["We count plates, not calories. A palm of protein and half a plate of produce at most meals covers what matters, and aiming for 70 percent quality leaves room for the rest of life. Drinks get their own line because they cost you sleep and recovery.",[[2,"Protein and the plate"],[8,"Eating in the real world"]]],
 benefits:["Supplements and extras come last on purpose. A short list has decent evidence: creatine, protein powder when food falls short, vitamin D if a test shows you're low. Sauna has good long-term data and cold has less. None of it replaces training, food and sleep.",[[10,"Supplements"],[11,"Heat, cold and stress"],[7,"Sleep"]]],
 progress:["Body weight can't tell muscle from fat, so we watch body composition, your waist and a fitness test, and we read the four-week trend instead of any single day. You control the inputs. The outputs follow, usually a few weeks later.",[[3,"Body composition"],[9,"Habits"],[12,"The long game"]]]
};
function whyBlock(id){ const [text,links]=WHY[id]; return `<details class="whybox"><summary>Why this works</summary><div><p class="sm">${text}</p><div class="chips">${links.map(([m,l])=>`<button type="button" data-lib-go="${m}">Month ${m} · ${l}</button>`).join("")}</div></div></details>` }
function programDay(k){ const s=S.profile&&S.profile.start; if(!s) return 0; return Math.max(0,Math.round((parseD(k)-parseD(s))/864e5)) }
function lessonFor(k){ const i=programDay(k)%LESSONS.length; return {...LESSONS[i],n:i+1} }
function lessonRead(k){ return !!(S.lessons||{})[k] }
function lessonCard(k,compact){ const l=lessonFor(k), read=lessonRead(k);
  return `<div class="card"><div class="row" style="justify-content:space-between"><div class="eyebrow" style="flex:1">Day ${l.n} · Month ${l.m} · ${esc(l.tag)}</div><span class="${read?"pill ok":"pill"}" style="flex:0 0 auto">${read?"Read":"+"+PTS.lesson}</span></div>
  <h3 style="margin:6px 0 0;font-size:1.15rem">${esc(l.t)}</h3><p class="lesson-body">${esc(l.b)}</p>
  ${read?"":`<button class="btn small" type="button" data-lesson-read="${k}">Got it</button>`}
  ${compact||!programDay(k)?"":`<details class="xs" style="margin-top:10px"><summary>Earlier this week</summary><div>${[1,2,3,4,5,6].filter(n=>n<=programDay(k)).map(n=>{ const kk=shiftDate(k,-n), x=lessonFor(kk); return `<p class="sm" style="margin:0 0 8px"><b>${esc(x.t)}${/[.?!"]$/.test(x.t)?"":"."}</b> ${esc(x.b)}</p>` }).join("")}</div></details>`}</div>` }
/* Meals that are due by this time of day and not yet rated */
function dueMeals(k){ const h=new Date().getHours(), m=effectiveMeals(k); return MEALS.filter(([id])=>((id==="b"&&h>=5)||(id==="l"&&h>=11)||(id==="d"&&h>=17))&&!mealRating(m[id])) }
function workoutOpen(k){ if(fusionActivities(k).length) return []; return dayDef(k).sessions.filter(x=>x.id!=="fin"&&!sessOf(k,x.id).done) }
let dailyOpen=false, dailyHiddenAt=0;

  if(!lessonRead(k)) add("lesson",lessonCard(k,true));

   if(pending.length) add("workout",`<div class="card"><div class="eyebrow">Today's workout · My Plan</div>

    <button class="btn small" type="button" data-go="workout">Open my scheduled workouts</button></div>`);
  }else if(open.length) add("workout",`<div class="card"><div class="eyebrow">Today's workout</div><h3 style="margin:6px 0 2px;font-size:1.15rem">${esc(day.title)}</h3>
   ${open.map(x=>checkBtn(false,x.title,x.range[0]===x.range[1]?x.range[0]+" min":x.range[0]+"–"+x.range[1]+" min",x.pts,`data-sess="${x.id}" data-k="${k}"`)).join("")}
   <button class="del xs" type="button" data-go="workout" style="text-decoration:underline;margin-top:8px">Did something else, or want to change the day</button></div>`);
  const due=dueMeals(k);
  if(due.length) add("meals",`<div class="card"><div class="eyebrow">What you ate</div>
   ${due.map(([id,name])=>`<div class="meal"><b>${name}</b></div><div class="seg three"><button class="q" data-dmeal="${id}" data-v="q">Quality</button><button class="m" data-dmeal="${id}" data-v="m">In-between</button><button class="n" data-dmeal="${id}" data-v="n">Off plan</button></div><p class="muted xs" style="margin:4px 0 2px"><span style="color:var(--green)">●</span> ${esc(MEAL_EXAMPLES[id].q)}</p>`).join("")}
   <button class="del xs" type="button" data-go="nutrition" style="text-decoration:underline;margin-top:8px">Not sure? Ask in Nutrition</button></div>`);
  return cards }
function dailyCards(){ return dailyDeck().map(c=>c.html) }
const DECK_ORDER=["lesson","workout","meals"];

function shrinkImage(file,maxSide=480,quality=.7){
 return new Promise(resolve=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   try{
    const scale=Math.min(1,maxSide/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL('image/jpeg',quality));
   }catch{resolve(null)}finally{URL.revokeObjectURL(url)}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);resolve(null)};
  img.src=url;
 });
}

function groceryWeek(){return ymd(startOfWeek(today()))}
const FOUNDATION_GROCERIES={
 'Meat & Seafood':['Chicken thighs or breasts','Ground turkey or lean beef','Salmon or canned tuna'],
 'Dairy & Eggs':['Eggs, two dozen','Greek yogurt, large tub','Cottage cheese','Cheese','Milk or almond milk'],
 'Produce':['Bananas','Berries','Apples','Spinach','Broccoli','Carrots','Bell peppers','Onions','Avocados'],
 'Frozen':['Frozen fruit for smoothies','Frozen mixed vegetables'],
 'Pantry':['Oats','Potatoes','Rice','Whole-grain bread','Beans','Olive oil','Nuts','Nut butter','Hummus','Whey or plant protein']
};
function groceryText(headers){ const g={}; for(const x of groceryState().items){ if(x.checked) continue; (g[x.category||'Other']||(g[x.category||'Other']=[])).push(x.name+(x.qty?' ('+x.qty+')':'')) }
 return Object.entries(g).map(([c,xs])=>(headers?c.toUpperCase()+'\n':'')+xs.join('\n')).join(headers?'\n\n':'\n') }
function groceryStarter(){ const f=groceryFoundation(), items=groceryState().items; let n=0;
 for(const [category,names] of Object.entries(FOUNDATION_GROCERIES)) for(const name of names){ if(f.some(x=>x.name.toLowerCase()===name.toLowerCase())) continue; const it={id:'foundation-'+name,name,qty:'',category}; f.push(it); if(!items.some(x=>x.name.toLowerCase()===name.toLowerCase())) items.push({...it,foundationId:it.id,checked:false}); n++ }
 return n }
function groceryFoundation(){
 if(!Array.isArray(F.groceryFoundation)){
  F.groceryFoundation=Object.entries(FOUNDATION_GROCERIES).flatMap(([category,names])=>
   names.map(name=>({id:'foundation-'+name,name,qty:'',category})));
 }
 return F.groceryFoundation;
}
function groceryState(){
 const k=groceryWeek(),state=F.grocery[k]||(F.grocery[k]={items:[]});
 if(!state.foundationLoaded){
  for(const item of groceryFoundation()){
   const existing=state.items.find(x=>x.name.toLowerCase()===item.name.toLowerCase());
   if(existing)existing.foundationId=item.id;
   else state.items.push({...item,foundationId:item.id,checked:false});
  }
  state.foundationLoaded=true;
 }
 return state;
}
function groceryPlan(){const k=groceryWeek();return F.mealPlans[k]||(F.mealPlans[k]=[])}
function groceryAdd(name,qty='',category='Other',repeat=false){
 name=String(name||'').trim().slice(0,120);qty=String(qty||'').trim().slice(0,80);if(!name)return false;
 const items=groceryState().items;
 const existing=items.find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.qty.toLowerCase()===qty.toLowerCase());
 const item=existing||{id:String(fusionId()),name,qty,category,checked:false};
 if(!existing)items.push(item);
 item.checked=false;
 if(repeat&&!item.foundationId){
  item.foundationId=item.id;
  groceryFoundation().push({id:item.id,name,qty,category});
 }
 return true;
}
function groceryIngredients(text,servings=1){
 const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 return lines.slice(0,50).map(line=>{
   const m=line.match(/^([\d.]+)\s+(cups?|tbsp|tsp|oz|lb|g|kg|ml|l|pcs?|pieces?|whole)\s+(.+)$/i);
   if(m)return {name:m[3],qty:(Number(m[1])*servings)+' '+m[2]};
   return {name:line,qty:servings>1?'For '+servings+' servings':''};
 });
}

 if(weeklyAction==='copy'||weeklyAction==='blank'){

   id:String(fusionId()),name:session.title,minutes:session.range.at(-1),

   intensity:day.intense&&session.id==='main'?'vigorous':session.kind==='mobility'?'light':'moderate',

  })));
 }else if(weeklyAction==='follow'||weeklyAction==='dan'){

  F.weeklyPlanHistory=[...(F.weeklyPlanHistory||[]).filter(item=>item.from<current),{from:current,days}];
  toast(days?'Following My Plan':'Following Dan’s plan');
 }else{
  const day=F.weeklyPlanDraft?.[index];
  if(!day)return;
  const position=day.findIndex(session=>session.id===button.dataset.id);
  if(weeklyAction==='add')day.push({id:String(fusionId()),name:'New workout',minutes:30,category:'aerobic',intensity:'moderate',notes:'',link:''});
  if(weeklyAction==='rest'&&confirm('Clear this day’s draft sessions?'))day.length=0;
  if(weeklyAction==='remove'&&position>=0)day.splice(position,1);
  const next=position+(weeklyAction==='up'?-1:1);
  if(['up','down'].includes(weeklyAction)&&position>=0&&next>=0&&next<day.length){
   [day[position],day[next]]=[day[next],day[position]];
  }
 }
 fsave();render();
});

// Rule-based coaching uses the same completed sessions and nutrition records as Track.
// It never fabricates recovery data or claims a live AI analysis.
function fCoachMetrics(reference=today()){
 const keys=Array.from({length:7},(_,i)=>shiftDate(ymd(reference),i-6));
 const completed=keys.map(k=>({date:k,planned:dayDef(k).sessions.filter(x=>sessOf(k,x.id).done).length,custom:fusionActivities(k).length,minutes:totalTrainingMinutes(k)}));
 const workouts=completed.reduce((n,x)=>n+x.planned+x.custom,0);
 const activeDays=completed.filter(x=>x.planned+x.custom>0).length;
 const minutes=completed.reduce((n,x)=>n+x.minutes,0);
 const nutrition=keys.map(k=>({date:k,meals:F.entries.filter(x=>x.type==='meal'&&x.date===k),totals:fTotalsFor(k)}));
 const logged=nutrition.filter(x=>x.meals.length>0);
 const avg=(key)=>logged.length?Math.round(logged.reduce((n,x)=>n+x.totals[key],0)/logged.length):null;
 const quality=keys.reduce((n,k)=>{const d=dayNutrition(k);return {good:n.good+d.q,off:n.off+d.n}}, {good:0,off:0});
 return {workouts,activeDays,minutes,nutritionDays:logged.length,protein:avg('p'),fiber:avg('fiber'),calories:avg('calories'),quality,weightTrend:rolling('wt'),bodyFatTrend:rolling('bf')};
}
function fCoachAdvice(m){
 if(!m.workouts&&!m.nutritionDays)return 'Start by logging a workout or meal; your review will become more useful as data accumulates.';
 if(m.nutritionDays<3)return 'Focus this week: log meals on at least three days so nutrition patterns are easier to interpret.';
 if(m.protein!=null&&m.protein<F.targets.p*.8)return 'Focus this week: improve protein consistency toward your chosen daily target, using foods that fit your preferences.';
 if(m.fiber!=null&&m.fiber<F.targets.fiber*.8)return 'Focus this week: add a fiber-rich food to a meal each day.';
 if(m.activeDays<3)return 'Focus this week: build a consistent, manageable activity routine rather than chasing points.';
 return 'Focus this week: maintain consistency and review trends across several weeks rather than reacting to a single day.';
}
function fCoach(){const m=fCoachMetrics();return `${m.workouts} completed workouts across ${m.activeDays} active days (${m.minutes} min). Meals logged on ${m.nutritionDays} of 7 days${m.protein==null?'':`; average protein ${m.protein}g and fiber ${m.fiber}g per logged day`}. ${fCoachAdvice(m)}`}
// Daily coaching is deterministic, uses only logged data, and does not infer missing recovery metrics.
function fDailyCoach(reference=today()){
 const k=ymd(reference), yesterday=shiftDate(k,-1), d=dayDef(k);
 const activities=fusionActivities(k), planned=d.sessions.filter(x=>sessOf(k,x.id).done);
 const workouts=activities.length+planned.length;
 const minutes=totalTrainingMinutes(k), meals=F.entries.filter(x=>x.type==='meal'&&x.date===k);
 const totals=fTotalsFor(k), previous=fTotalsFor(yesterday);
 const yesterdayMeals=F.entries.filter(x=>x.type==='meal'&&x.date===yesterday);
 const weekly=fCoachMetrics(reference);
 let focus='',reason='',category='Training';
 if(!workouts){
   focus='Choose a manageable activity today, or use today as a recovery day if needed.';
   reason='No workout has been logged today. This does not mean you missed a workout.';
 }else if(meals.length===0){
   category='Nutrition';focus='Log one meal when convenient so your nutrition review can reflect today.';
   reason=`${workouts} workout(s) recorded today; no meals recorded yet.`;
 }else if(totals.p < (Number(F.targets.p)||0)*0.5){
   category='Nutrition';focus='Consider including a protein-rich food in your next meal.';
   reason=`${Math.round(totals.p)}g protein logged toward your ${F.targets.p}g daily target; your day may not be complete.`;
 }else if(totals.fiber < (Number(F.targets.fiber)||0)*0.5){
   category='Nutrition';focus='Consider adding a fiber-rich food such as fruit, vegetables, beans, or whole grains.';
   reason=`${Math.round(totals.fiber)}g fiber logged so far; your day may not be complete.`;
 }else{
   category='Consistency';focus='Keep logging as you go and prioritize recovery appropriate to how you feel.';
   reason=`${workouts} workout(s), ${minutes} training minutes, and ${meals.length} meal entry/entries recorded today.`;
 }
 const yesterdaySummary=yesterdayMeals.length?`Yesterday: ${yesterdayMeals.length} meal entry/entries, ${Math.round(previous.p)}g protein logged.`:'No meal entries recorded yesterday; that is missing data, not evidence of missed meals.';
 return {date:k,category,focus,reason,workouts,minutes,meals:meals.length,weekly,yesterdaySummary,hasWearableRecovery:false};
}

 }

  savedMeals:choose(base.savedMeals,local.savedMeals,remote.savedMeals),

  for(let attempt=0;attempt<4;attempt++){
   const remote=await cloudRequest('/workspace');
   if(activeWorkspace!==user)return;
   const auditBefore=stable(cloudAudit);
   cloudAudit={history:remote.history,pending:remote.pending};
   const local=workspaceData();
   const before=stable(local);
   let desired=local;
   if(remote.revision){
    if(!cloudBase){applyWorkspace(remote.data);desired=workspaceData()}
    else{
     const merged=mergeWorkspace(cloudBase,local,remote.data,preference);
     if(merged.conflict){cloudConflict=true;showCloudStatus('Resolve the conflicting changes to resume sync.',true);return}
     desired=merged.data;
    }
   }
   let saved=remote;
   if(stable(desired)!==stable(remote.data)){
    try{saved=await cloudRequest('/workspace','PUT',{revision:remote.revision,data:desired})}
    catch(error){if(error.status===409)continue;throw error}
   }
   if(activeWorkspace!==user)return;

   }
   const final=stable(after)===before?saved.data:reconciled.data;
   if(stable(final.entries)!==stable(after.entries)||stable(final.supplements)!==stable(after.supplements)||
      stable(final.progress)!==stable(after.progress)||stable(final.savedMeals)!==stable(after.savedMeals)||stable(final.savedWorkouts)!==stable(after.savedWorkouts))applyWorkspace(final);
   const changed=stable(workspaceData())!==before;
   cloudBase=saved.data;cloudConflict=false;
   cloudAudit={history:saved.history,pending:saved.pending};
   saveWorkspaceDevice();
   if(stable(workspaceData())!==stable(cloudBase))queueWorkspaceSync();
   if((changed||auditBefore!==stable(cloudAudit))&&!document.activeElement?.matches('input,textarea,select'))render();

  document.addEventListener("focusin",e=>{ if(field(e.target)) document.body.classList.add("typing") });
  document.addEventListener("focusout",()=>setTimeout(repin,150));
  window.addEventListener("pageshow",repin); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) repin() });
  if(window.visualViewport&&window.visualViewport.addEventListener) window.visualViewport.addEventListener("resize",()=>setTimeout(repin,150)) })();

  if(ds.vitd){ S.profile.vitd=!S.profile.vitd; save(); render(); return }

  if(ds.log){ const kd=ymd(today()), soak=ds.log==="heat"&&ds.kind==="soak", same=S[ds.log].filter(x=>x.d===kd&&(ds.log!=="heat"||(x.kind==="soak")===soak)).length, scored=same>0;
    if(same>=EXTRA_MAX){ toast("Already logged "+(EXTRA_MAX===2?"twice":EXTRA_MAX+" times")+" today"); return }
    S[ds.log].push({id:Date.now(),d:kd,min:+ds.min,...(soak?{kind:"soak"}:{})}); save(); render(); toast("+"+ds.min+" min"+(scored?" · points count once a day":" · +"+PTS[ds.log]+" pt"+(PTS[ds.log]>1?"s":""))); return }
  if(ds.del){ S[ds.del]=S[ds.del].filter(x=>String(x.id)!==ds.id); save(); render(); return }
  if(ds.say){ startSpeech(); return }
  if(t.id==="share"){ shareCard(); return }

  if(t.id==="backup-import"){document.getElementById('backup-file').click();return}
  if(t.id==="backup-resume"){void resumeBackupSync();return}

});

document.addEventListener('change',async e=>{
 if(e.target.id!=='renphoCsv')return;
 const file=e.target.files?.[0];if(!file)return;
 const status=document.getElementById('renphoImportStatus');
 try{
  if(file.size>1000000)throw Error('CSV exceeds 1 MB');
  const text=await file.text(),lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);
  if(lines.length<2)throw Error('CSV has no data rows');
  const parseLine=line=>{const out=[];let cur='',quote=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++}else quote=!quote}else if(c===','&&!quote){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out};
  const header=parseLine(lines.shift()).map(x=>x.toLowerCase().replace(/\s+/g,'_'));
  const ix=k=>header.indexOf(k);
  if(ix('date')<0||ix('weight_lb')<0)throw Error('Required headers: date,weight_lb');
  let added=0;
  for(const line of lines.slice(0,5000)){
   if(!line.trim())continue;
   const row=parseLine(line),date=row[ix('date')],wt=Number(row[ix('weight_lb')]);
   if(!validLogDate(date)||!Number.isFinite(wt)||wt<30||wt>1000)continue;
   const num=k=>ix(k)<0||row[ix(k)]===''?'':Number(row[ix(k)]);
   const bf=num('body_fat_pct'),mm=num('muscle_mass_lb'),metrics={};
   for(const [key,,,limit] of RENPHO_METRICS){const value=num(key);if(value!==''&&Number.isFinite(value)&&value>=0&&value<=limit)metrics[key]=value}
   if(bf!==''&&(!Number.isFinite(bf)||bf<0||bf>80))continue;
   if(mm!==''&&(!Number.isFinite(mm)||mm<0||mm>1000))continue;
   const fields={wt:String(wt),bf:String(bf),mm:String(mm),metrics};
   if(S.weigh.some(x=>x.d===date&&x.source==='RENPHO CSV'&&['wt','bf','mm'].every(k=>x[k]===fields[k])&&JSON.stringify(x.metrics||{})===JSON.stringify(metrics)))continue;
   S.weigh.push({id:fusionId(),d:date,...fields,source:'RENPHO CSV'});
   added++;
  }
  if(!added)throw Error('No new valid rows. Check the CSV format or existing imports.');
  save();render();toast('Imported '+added+' RENPHO measurements');
 }catch(err){if(status)status.textContent=err.message||'Import failed'}
});

  if(f.classList.contains("fAlt")){ const k=f.dataset.k, sid=f.dataset.sid, what=(d.what||"").trim().slice(0,40); S.sess[k]=S.sess[k]||{}; const st=S.sess[k][sid]||{}; if(what){ st.alt=what; st.done=true; if(!st.min){ const def=dayDef(k).sessions.find(x=>x.id===sid); st.min=def.range[1] } } else { delete st.alt; st.done=false } S.sess[k][sid]=st; altOther=null; save(); render(); if(what) toast(what+" counts"); return }
  if(f.id==="fCheck"){ const txt=(d.text||"").trim(); if(!txt) return; mealCheck={text:txt,busy:true,result:null}; render(); const result=await checkMeal(txt); if(mealCheck&&mealCheck.text===txt){ mealCheck={text:txt,busy:false,result}; render(); const v=document.getElementById("checkVerdict"); if(v&&v.scrollIntoView) v.scrollIntoView({block:"nearest"}) } return }
  if(f.id==="fSay"){ const txt=d.text.trim(); if(!txt) return; const res=parseMeal(txt); const touched=applyParsed(nutDay,res); save(); render(); const out=$("#sayOut"); if(out) out.textContent=touched.length?"Added: "+touched.join(" · ")+". Review the meal ratings above.":"Didn't recognize any food words in that. Try naming the foods: eggs, chicken, salad, rice, a beer."; return }
  if(f.id==="fDexa"){
   if(!validLogDate(d.d))return toast("Choose a valid scan date");
   const rows=DEXA_METRICS.filter(([kind])=>d[kind]?.trim());
   if(!rows.length)return toast("Enter at least one scan result");
   for(const [kind] of rows)S.extras.push({id:fusionId(),d:d.d,kind,v:d[kind].trim(),note:d.note.trim()});
   toast("DEXA results saved");
  }
  if(f.id==="fStrengthProgress"){
   if(!validLogDate(d.d)||!d.lift.trim())return toast("Enter a lift and a valid date");
   S.strength.push({id:fusionId(),d:d.d,lift:d.lift.trim(),lb:Number(d.lb),reps:Number(d.reps)});
   strengthSeriesKey=strengthKey(S.strength.at(-1));toast("Strength result saved");
  }
  if(f.id==="fExtra"){ S.extras.push({id:Date.now(),d:d.d,kind:d.kind,v:d.v.trim(),note:d.note.trim()}); toast("Logged") }
  if(f.id==="fSleep"){ S.sleep[ymd(today())]={bed:d.bed,wake:d.wake}; const h=sleepHours(ymd(today())); toast(h!=null?h+" h logged"+(h>=SLEEP_GOAL?" · +"+PTS.sleep:""):"Sleep saved") }
  if(f.id==="fSmoothie"){ S.smoothie=d.smoothie.trim()||DEFAULT_SMOOTHIE; toast("Recipe saved") }
  if(f.id==="fDrink"){ S.drink=d.drink.trim()||DEFAULT_DRINK; toast("Recipe saved") }
  if(f.classList.contains("fSrc")){ S.src=S.src||{}; S.src[f.dataset.k]=d.src.trim(); S.buy=S.buy||{}; S.buy[f.dataset.k]=d.buy.trim(); toast("Saved") }
  save(); render();
});

<script>
/* SD Health Stack PWA update manager. App data stays in browser storage; never clear storage to update. */
(function(){
 const VERSION='9.18.0';
 let pending=false;
  async function activateUpdate(){
    const status=document.getElementById('momentum-update-status');
    if(status){status.style.display='inline';status.textContent='Updating app…';}
    try{
      if('serviceWorker' in navigator){
        const reg=await navigator.serviceWorker.getRegistration();
        if(reg){await reg.update();if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});}
      }
      // Force a fresh navigation without deleting locally saved entries.
      const url=new URL(location.href);url.searchParams.set('momentum-refresh',Date.now().toString());
      location.replace(url.href);
    }catch(e){
      if(status)status.textContent='Update failed. Open this site in Safari and reload.';
    }
  }
  async function checkUpdate(showResult){
    const status=document.getElementById('momentum-update-status');
    try{
      const r=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw Error('Version check unavailable');
      const remote=await r.json();
      const button=document.getElementById('momentum-check-update');
      if(remote.version && remote.version!==VERSION){
        // A newer deployed version is required; older metadata is not an update.
        const newer=(a,b)=>{const aa=a.split('.').map(Number),bb=b.split('.').map(Number);for(let i=0;i<Math.max(aa.length,bb.length);i++){if((aa[i]||0)!==(bb[i]||0))return (aa[i]||0)>(bb[i]||0)}return false};
        if(newer(remote.version,VERSION)){
          pending=true;
          if(button){button.textContent='Install SD Health Stack v'+remote.version;button.onclick=activateUpdate;}
          if(status){status.style.display='inline';status.textContent='New version available';}
        }else if(showResult&&status){status.style.display='inline';status.textContent='Installed version is newer than update metadata.';}
      }else if(showResult&&status){status.style.display='inline';status.textContent='You have the latest version';setTimeout(()=>{if(!pending)status.style.display='none'},3500);}
    }catch(e){if(showResult&&status){status.style.display='inline';status.textContent='Could not check. Try again.';}}
  }
 document.addEventListener('click',e=>{if(e.target?.id==='momentum-check-update'&&!pending)checkUpdate(true)});
 window.addEventListener('pageshow',()=>checkUpdate(false));
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});
 if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(pending)activateUpdate()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(console.warn));
 }
})();
</script>

<script>
/* Reminder sync: bounded requests, explicit app bridge, visible diagnostics. */
(function(){
 const endpoint='https://naomdmnfqudszqmcirrh.supabase.co/functions/v1/momentum-push';
 let active=null,queueTimer=null,attempt=0;
 function status(message){const bridge=window.momentumReminderBridge;
  if(bridge?.status)bridge.status(message);
  else {localStorage.setItem('momentum.reminder.syncstatus',message);const el=document.getElementById('momentumReminderSyncStatus');if(el)el.textContent=message}
 }
 function withDeadline(p,ms){return Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Request exceeded '+ms/1000+' seconds')),ms))])}
 async function sync(){
  if(active)return active;
  active=(async()=>{
   const n=++attempt;
   try{
    status('Preparing sync #'+n+'…');
    const secret=localStorage.getItem('momentum.push.device.secret.v1');
    if(!secret)throw Error('No registered push device. Enable push notifications first.');
    const bridge=window.momentumReminderBridge;
    if(!bridge?.snapshot)throw Error('App data bridge unavailable; reopen SD Health Stack.');
    const snapshot=await withDeadline(Promise.resolve().then(()=>bridge.snapshot()),3000);
    const payload={action:'sync',deviceSecret:secret,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'America/New_York',
     preferences:snapshot.preferences,customReminders:snapshot.customReminders,dailyState:snapshot.dailyState};
    status('Sending sync #'+n+' ('+payload.customReminders.length+' custom reminders)…');
    const controller=new AbortController();
    let timeout=setTimeout(()=>controller.abort(),10000);
    try{
     const response=await withDeadline(fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal}),11000);
     const body=await withDeadline(response.text(),3000);
     let data={};try{data=JSON.parse(body)}catch{}
     if(!response.ok)throw Error((data.error||body.slice(0,140)||'Server error')+' (HTTP '+response.status+')');
     if(data.synced!==true)throw Error('Server did not confirm sync');
     localStorage.setItem('momentum.reminder.lastsync',new Date().toISOString());
     status('Synced successfully at '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+' ('+payload.customReminders.length+' custom reminders).');
    }finally{clearTimeout(timeout)}
   }catch(e){status('Sync failed: '+(e.name==='AbortError'?'Network timeout':e.message||String(e)))}
  })();
  try{return await active}finally{active=null}
 }
 function schedule(){clearTimeout(queueTimer);queueTimer=setTimeout(sync,500)}
 window.momentumSyncReminders=sync;
 window.addEventListener('load',()=>{schedule();setInterval(schedule,60000)});
 window.addEventListener('pageshow',schedule);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule()});
 document.addEventListener('submit',()=>setTimeout(schedule,700));
 document.addEventListener('click',e=>{if(e.target.closest('button,[data-sel],[data-go]'))setTimeout(schedule,800)});
 if(document.readyState==='complete'||document.readyState==='interactive')schedule();
})();
</script>
