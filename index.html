*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{flex:1;padding:14px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));max-width:560px;width:100%;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2.1rem;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
h2{font-size:1.25rem;font-weight:700;margin:26px 0 10px}
h3{font-size:1rem;font-weight:700}
p{margin:0 0 10px;max-width:62ch}
ul{margin:0 0 12px;padding-left:20px}li{margin-bottom:4px}
.muted{color:var(--muted)}
.sm{font-size:.85rem}.xs{font-size:.78rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600;font-family:var(--display)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card.hero{border:0;background:var(--fg);color:var(--bg)}
.card.hero .eyebrow,.card.hero .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-family:var(--display);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor;opacity:.85}
.btn.small{padding:7px 12px;font-size:.85rem}
.btn:focus-visible,.check:focus-visible,.tabbar button:focus-visible,input:focus-visible,select:focus-visible,.seg button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0;flex:1}
.row.tight>*{flex:0 0 auto}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:11px 14px;color:inherit;margin-top:8px}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.check[aria-checked="true"]{background:color-mix(in srgb,var(--green) 16%,var(--panel));border-color:var(--green)}
.check[aria-checked="true"] .box{background:var(--green);border-color:var(--green)}
.check .box svg{width:14px;height:14px}
.check .pts{margin-left:auto;font-family:var(--display);font-weight:900;font-size:.85rem;color:var(--muted);flex:none}
.check[aria-checked="true"] .pts{color:var(--green)}
.hero .check{background:color-mix(in srgb,var(--bg) 14%,transparent);color:inherit}
.hero .check .box{border-color:color-mix(in srgb,var(--bg) 60%,transparent)}
.hero .check[aria-checked="true"]{background:color-mix(in srgb,var(--green) 35%,transparent);border-color:var(--green)}
.hero .check .pts{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.hero .check[aria-checked="true"] .pts{color:#fff}
.minrow{display:flex;gap:6px;margin:6px 0 0 36px;flex-wrap:wrap}
.minrow button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:.75rem;font-family:var(--display);font-weight:700}
.minrow button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hero .minrow button{border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:inherit}
.hero .minrow button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-top:8px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:.8rem;font-weight:600;color:var(--muted);font-family:var(--display)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg[aria-label="Chart period"]{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:12px}
.seg[aria-label="Benefits sections"]{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}
.cloud-json{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.75rem}
#momentumConnections code{overflow-wrap:anywhere}
#fDexa .fgrid{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:8px}
#fDexa input{min-width:0;width:100%}
.seg button.q[aria-pressed="true"]{color:var(--green)}
.seg button.n[aria-pressed="true"]{color:var(--amber)}
.meal{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.meal b{font-family:var(--display)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{background:var(--soft);border:1px solid transparent;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;font-family:var(--display);color:var(--fg);display:inline-flex;gap:6px;align-items:center}
.chips button i{font-style:normal;background:var(--fg);color:var(--bg);border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:.72rem;font-weight:900}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.week .d{background:var(--soft);border-radius:10px;padding:8px 2px;text-align:center;font-size:.7rem;line-height:1.3;border:1px solid transparent}
.week .d b{display:block;font-family:var(--display);font-size:.8rem}
.week .d.today{border-color:var(--accent)}
.week .d.done{background:color-mix(in srgb,var(--green) 18%,var(--panel))}
.week .d .dot{display:block;width:8px;height:8px;border-radius:50%;margin:4px auto 0;background:var(--line)}
.week .d.done .dot{background:var(--green)}
.week .d.intense .dot{background:var(--accent)}
.week .d.done.intense .dot{background:var(--green)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);font-family:var(--display)}
.pill.hot{background:color-mix(in srgb,var(--accent) 18%,var(--panel));color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--green) 18%,var(--panel));color:var(--green)}
.pill.warn{background:color-mix(in srgb,var(--amber) 22%,var(--panel));color:var(--amber)}
.pill.bad{background:color-mix(in srgb,var(--red) 18%,var(--panel));color:var(--red)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat.two{grid-template-columns:repeat(2,1fr)}
.stat>div{background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;font-weight:900}
.stat span{font-size:.7rem;color:var(--muted)}
.hero .stat>div{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.hero .stat span{color:color-mix(in srgb,var(--bg) 70%,transparent)}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.del{background:none;border:0;color:var(--muted);font-size:1rem;padding:0 4px}
.meter{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
[hidden]{display:none!important}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.home-grid .card{min-width:0}.home-progress{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0}.home-progress>div{height:100%;background:var(--green);border-radius:6px}@media(max-width:350px){.home-grid{grid-template-columns:1fr}}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;max-width:100%;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabbar button{min-width:0;width:100%;background:none;border:0;padding:9px 2px 7px;color:var(--muted);font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-family:var(--display);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:.85rem;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:var(--panel)}
summary{cursor:pointer;font-family:var(--display);font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::after{content:"+";color:var(--muted);font-size:1.2rem}
details[open] summary::after{content:"–"}
details>div{padding-top:8px}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:10px 0}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.chart .base{stroke:var(--line);stroke-dasharray:3 3}
.chart .l{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .p{stroke-width:0}
.delta{font-family:var(--display);font-weight:900}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.flat{color:var(--muted)}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.onb{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.onb h1{font-size:2.6rem}
.opts{font-size:.85rem;margin-top:10px}
.opts b{display:block;font-family:var(--display);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:8px 0 2px}
.opts a{color:inherit}
.sharecard{display:none}
.week .d{cursor:pointer}.week .d.sel{background:var(--fg);color:var(--bg)}.week .d.sel .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.navrow button{background:var(--soft);border:0;border-radius:8px;padding:6px 10px;font-weight:700;font-family:var(--display)}
.counter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:8px}
.counter>div{background:var(--soft);border-radius:10px;padding:6px 2px;text-align:center;min-width:0}
.counter .lab{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);font-weight:700}
.counter .ctl{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:2px}
.counter .ctl button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-weight:900;font-size:1rem;line-height:1;padding:0}
.counter .ctl b{font-family:var(--display);min-width:14px;font-size:1rem}
.counter>div.on{background:color-mix(in srgb,var(--green) 16%,var(--panel))}
.gear{background:var(--soft);border:0;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:var(--fg);flex:0 0 auto}
.gear svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plan{white-space:pre-wrap;font-size:.9rem;background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:8px}
.hero .plan{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.scorestrip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 6px;margin:8px 0 14px}
.scorestrip>div{text-align:center;min-width:0}.scorestrip b{display:block;font-family:var(--display);font-size:1.1rem;font-weight:900;line-height:1.1}.scorestrip span{font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;opacity:.7;white-space:nowrap}
.altrow{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 2px 36px}.altrow button{background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:3px 9px;font-size:.72rem;font-family:var(--display);font-weight:700}.altrow button[aria-pressed="true"]{background:var(--green);color:#fff;border-style:solid;border-color:var(--green)}
.hero .altrow button{border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:inherit}
.seg.three{grid-template-columns:repeat(3,1fr)}.seg button.m[aria-pressed="true"]{color:var(--amber)}
/* The tab bar is fixed to the viewport, so the page needs room underneath it. */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

 .workout-tile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.workout-tile{position:relative;min-width:0;border:1px solid var(--line,#aaa);border-radius:14px;overflow:hidden}.workout-tile-main{width:100%;min-height:102px;border:0;background:transparent;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 34px 12px 12px;font:inherit;font-weight:650;overflow-wrap:anywhere;text-align:center}.workout-tile-icon{font-size:26px}.workout-tile-edit{position:absolute;right:4px;top:4px;min-width:34px;min-height:34px;border:0;background:transparent;color:inherit;font-size:20px}

/* ===== v9.14 visual overhaul: one accent, a calmer type scale, more room, some motion ===== */
:root{
  --bg:#f5f5f1; --panel:#ffffff; --fg:#15181b; --muted:#687078; --line:#e7e6e0; --soft:#f1f0eb;
  --accent:#e2512a; --accent-ink:#ffffff; --green:#1f8a55;
  --shadow:0 1px 2px rgba(20,24,27,.05),0 10px 28px -16px rgba(20,24,27,.22);
  --r-card:20px; --r-ctl:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0e1012; --panel:#181b1e; --fg:#eef0f2; --muted:#9aa3ab; --line:#272c31; --soft:#20252a; --accent:#ff6b42; --accent-ink:#1a0b05; --shadow:0 0 0 1px #272c31 }}
:root[data-theme="dark"]{ --bg:#0e1012; --panel:#181b1e; --fg:#eef0f2; --muted:#9aa3ab; --line:#272c31; --soft:#20252a; --accent:#ff6b42; --accent-ink:#1a0b05; --shadow:0 0 0 1px #272c31 }
body{font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
main{padding:18px max(20px,env(safe-area-inset-right,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}

  let firstEarned=null;

    if(value>0&&(firstEarned===null||key<firstEarned))firstEarned=key;
  }
  const daysThisWeek=dayNumber(todayKey)-dayNumber(sunday);
  const daysAllTime=firstEarned===null?0:dayNumber(todayKey)-dayNumber(firstEarned);
  const firstSunday=firstEarned===null?null:ymd(startOfWeek(parseD(firstEarned)));
  const firstFullWeek=firstSunday===firstEarned?firstEarned:firstSunday&&shiftDate(firstSunday,7);
  const fullWeeks=firstFullWeek===null?0:(dayNumber(sunday)-dayNumber(firstFullWeek))/7;
  let completedWeekPoints=0, completedLifetimeWeekPoints=0;
  for(const [key,value] of points.byDate){
    if(key>=sunday&&key<todayKey)completedWeekPoints+=value;

function vo2FromTest(t,kg){
  if(!kg) return null;
  if(t.mod==="bike"){ const pmax=t.v/0.75; return 10.8*pmax/kg+7 }
  if(t.mod==="row"){ const sec=t.v; if(!sec) return null; const pace=sec/2000; const w=2.8/Math.pow(pace,3); return 10.8*w/kg+7 }
  if(t.mod==="run"){ const sec=t.v; if(!sec) return null; const tmin=sec/60, v=1609.34/tmin; const vo2=-4.6+0.182258*v+0.000104*v*v; const pct=0.8+0.1894393*Math.exp(-0.012778*tmin)+0.2989558*Math.exp(-0.1932605*tmin); return vo2/pct }
  return null;
}

/* Fitness age: the age at which this VO2 max would be exactly average for the person's sex.

const FRIEND={m:[[25,48.0],[35,42.4],[45,37.8],[55,32.6],[65,28.2],[75,24.4]],f:[[25,37.6],[35,30.2],[45,26.7],[55,23.4],[65,20.0],[75,18.3]]};
function friendMedian(age,sex){ const T=FRIEND[sex==="f"?"f":sex==="m"?"m":""]; if(!T||!age) return null; const a=Math.min(75,Math.max(25,age)); for(let i=1;i<T.length;i++) if(a<=T[i][0]){ const [a0,v0]=T[i-1],[a1,v1]=T[i]; return v0+(v1-v0)*(a-a0)/(a1-a0) } return T[T.length-1][1] }
function fitnessAge(v,sex){ const T=FRIEND[sex==="f"?"f":sex==="m"?"m":""]; if(!T||v==null||!isFinite(v)||v<=0) return null; let age;
  if(v>=T[0][1]) age=T[0][0]-(v-T[0][1])*(T[1][0]-T[0][0])/(T[0][1]-T[1][1]);
  else if(v<=T[T.length-1][1]){ const n=T.length-1; age=T[n][0]+(T[n][1]-v)*(T[n][0]-T[n-1][0])/(T[n-1][1]-T[n][1]) }
  else for(let i=1;i<T.length;i++) if(v>=T[i][1]){ const [a0,v0]=T[i-1],[a1,v1]=T[i]; age=a0+(v0-v)*(a1-a0)/(v0-v1); break }

function fitnessAgeNow(end){ const p=S.profile||{}, age=+p.age||null, kg=kgNow(), lim=end||ymd(today());

const HEALTH_GOALS={health:{name:'General health',minutes:150},enhanced:{name:'Additional health benefits',minutes:300},weight:{name:'Weight management',minutes:225}};

function strengthPoints(r){
 if(!r||!['full','upper','lower','partial','limited'].includes(r.coverage)||!['light','challenging'].includes(r.effort)||!['single','multiple'].includes(r.volume))return 5; // Unassessed logged strength receives provisional minimum credit.
 if(r.effort==='light'||r.coverage==='limited')return 5;
 if(r.effort==='challenging'&&r.volume==='multiple'&&['full','upper','lower'].includes(r.coverage))return 15;

}

 const opt=(value,label,current)=>`<option value="${value}" ${current===value?'selected':''}>${label}</option>`;
 return `<div class="fgrid"><label>Muscle groups<select name="strengthCoverage">${opt('full','Full body',r.coverage)}${opt('upper','Upper-body split',r.coverage)}${opt('lower','Lower-body split',r.coverage)}${opt('partial','Several groups / partial',r.coverage)}${opt('limited','One or two groups',r.coverage)}</select></label><label>Training effort<select name="strengthEffort">${opt('challenging','Challenging reps',r.effort)}${opt('light','Light / easy',r.effort)}</select></label><label>Working sets<select name="strengthVolume">${opt('multiple','Multiple sets per exercise',r.volume)}${opt('single','Mostly one set',r.volume)}</select></label></div>`;

function healthWeekly(ref=today()){
 const wk=weekKeys(ref),goal=healthGoal();let aerobic=0;const dailyStrength=[];const coverage=new Set();
 for(const k of wk){
  const day=dayDef(k),source=F.daySources?.[k]||'dan',replaced=fusionReplacements(k).length>0;
  let best=0;
  const addStrength=assessment=>{
   best=Math.max(best,strengthPoints(assessment));
   // Coverage is a weekly union, independent of session order and daily score ties.
   if(assessment?.coverage==='full'){coverage.add('upper');coverage.add('lower')}
   else if(['upper','lower'].includes(assessment?.coverage))coverage.add(assessment.coverage);
  };
  if(source==='dan')for(const x of day.sessions){
   const st=sessOf(k,x.id);if(!st.done||replaced&&x.id==='main')continue;
   const min=activityMinutes(st.min??x.range[1]);if(!min)continue;
   if(x.kind==='cardio')aerobic+=min*(day.intense?2:1);
   if(x.kind==='boot')aerobic+=min; // half vigorous cardio, half resistance: no double counting
   if(x.kind==='lift'||x.kind==='boot'){
    addStrength((F.strengthAssessments||{})[k]);
   }
  }
  for(const x of fusionActivities(k)){
   const min=activityMinutes(x.minutes);if(!min)continue;
   const cat=x.healthCategory||healthClassify((x.description||'')+' '+(x.components||''));
   const effort=x.intensity==='vigorous'?2:x.intensity==='light'?0:1;
   if(cat==='aerobic')aerobic+=min*effort;
   if(cat==='mixed'){const cardioPart=String(x.components||'').match(/(?:^|;)\s*(\d+(?:\.\d+)?)\s*min(?:utes)?\s*(?:dedicated\s*)?cardio/i);aerobic+=(cardioPart?Math.min(min,Number(cardioPart[1])):min*.5)*effort;}

function chart(points,{color="var(--accent)",fmtV=v=>v,baseline=null,height=90}={}){
  const pts=points.filter(p=>p.v!=null&&Number.isFinite(p.v));
  if(!pts.length) return `<p class="muted xs">No entries in this period.</p>`;
  const W=320,H=height,pl=34,pr=8,pt=10,pb=18;
  const xs=pts.map(p=>parseD(p.d).getTime()); const x0=Math.min(...xs),x1=Math.max(...xs);
  let vs=pts.map(p=>p.v); if(baseline!=null) vs=vs.concat(baseline);
  let lo=Math.min(...vs),hi=Math.max(...vs); if(hi-lo<1e-6){lo-=1;hi+=1} const pad=(hi-lo)*.15; lo-=pad; hi+=pad;
  const X=t=>x0===x1?(pl+W-pr)/2:pl+(t-x0)/(x1-x0)*(W-pl-pr), Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const path=pts.map((p,i)=>(i?"L":"M")+X(parseD(p.d).getTime()).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const dots=pts.map(p=>`<circle class="p" cx="${X(parseD(p.d).getTime()).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="${color}"><title>${esc(p.label||p.d)} · ${esc(fmtV(p.v))}</title></circle>`).join("");
  const base=baseline!=null?`<line class="base" x1="${pl}" x2="${W-pr}" y1="${Y(baseline).toFixed(1)}" y2="${Y(baseline).toFixed(1)}"/>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${base}<path class="l" d="${path}" stroke="${color}"/>${dots}
  <text x="2" y="${pt+4}">${fmtV(hi-pad)}</text><text x="2" y="${H-pb}">${fmtV(lo+pad)}</text>
  <text x="${pl}" y="${H-4}">${fmt(pts[0].d)}</text>${x0!==x1?`<text x="${W-pr}" y="${H-4}" text-anchor="end">${fmt(pts[pts.length-1].d)}</text>`:""}</svg>`;
}

const WEEKLY_SESSION_TYPES={aerobic:'Aerobic',strength:'Strength',mixed:'Mixed cardio + strength',mobility:'Mobility',other:'Other'};

function weeklyPlanFor(date){
 return (F.weeklyPlanHistory||[]).findLast(version=>version.from<=date)?.days??null;
}
function workoutPlanForProgress(date){
 const now=today(), currentWeek=weekKeys(now);
 return weeklyPlanFor(currentWeek.includes(date)?ymd(now):date);
}
function weeklyPlanLog(date,id){
 return fusionActivities(date).find(entry=>entry.weeklySessionId===id);
}
function linkableWeeklyActivities(date,session){
 const isStrength=['strength','mixed'].includes(session.category);
 return fusionActivities(date).filter(entry=>!entry.weeklySessionId&&
  (!isStrength||['strength','mixed'].includes(entry.healthCategory)));
}
function weeklyPlanStrength(week){
 let planned=0,completed=0;
 for(const date of week){
  const plan=workoutPlanForProgress(date);
  if(!plan)continue;
  for(const session of plan[parseD(date).getDay()]){
   if(!['strength','mixed'].includes(session.category))continue;
   planned++;
   const entry=weeklyPlanLog(date,session.id);
   if(entry&&['strength','mixed'].includes(entry.healthCategory))completed++;
  }
 }
 return {planned,completed};
}

function vSupps(){
  const key=ymd(today()), sp=S.supps[key]||{};
  return `
  <p class="muted">Only things with real evidence. Cheap, third-party tested, no proprietary blends, no peptides, no brand tax.</p>
  <h2>Today</h2>
  <div class="card">${SUPPS.filter(s=>!s.optional||sp[s.k]||S.profile&&S.profile.vitd).map(s=>checkBtn(!!sp[s.k],s.name,(IN_DRINK.includes(s.k)?"in the recovery drink · ":"")+s.when,s.pts,`data-supp="${s.k}" data-k="${key}"`)).join("")}
  <p class="muted xs" style="margin-top:8px">One tap on the recovery drink logs it here and in Nutrition (+${DRINK_PROTEIN} g protein) and ticks creatine and collagen, since they're in it. Tick those on their own on rest days.</p>
  <p class="muted xs" style="margin-top:10px">Vitamin D is off the list unless you've been tested low: <button class="del" data-vitd="1" style="text-decoration:underline">${S.profile&&S.profile.vitd?"remove it":"add it"}</button>.</p></div>
  <div class="card hero"><div class="eyebrow">Post-workout recovery drink</div><h2 style="margin:4px 0 8px;font-size:1.4rem">All in one shaker</h2>
  <ul style="opacity:.92">${S.drink.split("\n").filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
  <p class="muted xs">Whey for the protein, bicarb and potassium to replace what you sweat out and buffer the hard days, magnesium for recovery and sleep, collagen for tendons. Creatine goes in here too.</p>
  <details style="background:transparent;border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:inherit"><summary>Edit recipe</summary><div><form id="fDrink"><textarea name="drink">${esc(S.drink)}</textarea><button class="btn small" style="margin-top:8px">Save recipe</button></form></div></details></div>
  <h2>What to buy</h2>
  <p class="muted xs">Rated for purity on Labdoor or ConsumerLab, cheap per dose. Edit any line to the brand you actually use.</p>
  ${SUPPS.map(s=>`<details><summary>${esc(s.name)}</summary><div><p class="sm">${esc((S.src||{})[s.k]||s.src)}</p><p class="xs"><a href="${esc((S.buy||{})[s.k]||BUY[s.k])}" target="_blank" rel="noopener">Buy link →</a></p><form class="fSrc" data-k="${s.k}"><div class="field"><label class="f">My pick</label><input name="src" value="${esc((S.src||{})[s.k]||"")}" placeholder="Brand, where you buy it, price"></div><div class="field"><label class="f">My link</label><input type="url" name="buy" value="${esc((S.buy||{})[s.k]||"")}" placeholder="https://…"></div><button class="btn small">Save</button></form></div></details>`).join("")}
  <h2>The evidence</h2>
  <details><summary>Creatine monohydrate</summary><div><p>The most studied supplement in sport. Strength, lean mass, and growing data on cognition and recovery. 3–5 g daily, every day, no loading needed. Timing barely matters. Skip HCl, buffered, gummies.</p></div></details>
  <details><summary>Collagen peptides</summary><div><p>15 g about an hour before loading increases collagen synthesis in tendon and ligament. Modest but real, and cheap. Vitamin C helps the reaction but a normal diet covers it; no need to add any.</p></div></details>
  <details><summary>Omega-3 fish oil</summary><div><p>Anti-inflammatory, supports recovery and cardiovascular health when EPA+DHA is dosed properly: 2–3 g combined daily with a meal. Read the label; that's often 3–4 capsules of a cheap bottle. Two servings of fatty fish a week does the same job.</p></div></details>
  <details><summary>Vitamin D</summary><div><p>Only worth taking if you're low, which is common in Rochester from October to April. It doesn't help if your level is normal. Ask primary care for a level, then dose to it.</p></div></details>
  <details><summary>Electrolytes and magnesium</summary><div><p>Sodium and potassium are what you sweat out in a bootcamp; the drink covers it. Magnesium glycinate 200–400 mg: weak-to-moderate evidence for sleep and cramps, very safe, easy on the stomach.</p></div></details>
  <h2>Use with a plan</h2>
  <details><summary>Caffeine</summary><div><p><b>Helps:</b> 1–3 mg per kg (roughly 100–250 mg, one to two coffees) 30–60 minutes before a hard session improves power, endurance and perceived effort. It's one of the few supplements with decades of evidence.</p><p><b>Hurts:</b> anything within 8–10 hours of bed cuts deep sleep even if you fall asleep fine. More than ~400 mg a day raises anxiety and resting heart rate. Daily use builds tolerance, so the pre-workout boost fades unless you keep most days modest.</p><p><b>How to use it:</b> wait 60–90 minutes after waking for the first cup; coffee or plain caffeine, not pre-workout blends; last caffeine by early afternoon; keep two or three days a week low so hard days still feel the kick.</p></div></details>
  <details><summary>Nicotine</summary><div><p><b>What's real:</b> at very low doses (1–2 mg, gum or pouch) nicotine modestly improves attention and reaction time in some studies, which is why it's had a moment in productivity circles.</p><p><b>Why we don't bother:</b> the doses that help are smaller than most products sell, the window between "a little sharper" and "dependent" is narrow, it raises blood pressure and heart rate, and the upside is the same you'd get from caffeine, sleep and a walk outside. Addiction risk for a small cognitive bump isn't a trade worth making. If you're already using it, this is the place to taper, not add.</p></div></details>
  <h2>Not on the list, on purpose</h2>
  <details><summary>CBD</summary><div><p>No good evidence for pain, recovery or sleep at the doses in gummies and oils. Products vary widely in what they actually contain, and some include THC.</p></div></details>
  <details><summary>Peptides (BPC-157, TB-500 and friends)</summary><div><p>Animal data and anecdotes, no controlled human trials, no quality control on what's in the vial, and banned in tested sport. Not something to buy off the internet.</p></div></details>
  <details><summary>GLP-1s (semaglutide, tirzepatide)</summary><div><p>Real drugs with real evidence, for people who medically need them. They cost muscle as well as fat unless protein and strength training are dialed in, which is this whole program. Use only if medically indicated and prescribed, never from a compounding website.</p></div></details>
  <details><summary>Testosterone, pre-workouts, fat burners, "joint blends"</summary><div><p>Testosterone is a medical decision based on symptoms and labs, not a supplement. The rest are caffeine and marketing. Proprietary blends hide the doses so you can't tell what you're taking.</p></div></details>
  <div class="note">Rule of thumb: if it's cheap, single-ingredient, and has been studied for decades, it's on the list. If it needs a syringe, a subscription, or an influencer, it isn't.</div>`;
}

function vPerks(){

  <div class="card"><div class="row" style="justify-content:space-between"><h3>Hot tub / warm soak</h3><span class="pill">${sm} min this week</span></div>
  <p>A warm bath or shower 1–2 hours before bed may help you fall asleep faster. A hot tub offers similar passive heat. Research on lasting cardiovascular benefits is mixed.</p>
  <p class="muted sm">Keep hot tub water at 104°F or below. Avoid alcohol before or during use.</p>
  <p class="muted xs"><a href="https://doi.org/10.1016/j.smrv.2019.04.008" target="_blank" rel="noopener">Sleep research</a> · <a href="https://doi.org/10.1016/j.ajpc.2025.101082" target="_blank" rel="noopener">Cardiovascular research</a> · <a href="https://www.cdc.gov/healthy-swimming/safety/what-you-can-do-to-stay-healthy-in-hot-tubs.html" target="_blank" rel="noopener">CDC guidance</a></p>

function perkCard(k,title,pts,mins,blurb,links){ const n=S[k].filter(x=>weekKeys().includes(x.d)).length; const recent=[...S[k]].sort((a,b)=>a.d<b.d?1:-1).slice(0,3);

const HEALTH_API_KEY='momentumfusion.health.api.v1';

 return header('Import Health Data','Photo and screenshot recognition')+`

 <p class="muted xs">Beta shares a daily limit of 10 image analyses.</p>
 <input id="healthScreenshot" type="file" accept="image/*" aria-label="Choose a scale photo or health screenshot"><div id="healthPreview" style="margin-top:12px"></div><p id="healthImportMessage" class="muted sm" role="status">Choose an image, then tap Scan image.</p><button class="btn" type="button" data-health-analyze>Scan image</button></div>
 <div id="healthExtractResult"></div>
 <div class="card"><h3>Recent imports</h3>${recent.length?recent.map(x=>`<div class="frow"><span><b>${esc(x.source)} · ${esc(x.kind)}</b><br><small class="muted">${esc(x.date)} · ${esc(x.summary)}</small></span><button class="btn small ghost" data-health-date="${esc(x.id)}">Correct date</button><button class="btn small ghost" data-health-remove="${esc(x.id)}">Remove</button></div>`).join(''):'<p class="muted xs">No health screenshots imported yet.</p>'}<p class="muted xs">Measurements are stored in this browser. Screenshots are not retained by the app.</p></div>`;

function renderHealthExtract(){
 const el=document.getElementById('healthExtractResult');if(!el)return;
 if(!healthExtracted){el.innerHTML='';return}
 const d=healthExtracted;
 const fields=d.kind==='workout'?[['activity','Activity'],['minutes','Minutes'],['activeCalories','Active calories'],['heartRate','Average HR']]:d.kind==='weight'?[['weight','Weight (lb)'],['bodyFat','Body fat (%)'],['muscle','Muscle (lb)']]:[['recovery','Recovery (%)'],['sleep','Sleep (hours)'],['strain','Strain'],['hrv','HRV (ms)'],['heartRate','Resting HR']];
 if(d.kind==='weight')for(const [key,label,unit] of RENPHO_METRICS)if(d.metrics?.[key]!=null)fields.push([key,label+(unit?' ('+unit.trim()+')':'')]);
 el.innerHTML=`<div class="card"><h3>Recognized ${d.kind==='weight'?'scale readings':esc(d.kind)}</h3><p class="muted sm">${esc(d.source)} · ${esc(d.confidence||'unknown')} confidence</p><label>Measurement date<input id="healthConfirmedDate" type="date" value="${esc(d.date||'')}" max="${ymd(today())}"></label><p class="muted xs">${d.date?'Verify the date and readings before saving.':'Choose the date you weighed in.'}</p><div class="fgrid">${fields.map(([k,label])=>d.kind==='weight'?`<label class="f">${esc(label)}<input data-health-value="${k}" type="number" step="any" min="0" inputmode="decimal" placeholder="Not visible" value="${esc(d[k]??d.metrics?.[k]??'')}"></label>`:`<div><span class="muted xs">${esc(label)}</span><p><b>${esc(d[k]??'Not visible')}</b></p></div>`).join('')}</div>${d.warnings&&d.warnings.length?`<p class="muted sm">${d.warnings.map(esc).join(' · ')}</p>`:''}<p class="muted xs">${d.kind==='weight'?'Leave unreadable readings blank.':'Only visible readings are extracted.'}</p><button class="btn" type="button" data-health-save ${d.kind!=='weight'&&d.confidence==='low'?'disabled':''}>Save recognized data</button></div>`;
}
async function analyzeHealthScreenshot(){
 const file=document.getElementById('healthScreenshot')?.files?.[0],message=document.getElementById('healthImportMessage');
 const endpoint=HEALTH_SUPABASE_URL+'/functions/v1/momentum-extract-health';
 if(!file){if(message)message.textContent='Choose an image first.';return}
 if(!file.type.startsWith('image/')||file.size>20*1024*1024){if(message)message.textContent='Choose a photo or screenshot under 20 MB.';return}

 const btn=document.querySelector('[data-health-analyze]');if(btn)btn.disabled=true;
 if(message)message.textContent='Scanning image…';healthExtracted=null;renderHealthExtract();
 try{
  const image=await (/^image\/(png|jpeg|webp)$/.test(file.type)&&file.size<=5*1024*1024
   ?new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})
   :shrinkImage(file,2400,.9));
  if(!image||image.length>7000000)throw Error('Could not open this photo. Try a JPG or screenshot.');
  const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,includeScaleMetrics:true})});
  const result=await res.json();if(!res.ok)throw Error(result.error||'Image analysis failed');
  if(document.getElementById('healthScreenshot')?.files?.[0]!==file)return;
  if(!['workout','weight','recovery'].includes(result.kind))throw Error('No supported health measurements found.');
  healthExtracted=result;renderHealthExtract();if(message)message.textContent='Review the readings below before saving.';
 }catch(e){if(message)message.textContent='Could not scan image: '+String(e.message||e)}finally{if(btn)btn.disabled=false}
}
function saveRecognizedHealth(){
 if(!healthExtracted)return;const x=healthExtracted;
 const d={...x,source:String(x.source||'Other'),date:document.getElementById('healthConfirmedDate')?.value||'',kind:x.kind,intensity:x.intensity||'moderate'};
 for(const k of ['minutes','activeCalories','heartRate','weight','bodyFat','muscle','recovery','sleep','strain','hrv'])d[k]=x[k]===null||x[k]===undefined?'':String(x[k]);
 if(d.kind==='weight'){
  d.metrics={};
  for(const input of document.querySelectorAll('[data-health-value]')){
   const key=input.dataset.healthValue;
   if(['weight','bodyFat','muscle'].includes(key))d[key]=input.value;
   else if(input.value!=='')d.metrics[key]=Number(input.value);
  }
 }
 const error=saveHealthImport(d);if(error){const msg=document.getElementById('healthImportMessage');if(msg)msg.textContent=error;return}
 healthExtracted=null;render();toast('Measurements saved');
}
function saveHealthImport(d){
 const n=k=>d[k]===''?null:Number(d[k]);
 const date=d.date,kind=d.kind,source=d.source;
 if(!validLogDate(date))return 'Choose a valid date that is not in the future.';
 const cutoff=new Date(today());cutoff.setFullYear(cutoff.getFullYear()-2);if(date<ymd(cutoff))return 'The date is more than two years old. Please correct the year before saving.';
 if(!['workout','recovery','weight'].includes(kind))return 'Choose a measurement type.';
 const record={id:fusionId(),date,kind,source,values:{}};
 if(kind==='workout'){
  const minutes=n('minutes');if(!(minutes>0&&minutes<=1440)||!String(d.activity||'').trim())return 'Enter a workout name and valid duration.';
  const activeCalories=n('activeCalories');if(activeCalories!==null&&(!Number.isFinite(activeCalories)||activeCalories<0||activeCalories>20000))return 'Check active calories.';
  const duplicate=F.entries.some(x=>x.type==='activity'&&x.date===date&&Math.abs((Number(x.minutes)||0)-minutes)<=5&&String(x.description||'').toLowerCase()===String(d.activity).trim().toLowerCase());
  if(duplicate)return 'Possible duplicate workout: a matching activity and duration are already logged. No changes saved.';
  record.entryId=fusionId();record.summary=`${String(d.activity).trim()} · ${minutes} min`;
  record.values={activity:String(d.activity).trim(),minutes,activeCalories,heartRate:n('heartRate')};
  F.entries.push({id:record.entryId,date,type:'activity',description:record.values.activity,minutes,intensity:d.intensity||'moderate',planAction:'extra',caloriesBurned:activeCalories,calorieSource:activeCalories===null?null:'wearable-active',source:'screenshot-confirmed'});
 }else if(kind==='weight'){
  const weight=n('weight');if(!(weight>0&&weight<=1400))return 'Enter a valid weight in pounds.';
  const bodyFat=n('bodyFat'),muscle=n('muscle'),metrics={};
  if(bodyFat!==null&&!(bodyFat>=0&&bodyFat<=100))return 'Check body fat percentage.';
  if(muscle!==null&&!(muscle>=0&&muscle<=1000))return 'Check muscle mass.';
  for(const [key,label,,limit] of RENPHO_METRICS){
   const value=d.metrics?.[key];if(value==null)continue;
   if(!(typeof value==='number'&&value>=0&&value<=limit))return 'Check '+label.toLowerCase()+'.';
   metrics[key]=value;
  }
  const prior=F.healthImports.find(x=>x.kind==='weight'&&x.date===date&&String(x.source).toLowerCase()===source.toLowerCase());
  const existing=prior&&S.weigh.find(x=>String(x.id)===String(prior.weighId));
  if(existing){
   if(Number(existing.wt)!==weight)return 'A different weight from this source is already logged on that date. Remove it before replacing.';
   const added=Object.fromEntries(Object.entries(metrics).filter(([key])=>existing.metrics?.[key]==null));
   const addFat=!existing.bf&&bodyFat!==null,addMuscle=!existing.mm&&muscle!==null;
   if(!Object.keys(added).length&&!addFat&&!addMuscle)return 'These readings are already saved.';
   existing.metrics={...existing.metrics,...added};
   if(addFat){existing.bf=String(bodyFat);prior.values.bodyFat=bodyFat}
   if(addMuscle){existing.mm=String(muscle);prior.values.muscle=muscle}
   save();fsave();return null;
  }
  record.values={weight,bodyFat,muscle};record.summary=`${weight} lb`;
  record.weighId=fusionId();
  S.weigh.push({id:record.weighId,d:date,source:source+' image',wt:String(weight),bf:bodyFat==null?'':String(bodyFat),mm:muscle==null?'':String(muscle),metrics});
  save();
 }else{
  const vals=['recovery','sleep','strain','hrv','heartRate'].map(k=>n(k));if(vals.every(x=>x===null))return 'Enter at least one recovery or sleep measurement.';
  if(F.healthImports.some(x=>x.kind==='recovery'&&x.date===date&&x.source===source))return 'A recovery entry from this source is already logged for that date.';
  record.values=Object.fromEntries(['recovery','sleep','strain','hrv','heartRate'].map((k,i)=>[k,vals[i]]));
  record.summary=[vals[0]!=null?`Recovery ${vals[0]}%`:'',vals[1]!=null?`Sleep ${vals[1]} h`:'',vals[2]!=null?`Strain ${vals[2]}`:''].filter(Boolean).join(' · ')||'Recovery metrics';
 }
 F.healthImports.push(record);fsave();return null;
}

/* =========================== DAILY LESSON + TODAY'S THREE ===========================
   One short lesson per program day, starting at each person's profile start date.
   The full 365-day sequence repeats after the first year. */
const LESSONS=[
 {"m": 1, "tag": "Start here", "t": "Start where you are", "b": "It's day one. Most people who start a fitness plan are gone within a couple of months, usually because they tried to change everything at once. We'll go slower. This week you learn how the program works and log what you already do. Nothing new yet. Read the lesson, tap what's true, close the app."},
 {"m": 1, "tag": "Start here", "t": "Inputs and outputs", "b": "You control a handful of inputs: how you move, what you eat, how you sleep. The app scores those every day. Every couple of months you measure the outputs: a fitness test, muscle, body fat. Keep the inputs steady and the outputs follow, usually later than you'd like. Your only job today is today's inputs."},
 {"m": 1, "tag": "Start here", "t": "Majority rules", "b": "You don't need a perfect week. Eat well about 70 percent of the time and the rest is yours: the beer, the dessert, pizza night with the kids. Hit 80 and you're ahead of nearly everyone. I've watched a lot of patients chase perfect. Most quit by week three. Aim for most, and keep going."},
 {"m": 1, "tag": "Start here", "t": "Why we don't count calories", "b": "Counting works on paper and fails in real kitchens. Labels are off, portions are guesses, and almost nobody keeps it up past a few weeks. So we count plates instead. Protein and produce on the plate, most meals. Do that and the calories tend to sort themselves out, without a food scale or an app full of numbers."},
 {"m": 1, "tag": "Start here", "t": "The scale is the wrong scoreboard", "b": "Body weight can't tell muscle from fat. Lose five pounds of fat, gain five of muscle, and the scale says nothing happened while your body changed completely. That's why we track body composition and a fitness test. Weight still gets logged, once a week. It's one number among several, and rarely the most useful."},
 {"m": 1, "tag": "Start here", "t": "One program", "b": "People come in wanting to lose fat or to build muscle, and they expect two different plans. The plan is the same: enough protein, strength work three days a week, produce at most meals, sleep. Fat goes down and muscle goes up on the same habits. What you came for matters less than doing those four things."},
 {"m": 1, "tag": "Start here", "t": "A minute a day", "b": "When you open the app it shows three things: a lesson, your workout, what you ate. A few taps each. The whole thing should take under a minute. If you're typing paragraphs or doing math, something's wrong with the app and I want to hear about it. A rough record every day beats a perfect one for a week."},
 {"m": 1, "tag": "Start here", "t": "The plate", "b": "Picture your dinner plate. A palm-size piece of protein. Half the plate fruit, vegetables or other unprocessed food. The last quarter is whatever you like. That's the entire nutrition plan. Three plates like that a day gets most people to their protein and produce targets without measuring a thing."},
 {"m": 1, "tag": "Start here", "t": "Protein first", "b": "Protein builds and holds muscle, and it keeps you full longer than anything else on the plate. Most adults fall short, and breakfast is where it usually happens. Aim for a palm-size serving at every meal: eggs, Greek yogurt, chicken, fish, beans. If you only change one meal this month, make it breakfast."},
 {"m": 1, "tag": "Start here", "t": "Half the plate", "b": "The research on fruit and vegetables keeps landing near the same figure: about 800 grams a day, roughly five fist-size servings. You don't need to weigh it. Fill half your plate at each meal and you're most of the way there. Frozen counts. Oats, potatoes and rice belong on that half too, as long as they didn't come out of a box."},
 {"m": 1, "tag": "Start here", "t": "Three ratings", "b": "Every meal gets one of three. Quality has protein and fruit or veg. In-between is real food that's missing one of those, like oatmeal with no protein. Off plan has neither. Don't agonize over which; pick the closest and move on. In-between still earns half credit, which is a lot better than not logging."},
 {"m": 1, "tag": "Start here", "t": "Earn the beer", "b": "Nothing is banned. Eat well most of the week and the drinks and dessert fit fine. The app counts them so you can see your own ratio, never to scold you. Alcohol gets a separate line because it does something dessert doesn't: it cuts into sleep and recovery. Seven a week is where I'd draw it."},
 {"m": 1, "tag": "Start here", "t": "Stock the house", "b": "Most eating plans fail at the grocery store. If the food isn't in the house on Wednesday night, you're ordering out. So buy the same foundation every Sunday: a few proteins, eggs, yogurt, frozen fruit and vegetables, a bag of greens, oats. With that in the kitchen, a quality meal is the easy option."},
 {"m": 1, "tag": "Start here", "t": "When you're not sure", "b": "You'll eat at restaurants, at a friend's house, at a game. Ask two questions: is there a palm of protein, and is there fruit or a vegetable? Both makes it quality, one makes it in-between. A burger with a side salad is fine. If you can't tell, type it into the app and it'll answer."},
 {"m": 1, "tag": "Start here", "t": "Strength is the big one", "b": "If you only do one kind of exercise, lift. Muscle protects your joints and bones, helps control blood sugar, and is what keeps people living on their own in their eighties. Two or three sessions a week does it. I like walking and I recommend it, but it won't do this job."},
 {"m": 1, "tag": "Start here", "t": "Do the part you avoid", "b": "In clinic I see the same two patterns. Women who walk, do yoga and eat salad, and need strength work and protein. Men who lift and bench press, have sore shoulders, and need mobility and core. The program asks each of you for the part you've been skipping. That's usually where the progress is."},
 {"m": 1, "tag": "Start here", "t": "Ten minutes of mobility", "b": "Stretching, yoga, Pilates. It's the piece everyone skips and the piece that keeps you training ten years from now. Ten minutes a day is enough, and doing the same routine every day is fine. The app gives it points on purpose. Do it after your workout, while you're warm and already on the floor."},
 {"m": 1, "tag": "Start here", "t": "Easy days should be easy", "b": "Most of your cardio belongs at a pace where you can hold a conversation. Those sessions build your aerobic base and leave you fresh for the hard ones. The common mistake is making every workout medium-hard. You end up tired all week and no fitter. If you can't talk, slow down."},
 {"m": 1, "tag": "Start here", "t": "Hard days should be hard", "b": "Once or twice a week, push. Intervals, hills, a tough class. Short efforts near your limit, with rest between them, raise your fitness more than anything else you can do in thirty minutes. Then take the easy day that follows seriously. The hard day only works if you recover from it."},
 {"m": 1, "tag": "Start here", "t": "Sport counts", "b": "Pickleball, basketball, a long hike, skiing with the kids. Any of it counts as your cardio for the day. Tap it and move on. The one thing sport can't do is replace a strength day, however sore you are afterward. Play the game, enjoy it, and still lift that week."},
 {"m": 1, "tag": "Start here", "t": "Steps have a ceiling", "b": "More steps are better up to a point, and the point is lower than the 10,000 everyone quotes. In the pooled studies the benefit levels off around six to eight thousand a day for people over sixty, and eight to ten thousand for younger adults. Once you're there, thirty minutes of strength work does more for you than another hour of walking."},
 {"m": 1, "tag": "Start here", "t": "Sleep", "b": "Seven hours or more, and the same wake time every day, weekends too. Sleep is when muscle repairs and appetite resets. After a short night you're hungrier, weaker and more likely to skip the workout. If you can only fix one thing, fix the wake time. A steady bedtime tends to follow."},
 {"m": 1, "tag": "Start here", "t": "Morning light", "b": "Get outside within an hour of waking, for about ten minutes. On a gray Rochester morning that may mean a cold porch, and it still works. Morning light sets your body clock, which makes it easier to fall asleep that night. It costs nothing, and it's one of the more reliable sleep habits."},
 {"m": 1, "tag": "Start here", "t": "One weigh-in a week", "b": "Step on the scale once a week: Friday morning, after the bathroom, before coffee. Weight moves two or three pounds day to day on water and salt alone, so a single reading tells you very little. The four-week trend is what matters. If your scale shows body fat and muscle, log those too."},
 {"m": 1, "tag": "Start here", "t": "Sauna", "b": "Finnish researchers followed men for about twenty years and found that those who used a sauna most often had the lowest rates of heart disease. Three sessions of around twenty minutes a week is a reasonable target. Treat it as extra credit. It doesn't replace exercise, and you should drink water afterward."},
 {"m": 1, "tag": "Start here", "t": "Supplements, briefly", "b": "A short list has decent evidence. Creatine. Protein powder when food falls short. Vitamin D if a blood test shows you're low. Fish oil is reasonable if you rarely eat fish, though the heart trials are mixed. Buy plain, single-ingredient products with third-party testing and skip the expensive brands. Most of the supplement aisle hasn't earned a place here."},
 {"m": 1, "tag": "Start here", "t": "What we skip", "b": "Peptides, fat burners and most of what's trending online have little or no human evidence. GLP-1 drugs are different: real medicine, for people who need it, prescribed by a doctor. Even then, without protein and strength work, a good share of the weight lost is muscle. None of it replaces the basics."},
 {"m": 1, "tag": "Start here", "t": "Rest is part of it", "b": "Your body gets fitter between workouts, while it recovers. That's why the week has easy days and a yoga day built in. If you're run down, sore in a joint, or sick, take the day. Do ten minutes of stretching and log it. One planned rest day costs you nothing."},
 {"m": 1, "tag": "Start here", "t": "Don't miss twice", "b": "You'll miss days. Everyone does, including me. The rule is simple: don't miss two in a row. One skipped workout is a rest day. Two is the beginning of a different habit. Tomorrow, open the app and tap one thing, even if it's only the lesson. That's enough to be back."},
 {"m": 1, "tag": "Start here", "t": "Read your trend", "b": "Open Progress today. After one month, don't expect much from the scale. Look at the inputs: how many strength days, how many quality meals, how many nights of seven hours. Those are the numbers you controlled. If they're climbing, the body numbers will follow over the next few months."},
 {"m": 1, "tag": "Start here", "t": "One month in", "b": "You've now seen the whole program: the plate, three strength days, easy and hard cardio, mobility, sleep. Starting tomorrow each month takes one of those and goes deeper, beginning with protein. Pick the one habit that was hardest this month and make it next month's focus. Just that one."},
 {"m": 2, "tag": "Protein", "t": "Why a whole month on protein", "b": "Of everything on the plate, protein is the piece most people miss and the one that pays back fastest. It's what muscle is built from, and it's the most filling food you eat. This month has one goal: a palm-size serving at every meal. Get that right and a lot of the rest gets easier."},
 {"m": 2, "tag": "Protein", "t": "How much", "b": "The target is 0.75 to 1 gram per pound of your ideal body weight each day. Ideal means the weight a healthy build carries at your height, not what the scale says now. For an ideal weight of 170 pounds that's about 130 to 170 grams. You don't need to count it. A palm of protein at each meal, plus a shake or a snack, lands most people in range."},
 {"m": 2, "tag": "Protein", "t": "What a palm looks like", "b": "One serving is a piece of meat or fish the size and thickness of your palm. That's about 30 grams of protein. So are four or five eggs, a cup and a half of Greek yogurt, or a scoop of powder in a glass of milk. Bigger people have bigger palms, which is why the method works."},
 {"m": 2, "tag": "Protein", "t": "Protein keeps you full", "b": "Calorie for calorie, protein is the most filling thing you can eat. A breakfast with eggs or yogurt holds you until lunch in a way a bagel doesn't. That's a big part of why this plan works without counting: when protein comes first, there's less room and less appetite for the rest."},
 {"m": 2, "tag": "Protein", "t": "Protein and muscle", "b": "Lifting gives your muscles the signal to grow. Protein supplies the material. With the signal and no material, progress is slow. With material and no signal, not much happens either. When researchers pooled 49 training studies, extra protein helped up to roughly 0.75 grams per pound a day, and then the benefit leveled off."},
 {"m": 2, "tag": "Protein", "t": "More as you get older", "b": "Muscle responds less to protein as we age, so older adults need a bigger dose at each meal to get the same effect. After about fifty, a full palm at breakfast, lunch and dinner matters more than it did at thirty. Many of my older patients eat less protein every year, right when they need more."},
 {"m": 2, "tag": "Protein", "t": "Is it safe?", "b": "In people with healthy kidneys, protein at these levels hasn't been shown to cause harm. If you have kidney disease, or you've been told your kidney function is low, talk with your doctor before raising your intake. For everyone else, the far more common problem is too little."},
 {"m": 2, "tag": "Protein", "t": "Start with breakfast", "b": "Most people eat a little protein in the morning, a bit more at lunch and most of it at dinner. Breakfast is the easy win. A typical breakfast of cereal, toast or a bagel has ten grams or less. Moving that one meal to thirty changes your whole day's total."},
 {"m": 2, "tag": "Protein", "t": "Eggs", "b": "Three or four eggs with a piece of fruit takes five minutes. Add spinach or leftover vegetables to the pan and it's a quality meal. For most healthy people, eggs fit fine. If you have heart disease or diabetes, ask your own doctor how many make sense for you."},
 {"m": 2, "tag": "Protein", "t": "Yogurt", "b": "Greek yogurt has about twice the protein of regular. A cup and a half with berries and a handful of oats or nuts is a quality breakfast with no cooking. Buy plain and add your own fruit; the flavored cups carry a lot of added sugar. Cottage cheese works the same way."},
 {"m": 2, "tag": "Protein", "t": "The smoothie", "b": "For mornings with no time: a scoop of protein powder, a cup of milk or almond milk, frozen fruit, a handful of frozen spinach, a spoonful of oats. Blend and go. It covers protein and produce in one cup. It's what I'd suggest to anyone who tells me they don't eat breakfast."},
 {"m": 2, "tag": "Protein", "t": "If you're not hungry in the morning", "b": "Some people aren't, and that's fine. Have the protein whenever your first meal is. What doesn't work is skipping it, getting to two o'clock starving, and eating whatever's closest. If mornings are rushed, a shake in the car counts."},
 {"m": 2, "tag": "Protein", "t": "Coffee is not breakfast", "b": "Coffee is fine, and I'm not taking it away. But a large latte, or a coffee with a pastry, is mostly sugar and fat with almost no protein, and you'll be hungry again by ten. Keep the coffee and add the protein. Black coffee with eggs beats a mocha with nothing."},
 {"m": 2, "tag": "Protein", "t": "Two breakfasts", "b": "Pick two breakfasts you like and can make half asleep. Eggs and fruit. Yogurt and berries. A smoothie. Rotate them. Nobody needs seven different breakfasts. The people who do this well eat nearly the same thing every morning and save the variety for dinner."},
 {"m": 2, "tag": "Protein", "t": "Why produce", "b": "People who eat more fruit and vegetables have less heart disease, fewer strokes, and live longer. A large review of 95 studies found the benefit kept growing up to about 800 grams a day. That's the second half of the plate, and it's the half that keeps portions of everything else in check."},
 {"m": 2, "tag": "Protein", "t": "What 800 grams looks like", "b": "About five fist-size servings of solid produce: an apple, a banana, a cup of cooked broccoli, a cup of berries. Leafy salad is much lighter, so pile it high. Two servings at dinner, one at lunch, one at breakfast and one as a snack gets you there. Half the plate at each meal comes close without counting."},
 {"m": 2, "tag": "Protein", "t": "Frozen counts", "b": "Frozen fruit and vegetables are picked ripe and frozen within hours. They hold their nutrients well, cost less, and don't rot in the drawer. Keep berries, spinach, broccoli and a stir-fry mix in the freezer and you always have the produce half of a plate, even the night before grocery day."},
 {"m": 2, "tag": "Protein", "t": "Vegetables you'll eat", "b": "The best vegetable is the one you'll eat tonight. Roast it with olive oil and salt until the edges brown; nearly everything tastes better that way. Bagged salad counts. Baby carrots count. Salsa counts. Don't force down steamed kale because someone told you to."},
 {"m": 2, "tag": "Protein", "t": "Fruit is fine", "b": "Some diets treat fruit like candy because it has sugar. Whole fruit also has water and fiber, which is why it's hard to overeat apples. The studies linking produce to better health count fruit. Juice is a weaker version: most of the fiber is gone and it's easy to drink a lot. Eat the orange."},
 {"m": 2, "tag": "Protein", "t": "Fiber", "b": "Most Americans eat about half the fiber that's recommended. Fiber slows digestion, feeds the bacteria in your gut and keeps you regular. You don't need a supplement or a number to hit. Fill half your plate with plants, choose oats and beans often, and it takes care of itself."},
 {"m": 2, "tag": "Protein", "t": "Put it first", "b": "A small trick that works: eat the vegetables and the protein before the rest of the plate. You get the two things that matter while you're hungriest, and you'll want less of what's left. At a restaurant, that means the salad and the entrée before the bread basket."},
 {"m": 2, "tag": "Protein", "t": "Carbs are fine", "b": "Carbohydrates aren't the problem. Oats, potatoes, rice, beans, fruit and whole-grain bread have fed healthy people for a very long time. The trouble starts with carbs that come from a factory: chips, crackers, pastries, sweet drinks. Keep the first kind on your plate and treat the second kind as a reward."},
 {"m": 2, "tag": "Protein", "t": "What \"processed\" means", "b": "Nearly all food is processed a little; frozen peas and plain yogurt are fine. The kind to watch is ultra-processed: long ingredient lists, built to be easy to overeat. A quick test is whether you could make it in your own kitchen. Oatmeal, yes. A toaster pastry, no."},
 {"m": 2, "tag": "Protein", "t": "Why it matters", "b": "At the NIH, twenty adults lived in a research unit and ate two diets for two weeks each, one ultra-processed and one not, matched for the calories, sugar, fat and fiber they were offered. On the ultra-processed diet they ate about 500 more calories a day and gained about two pounds."},
 {"m": 2, "tag": "Protein", "t": "Drinks", "b": "The easiest calories to remove are the ones you drink. Soda, sweet tea, juice, sports drinks and fancy coffees add up fast and don't fill you at all. Water, seltzer, black coffee and unsweetened tea cost you nothing. If you change only one thing about carbs, change what's in your cup."},
 {"m": 2, "tag": "Protein", "t": "Fuel for hard days", "b": "Carbs are what your muscles burn when you work hard. On interval and bootcamp days, have some beforehand: a banana, oatmeal, toast. People who cut carbs very low often find their hard workouts fall apart. Eat them around training and you'll get more out of the session."},
 {"m": 2, "tag": "Protein", "t": "Test week", "b": "This is the last week of the first block, so it's test week. Do your fitness test, whichever one you picked: the bike test, the 2K row or the timed mile. Put the number in Progress. It doesn't matter whether it's good. In two months you'll do it again, and that comparison is the point."},
 {"m": 2, "tag": "Protein", "t": "Protein, one month in", "b": "Look at your week in the app. How many meals had a palm of protein? If it's most of them, you've built the habit that does the most for body composition. If breakfast is still the gap, give it two more weeks. Next month: how to tell whether any of this is working."},
 {"m": 3, "tag": "Body composition", "t": "Two months in", "b": "You have about eight Friday weigh-ins by now. That's enough to read. This month is about what those numbers mean, which ones to trust, and why the one most people watch is the least useful. If you haven't been weighing in, start this Friday. One reading a week is all it takes."},
 {"m": 3, "tag": "Body composition", "t": "What the scale weighs", "b": "A scale weighs everything: muscle, fat, bone, water, the dinner you ate last night. It can't tell them apart. Two people at 180 pounds can look and function completely differently, one strong and lean, the other soft with a bad back. The number is the same. What it's made of is what matters."},
 {"m": 3, "tag": "Body composition", "t": "Water moves the number", "b": "A salty meal, a hard workout, a long flight, a few drinks, or the time of the month can each move your weight two to four pounds overnight. None of that is fat. This is why we weigh once a week under the same conditions and look at the four-week average."},
 {"m": 3, "tag": "Body composition", "t": "The diet trap", "b": "Crash diets work on the scale because you lose water and muscle along with the fat. Then the weight returns, and fat comes back more easily than muscle does. Repeat that a few times over twenty years and you weigh the same with less muscle than you started with. The scale called every round a success."},
 {"m": 3, "tag": "Body composition", "t": "BMI", "b": "BMI is weight divided by height squared. It's useful for studying large populations and blunt for one person, because it can't see muscle. Plenty of athletes are \"overweight\" by BMI. Plenty of people with a normal BMI carry too much fat and too little muscle. The app shows yours, with that caveat."},
 {"m": 3, "tag": "Body composition", "t": "Thin isn't the goal", "b": "I see patients who are thin, eat very little, and can't get out of a chair without pushing off with their arms. Their weight is \"healthy.\" Their muscle isn't. Low muscle at a normal weight carries its own risks with age: falls, fractures, slow recovery from illness. Aim for strong and let weight follow."},
 {"m": 3, "tag": "Body composition", "t": "The better scoreboard", "b": "Three numbers tell you more than weight: how much muscle you carry, how much fat, and how fit you are. The first two are body composition. The third is your fitness test. If muscle and fitness are rising and fat is drifting down, you're winning, whatever the scale says."},
 {"m": 3, "tag": "Body composition", "t": "What muscle does", "b": "Muscle moves you, and it does a lot more. It's where most of your blood sugar goes after a meal. It protects your joints and keeps you upright when you trip. It's a reserve your body draws on when you're sick or injured. People with more of it tend to live longer and stay independent."},
 {"m": 3, "tag": "Body composition", "t": "Use it or lose it", "b": "From around age thirty, adults who don't train lose muscle slowly, a few percent each decade, and faster after sixty. Strength drops quicker than size. None of this is fixed. People in their seventies and eighties still build muscle when they lift. Starting late works. It's just harder to make up lost ground."},
 {"m": 3, "tag": "Body composition", "t": "Fat isn't all the same", "b": "Fat under the skin, on the hips and thighs, is mostly storage. Fat packed around the organs in your abdomen, called visceral fat, is more active and more closely tied to diabetes and heart disease. That's why where you carry it matters, and why your waist tells you something your weight can't."},
 {"m": 3, "tag": "Body composition", "t": "Your waist", "b": "Measure around your belly at the level of your navel, relaxed, first thing in the morning. A useful rule: your waist should be less than half your height. A man who is 5'10\" is aiming for under 35 inches. It takes a tape measure and ten seconds, and it tracks the fat that matters most."},
 {"m": 3, "tag": "Body composition", "t": "Recomposition", "b": "Losing fat while gaining muscle is called recomposition. It happens most readily in people who are new to lifting, coming back after time off, or carrying extra fat. That describes most people starting this program. The scale may barely move while your waist shrinks and your lifts climb. Count that as progress."},
 {"m": 3, "tag": "Body composition", "t": "Why protein and lifting go together", "b": "When you lose weight without lifting or eating enough protein, a quarter or more of what you lose can be muscle. Lifting and protein tell your body to keep the muscle and burn the fat. The effort is about the same. The result a year later is very different."},
 {"m": 3, "tag": "Body composition", "t": "Slow is fine", "b": "Fat comes off slowly when you're doing it right, and muscle goes on more slowly still. A pound of muscle a month is good progress for most adults. That's why the app shows four-week averages and tests every two months. Judge this by seasons, not by weeks."},
 {"m": 3, "tag": "Body composition", "t": "The home scale", "b": "A body composition scale sends a tiny current through your feet and estimates fat and muscle from how it travels. The exact number can be off by several percentage points. The direction over time is reliable enough, if you measure the same way each week. Use it for the trend."},
 {"m": 3, "tag": "Body composition", "t": "Same conditions", "b": "Friday morning, after the bathroom, before coffee or food, in the same light clothes or none, on the same spot on the floor. These scales are sensitive to how much water you're holding, so the routine matters more than the brand. A reading after a workout or a big dinner is close to useless."},
 {"m": 3, "tag": "Body composition", "t": "DEXA", "b": "A DEXA scan is a low-dose X-ray that measures fat, lean tissue and bone, region by region. It takes about ten minutes and it's the best reference most people can get. One at the start of the year and one at the end is plenty. It also estimates visceral fat and gives a read on bone density."},
 {"m": 3, "tag": "Body composition", "t": "The tape and the mirror", "b": "A tape measure around your waist once a month costs nothing and rarely lies. Neither do your clothes. If your belt moved a notch and your shirts are tighter in the shoulders, something good is happening, even when the scale and the app disagree. Take a photo each month if you'll look at it honestly."},
 {"m": 3, "tag": "Body composition", "t": "Strength is a measurement", "b": "If you're lifting more than you did two months ago with the same form, your muscles are adapting, and over months that means more muscle. Write down what you lift. For people without a body composition scale, a rising number in the gym and a shrinking waist tell most of the story."},
 {"m": 3, "tag": "Body composition", "t": "The fitness test", "b": "Every two months you repeat the same test: the bike test, the 2K row, or the timed mile. It's the output that tracks your heart and lungs. A better number at the same body weight means you're fitter. Fitter people live longer across body sizes, which is why the test sits on the scoreboard."},
 {"m": 3, "tag": "Body composition", "t": "Don't measure everything", "b": "You could track twenty numbers. Please don't. Weight, body fat and muscle once a week from the scale. Waist once a month. A fitness test every two months. That's the whole list. More data mostly creates noise and worry, and none of it changes what you do tomorrow."},
 {"m": 3, "tag": "Body composition", "t": "Open Progress", "b": "Today, look at your body composition chart. Ignore any single week. Find where the four-week average was in your first month and where it is now. That's two points and a direction. The rest of this week covers what each direction means and what, if anything, to change."},
 {"m": 3, "tag": "Body composition", "t": "Weight flat, muscle up, fat down", "b": "This is the best result and the one the scale hides. You've traded fat for muscle, pound for pound. Your clothes fit differently, your lifts are up, and your weight hasn't moved. Change nothing. This is what winning looks like in this program."},
 {"m": 3, "tag": "Body composition", "t": "Weight down, muscle steady", "b": "Also good. You're losing fat and keeping what matters. Make sure protein stays high and you aren't skipping strength days as the weight comes off. If you're losing more than a pound or two a week for long, eat a little more. Fast loss usually takes muscle with it."},
 {"m": 3, "tag": "Body composition", "t": "Weight down, muscle down", "b": "This is the one to fix. It usually means too little protein, too little lifting, or both. Add a palm of protein to breakfast and protect your three strength days before you change anything else. Losing weight this way looks fine on the scale and costs you later."},
 {"m": 3, "tag": "Body composition", "t": "Nothing is moving", "b": "If two months have gone by with no change anywhere, look at the inputs first. How many strength days did you log? How many quality meals? How many drinks a week? The answer is usually there. If the inputs are good and nothing moved, give it one more block. Some bodies take a season."},
 {"m": 3, "tag": "Body composition", "t": "Weight up", "b": "If weight is rising along with muscle and your waist is steady, that's growth and it's fine. If your waist is rising too, look at rewards and drinks, and at the quarter of the plate that's yours. Small corrections work. You don't need to overhaul anything."},
 {"m": 3, "tag": "Body composition", "t": "Bad weeks", "b": "You'll have a Friday when everything is up three pounds after a weekend away. It's water, salt and a full gut. Log it anyway; skipping the bad weigh-ins makes the average dishonest. One week moves a four-week average very little, and by the next Friday most of it is gone."},
 {"m": 3, "tag": "Body composition", "t": "Compare with yourself", "b": "Your friend will lose faster. Someone in the group will post a number you can't touch. Bodies respond at different speeds, and men often drop weight quicker than women early on. The only comparison that tells you anything is you now against you on day one."},
 {"m": 3, "tag": "Body composition", "t": "When to ask for help", "b": "See your doctor if you're losing weight without trying, if you're exhausted all the time, or if the numbers won't move despite months of honest effort. Thyroid problems, low iron, sleep apnea and some medications all get in the way. This app tracks habits. It can't examine you."},
 {"m": 3, "tag": "Body composition", "t": "Composition in one line", "b": "Keep muscle, lose fat, get fitter, and let weight land where it lands. You now know how to measure all three and how to read them. Next month is the habit that drives every one of those numbers: strength."},
 {"m": 4, "tag": "Strength", "t": "The highest-return habit", "b": "If I could prescribe one thing to nearly every adult who walks into my office, it would be strength training two or three times a week. It helps bones, blood sugar, balance, joints and mood, and the dose is small. This month covers how to do it without getting hurt or wasting time."},
 {"m": 4, "tag": "Strength", "t": "Thirty to sixty minutes", "b": "In a pooled analysis of sixteen studies, people who did muscle-strengthening exercise had a 10 to 17 percent lower risk of dying during follow-up, and lower rates of heart disease, cancer and diabetes. Most of that benefit showed up at thirty to sixty minutes a week. That's two short sessions."},
 {"m": 4, "tag": "Strength", "t": "Blood sugar", "b": "Muscle is the main place your body stores the sugar from a meal. More muscle, used regularly, means more room, and muscle you've just worked pulls sugar in with very little insulin. This is why strength training sits next to walking in diabetes guidelines. It works on the problem from the storage side."},
 {"m": 4, "tag": "Strength", "t": "Joints", "b": "A common worry is that lifting wears joints out. The opposite is closer to the truth. Strong muscles take load off the joint they cross. Strengthening the thigh is a first-line treatment for knee arthritis, and strengthening the hips helps the back. Sore joints usually need more strength around them."},
 {"m": 4, "tag": "Strength", "t": "Bones", "b": "Bone responds to load the way muscle does: stress it and it gets denser. Walking does a little. Lifting and impact do much more. This matters most for women after menopause, when bone loss speeds up, and it gets a full week later this month."},
 {"m": 4, "tag": "Strength", "t": "Balance and falls", "b": "More than one in four adults over 65 falls each year, and falls cause most hip fractures. What stops a stumble from becoming a fall is leg strength and reaction speed. You build both in the gym decades before you need them. Think of every squat as practice for staying on your feet."},
 {"m": 4, "tag": "Strength", "t": "It's never too late", "b": "Researchers have put people in their eighties and nineties on supervised strength programs and measured real gains in muscle and walking speed within a few months. Older muscle still responds. If you're sixty and have never lifted, you have more to gain from starting than anyone else in this program."},
 {"m": 4, "tag": "Strength", "t": "What counts as strength", "b": "Anything that makes a muscle work hard against resistance: dumbbells, machines, bands, a barbell, your own body weight. Yoga and walking are good, and they're something else. The test is simple. By the last few reps the set should feel hard, and you shouldn't be able to do many more."},
 {"m": 4, "tag": "Strength", "t": "Four moves", "b": "A complete session covers four things: a push, like a press or push-up; a pull, like a row; a leg movement, like a squat or lunge; and something for the trunk, like a plank or a carry. A class, a trainer or an app will choose the exercises. Check that all four are there."},
 {"m": 4, "tag": "Strength", "t": "How hard", "b": "Pick a weight you can lift eight to twelve times with good form, where the last two reps take real effort. If you could have done five more, it was too light. You don't need to go to total failure. Stopping a rep or two short builds nearly as much and is easier to recover from."},
 {"m": 4, "tag": "Strength", "t": "How much", "b": "Two or three sets of each move, two or three days a week. That's it. A full session fits in thirty minutes. More helps a little if you enjoy it, but the big gain comes from going from nothing to something. Three good half-hours beat one heroic ninety minutes."},
 {"m": 4, "tag": "Strength", "t": "Form first", "b": "Learn each movement with a light weight before you add load. Move through the full range, under control, without holding your breath. If you're new, one or two sessions with a trainer or a physical therapist to learn a squat, a hinge, a press and a row is money well spent."},
 {"m": 4, "tag": "Strength", "t": "Where to do it", "b": "A gym, a class on your screen, a pair of adjustable dumbbells in the basement, a trainer. They all work. The best choice is the one you'll show up for on a dark Tuesday morning. Tap \"Where to find a strength session\" on the Workout tab for places to start."},
 {"m": 4, "tag": "Strength", "t": "Bootcamp counts", "b": "Saturday's bootcamp is half hard cardio and half lifting, and it counts as your third strength day. If you'd rather swap it for a straight strength session, change the day in the app. What matters is that the week has three days where your muscles work against something heavy."},
 {"m": 4, "tag": "Strength", "t": "A week for the women", "b": "Much of what I see in clinic comes down to this: women who walk every day, do yoga, eat carefully, and have never picked up anything heavy. They've done everything they were told. They were told the wrong thing. This week is why strength matters even more for women. Men, read along."},
 {"m": 4, "tag": "Strength", "t": "You won't get bulky", "b": "This is the fear I hear most. Building large muscles takes years of heavy training, a lot of food, and hormone levels most women don't have. Two or three sessions a week produce firmer, stronger and a little leaner. If you ever feel too muscular, you can stop. It never happens by accident."},
 {"m": 4, "tag": "Strength", "t": "Bone and menopause", "b": "Women lose bone quickly in the years around menopause. In an Australian trial, postmenopausal women with low bone mass lifted heavy twice a week for eight months under supervision. Their spine bone density rose about three percent while the comparison group lost about one. Heavy, properly coached lifting was safe for them."},
 {"m": 4, "tag": "Strength", "t": "Heavy is relative", "b": "\"Heavy\" means heavy for you: a weight you can lift five to ten times with good form and not many more. For one woman that's a ten-pound dumbbell, for another it's a loaded barbell. The three-pound weights so many classes hand out are too light to tell bone or muscle to change."},
 {"m": 4, "tag": "Strength", "t": "Protein, again", "b": "Women in my practice tend to eat far less protein than they need. Salad for lunch, a little chicken at dinner. Strength training without enough protein is like sending a crew to build with no lumber. A palm at every meal applies to you exactly as it does to the men."},
 {"m": 4, "tag": "Strength", "t": "Walking is good. It isn't enough", "b": "Keep walking. It's good for your heart, your mood and your sleep. But it doesn't load your upper body at all, and it loads your legs and bones only lightly. If your week is all walking and yoga, replace two of those sessions with strength. You'll keep everything walking gives you."},
 {"m": 4, "tag": "Strength", "t": "For daughters, too", "b": "Bone is built mostly before age thirty. Girls and young women who lift, jump and play sports bank bone they'll draw on for sixty years. If you have daughters, let them see you lift. What they watch you do with a barbell teaches more than anything you tell them."},
 {"m": 4, "tag": "Strength", "t": "Add a little", "b": "Muscle adapts to what you ask of it and then stops. To keep improving, ask for slightly more: one more rep, or the next weight up, once the current one feels easy for all your sets. Small steps, every week or two. That's all \"progressive overload\" means."},
