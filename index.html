 {"m": 4, "tag": "Strength", "t": "Write it down", "b": "You won't remember what you lifted two weeks ago. Keep a note on your phone or use a logging app: the exercise, the weight, the reps. Next session, try to beat one line of it. A record takes out the guessing and shows you progress on the days you don't feel any."},
 {"m": 4, "tag": "Strength", "t": "Soreness", "b": "Being sore a day or two after a new workout is normal and fades as you adapt. It doesn't prove the session was good, and its absence doesn't prove it was bad. Sharp pain during a lift, pain inside a joint, or pain that's worse a week later is different. Stop and get it looked at."},
 {"m": 4, "tag": "Strength", "t": "Rest between", "b": "Muscle is built between sessions. Give each muscle group about two days before you work it hard again, which the Tuesday, Thursday, Saturday rhythm does for you. On the days between, easy cardio and mobility help you recover. Lifting hard seven days a week mostly produces sore tendons."},
 {"m": 4, "tag": "Strength", "t": "Warm up", "b": "Five minutes of easy movement, then a light set or two of your first exercise before the working weight. That's enough. You don't need twenty minutes of stretching beforehand; save the long stretches for after. A cold first set with a heavy weight is where a lot of tweaks happen."},
 {"m": 4, "tag": "Strength", "t": "Shoulders", "b": "For the men who love the bench press: most of the sore shoulders I see come from too much pressing and too little pulling. For every push in your week, do a pull. Rows, pull-downs, face pulls. Balance the two and many cranky shoulders settle down without anything else."},
 {"m": 4, "tag": "Strength", "t": "When to back off", "b": "Poor sleep, a cold coming on, a brutal week at work. On those days lift lighter or shorter and call it a win for showing up. Pushing through real fatigue is how people get hurt. The program runs all year. One easy session costs you nothing; an injury can cost you two months."},
 {"m": 4, "tag": "Strength", "t": "Test week", "b": "It's the end of the second block. Repeat the fitness test you did two months ago and compare. Then write down your best weight for a squat, a press and a row. Those three numbers, next to your body composition, show what four months of work has done."},
 {"m": 4, "tag": "Strength", "t": "Strength in one line", "b": "Three days a week, four kinds of movement, hard enough that the last reps are work, a little more each month. Keep doing that for a year and most of what this app measures will move. Next month is the part that lifters skip: mobility."},
 {"m": 5, "tag": "Mobility", "t": "The part the lifters skip", "b": "Last month was mostly for the women. This one is mostly for the men. The pattern I see every week: a guy in his forties or fifties who lifts, rides, plays hard on weekends, and can't touch his toes or reach behind his back. He's strong and stiff, and something hurts."},
 {"m": 5, "tag": "Mobility", "t": "What mobility is", "b": "Mobility is how far a joint can move and how well you control it through that range. Flexibility is one piece. Strength at the ends of the range is the other. A hip that only moves halfway makes the back and the knee do work they weren't built for, and that's usually where the pain shows up."},
 {"m": 5, "tag": "Mobility", "t": "It fades quietly", "b": "Nobody notices losing an inch of hip rotation a year. You notice ten years later, when putting on socks is a project. Joints keep the range you use. Sit at a desk and drive a car for decades and you keep desk-and-car range. Ten minutes a day is how you keep the rest."},
 {"m": 5, "tag": "Mobility", "t": "Why it earns points", "b": "Mobility gets three points every day because it's the habit least likely to get done. It doesn't burn many calories or make you sweat, and you won't see it in the mirror. You'll see it at seventy, when you can still get up off the floor without a hand."},
 {"m": 5, "tag": "Mobility", "t": "Ten minutes", "b": "The whole ask is ten to fifteen minutes. Hips, hamstrings, upper back, shoulders. Do it after your workout when you're warm, or in front of the TV at night. The same routine every day is fine. A short daily habit does far more than one long session on Sunday."},
 {"m": 5, "tag": "Mobility", "t": "Stretching, honestly", "b": "Stretching won't prevent every injury or erase soreness; the studies on that are underwhelming. What it reliably does is keep, and slowly improve, your range of motion when you do it regularly. Hold each stretch for thirty seconds or so with easy tension. No bouncing, no pain."},
 {"m": 5, "tag": "Mobility", "t": "Strong through the range", "b": "The best mobility work is often strength work done through a full range of motion. A deep goblet squat. A Romanian deadlift with a long hamstring stretch. An overhead press that finishes with your arms by your ears. Lift through the whole range with a weight you control and you get both at once."},
 {"m": 5, "tag": "Mobility", "t": "Why yoga", "b": "A yoga class takes every major joint through its range, under your own body weight, for thirty minutes, with someone else doing the thinking. That's why it's Sunday's session. It also trains balance and slows your breathing. For a stiff lifter it may be the most useful half hour of the week."},
 {"m": 5, "tag": "Mobility", "t": "Why Pilates", "b": "Pilates is controlled strength for the trunk and hips: the muscles that hold your spine and pelvis steady while your arms and legs move. It looks easy and it isn't. People with recurring back trouble often do well with it. Count it as mobility on any day of the week."},
 {"m": 5, "tag": "Mobility", "t": "You don't have to be good at it", "b": "Most men avoid yoga because they're bad at it. That's the reason to go. Nobody in the class is looking at you, and the person who can't reach the floor gets the most out of trying. Use the blocks. Bend your knees. Skip the poses that hurt."},
 {"m": 5, "tag": "Mobility", "t": "Where to find it", "b": "A studio, a class at your gym, or a screen at home. Peloton and Apple Fitness both have yoga and Pilates from ten to forty-five minutes, and YouTube has good free classes for beginners. Search for \"beginner,\" \"slow flow\" or \"yoga for athletes.\" Or tap \"Where to find mobility\" on the Workout tab."},
 {"m": 5, "tag": "Mobility", "t": "Breathing", "b": "The slow breathing in a yoga class does real work. Long exhales shift your nervous system toward its rest-and-recover side, which is why people walk out calmer than they walked in. If you take one thing from yoga into the rest of your day, take the long, slow exhale."},
 {"m": 5, "tag": "Mobility", "t": "Balance", "b": "Stand on one leg while you brush your teeth, thirty seconds a side. It sounds silly, and it's one of the better things you can do for your future self. In one study, adults over fifty who couldn't hold a one-leg stand for ten seconds had a clearly higher risk of dying over the next seven years."},
 {"m": 5, "tag": "Mobility", "t": "Make it the cooldown", "b": "The easiest way to never miss mobility is to attach it to something you already do. Finish every workout with ten minutes on the floor before you shower. The class ends, the stretch starts. Once it's part of the workout, it stops being a separate thing to remember."},
 {"m": 5, "tag": "Mobility", "t": "Three trouble spots", "b": "Most of the aches I see in active adults come from three places: shoulders, hips and the low back. They're connected. A stiff upper back overloads the shoulder. Tight hips overload the low back. This week takes them one at a time, with what usually helps."},
 {"m": 5, "tag": "Mobility", "t": "The upper back", "b": "Your upper back is built to rotate and extend, and hours at a keyboard teach it to do neither. When it stiffens, your shoulders and neck pick up the slack. Lie back over a foam roller placed across your shoulder blades, or do open-book rotations on your side. Two minutes a day goes a long way."},
 {"m": 5, "tag": "Mobility", "t": "Shoulders", "b": "Healthy shoulders reach fully overhead and behind the back without pinching. If yours don't, cut back on pressing for a while, add rows and pull-downs, and stretch the chest and lats. Hanging from a bar for twenty or thirty seconds, if it's comfortable, is a simple way to open them up."},
 {"m": 5, "tag": "Mobility", "t": "Hips", "b": "Sitting keeps the front of the hip short and lets the glutes go quiet. Stretch the hip flexors in a half-kneeling lunge, and strengthen the glutes with bridges and squats. Hips that extend and rotate well take a great deal of strain off the back and the knees."},
 {"m": 5, "tag": "Mobility", "t": "The low back", "b": "Most back pain doesn't mean a damaged spine. More often the back is doing too much because the hips and trunk are doing too little. For an ordinary sore back, staying gently active beats bed rest. Walk, keep moving, avoid what flares it, and most episodes ease within a few weeks."},
 {"m": 5, "tag": "Mobility", "t": "Your MRI may be normal for your age", "b": "In scans of people with no back pain at all, disc degeneration shows up in about a third of twenty-year-olds and in nearly everyone by eighty. Bulging discs are common too. A scary-sounding report often describes ordinary aging. It's one reason I don't order an MRI unless it will change the plan."},
 {"m": 5, "tag": "Mobility", "t": "Knees", "b": "Knees mostly do what the hip and ankle let them. Strong quads and glutes protect them, and they like to move; cycling and walking feed the cartilage. Recreational running doesn't wear out healthy knees. In pooled studies, recreational runners had less knee and hip arthritis than people who didn't run. Build up slowly."},
 {"m": 5, "tag": "Mobility", "t": "Sore or hurt?", "b": "This is the question I get most. Soreness is dull, spread across a muscle, shows up a day after something new, and eases as you warm up. An injury tends to be sharp, in one spot, often at a joint or tendon, and gets worse the more you do. This week is about telling them apart."},
 {"m": 5, "tag": "Mobility", "t": "Green, yellow, red", "b": "Green: stiffness that loosens within ten minutes of moving. Keep going. Yellow: pain that stays mild and steady during the session and settles by the next morning. Modify and watch it. Red: pain that's sharp, climbing, or changing how you move. Stop that exercise for today."},
 {"m": 5, "tag": "Mobility", "t": "When to be seen", "b": "Get checked for a joint that swells, locks or gives way; pain that wakes you at night; numbness, tingling or weakness; pain after a fall or a pop; or anything still limiting you after two weeks. Chest pain, pressure or unusual shortness of breath with exercise means stop and call right away."},
 {"m": 5, "tag": "Mobility", "t": "Tendons like load", "b": "Achilles, elbow, kneecap tendon, rotator cuff. Sore tendons are common in active adults, and they respond poorly to complete rest. They respond well to slow, heavy, controlled loading built up over weeks. If a tendon has bothered you for a month, a physical therapist can set that up."},
 {"m": 5, "tag": "Mobility", "t": "Keep moving around it", "b": "An injury almost never means stopping everything. A sore shoulder still lets you ride and train legs. A sore knee still lets you swim, lift upper body or work your trunk. Train what doesn't hurt, change the day in the app, and you keep your fitness while the sore part recovers."},
 {"m": 5, "tag": "Mobility", "t": "Ice, heat, pills", "b": "Ice or heat: use whichever feels better; neither changes healing much. An anti-inflammatory for a few days can take the edge off, if your doctor says they're safe for you. Don't take them to get through a workout. Pain is information, and masking it is how small problems become big ones."},
 {"m": 5, "tag": "Mobility", "t": "Coming back", "b": "After time off, start at about half of what you were doing and build over two to three weeks. Your heart and lungs come back faster than your tendons do, so you'll feel ready before your tissues are. The people I see re-injured are nearly always the ones who went straight back to full speed."},
 {"m": 5, "tag": "Mobility", "t": "The floor test", "b": "Sit down on the floor and stand back up, using as little help from your hands and knees as you can. It takes leg strength, hip mobility and balance together. If it's hard, you've found what to work on. If it's easy, do it every day so it stays that way."},
 {"m": 5, "tag": "Mobility", "t": "A routine to keep", "b": "Pick five moves and do them daily: a hip-flexor lunge stretch, a hamstring stretch, upper-back rotations, a chest stretch in a doorway, a deep squat hold. About two minutes each. It's the same ten minutes for the rest of your life, and it's enough."},
 {"m": 5, "tag": "Mobility", "t": "Mobility in one line", "b": "Ten minutes every day, a yoga or Pilates class once a week, full range when you lift, and attention to pain that's sharp or sticking around. Stiffness is mostly optional. Next month is the engine: easy days, hard days and what VO2 max means."},
 {"m": 6, "tag": "Cardio", "t": "The engine", "b": "Month four was muscle and month five was joints. This month is your heart and lungs. Cardio has two jobs in this program: easy sessions that build a base, and a small number of hard sessions that raise your ceiling. This week is the easy kind, which most people do wrong by going too fast."},
 {"m": 6, "tag": "Cardio", "t": "The talk test", "b": "You don't need a heart-rate monitor to find easy. If you can speak in full sentences while you move, you're there. If you can only get out a few words between breaths, you've drifted into hard. Easy should feel like you could keep going for a long time."},
 {"m": 6, "tag": "Cardio", "t": "Zone 2", "b": "You'll hear easy cardio called zone 2. It means a steady effort you can hold for a long time, around a four out of ten. Breathing is deeper than at rest and still under control. The number on your watch matters less than whether you could carry on a conversation."},
 {"m": 6, "tag": "Cardio", "t": "What easy builds", "b": "Easy cardio teaches the heart to pump more blood with each beat and helps muscle grow more of the small blood vessels and mitochondria that turn fuel into work. Those changes come from time spent moving, not from suffering. It's why a relaxed forty minutes counts."},
 {"m": 6, "tag": "Cardio", "t": "The common mistake", "b": "Most people do their easy days too hard and their hard days too easy, so everything ends up medium. Medium feels productive. It also leaves you too tired to go hard when it counts. If an easy day feels almost too easy, you're doing it right."},
 {"m": 6, "tag": "Cardio", "t": "How much", "b": "The long-standing guideline is at least 150 minutes a week of moderate activity, or about half that if it's vigorous. Thirty to forty-five minutes on your cardio days gets you there. More helps, up to a point. But the jump from doing nothing to doing something is the biggest one."},
 {"m": 6, "tag": "Cardio", "t": "What counts", "b": "A brisk walk, a bike ride, an easy jog, rowing, swimming, hiking, the elliptical. Pick what your joints tolerate and what you'll keep doing. The heart doesn't know which machine you're on. Change it up through the week if that keeps you interested."},
 {"m": 6, "tag": "Cardio", "t": "Why go hard", "b": "Easy work builds the base. Hard work raises the top. Short efforts close to your limit push your heart and lungs to adapt in ways easy work alone doesn't reach. You don't need many of them. One or two hard sessions a week is plenty for most of us."},
 {"m": 6, "tag": "Cardio", "t": "What intervals look like", "b": "A classic session: four minutes hard, three minutes easy, repeated four times. A shorter one: one minute hard, one minute easy, ten times. Both work. The pattern matters less than reaching an effort that's uncomfortable and then recovering enough to do it again."},
 {"m": 6, "tag": "Cardio", "t": "How hard is hard", "b": "Hard means an eight or nine out of ten. You can get out a word or two and no more. By the end of each interval you're watching the clock. If you could chat through it, it wasn't a hard day. If you can't finish the session, back it off a notch next time."},
 {"m": 6, "tag": "Cardio", "t": "Mostly easy", "b": "Studies of endurance athletes keep finding the same split: roughly four-fifths of their training is easy and about a fifth is hard, with very little in between. You don't need to train like them. Copy the proportions. Most days easy, one or two hard."},
 {"m": 6, "tag": "Cardio", "t": "Warm up first", "b": "Give yourself ten minutes of easy movement before a hard effort. A cold start feels awful and is harder on tendons and muscle. Start slow, build a little, throw in two or three short pick-ups, then begin. Most good interval classes build this in for you."},
 {"m": 6, "tag": "Cardio", "t": "Where to find hard", "b": "An interval or HIIT ride, a Tabata class, hill repeats on a run or walk, a rowing workout, a bootcamp. On Peloton or Apple Fitness, search for \"intervals\" or \"HIIT\" and pick twenty to thirty minutes. Saturday's bootcamp already counts as one of your hard days."},
 {"m": 6, "tag": "Cardio", "t": "Then recover", "b": "You get fitter while you recover from the work. Follow a hard day with an easy one, eat your protein and sleep. Two hard days back to back is how people get run down and hurt. If your legs are still heavy, make today easy and go hard tomorrow."},
 {"m": 6, "tag": "Cardio", "t": "What VO2 max is", "b": "VO2 max is the most oxygen your body can use during all-out exercise. It reflects your heart, lungs, blood and muscle working together, in one number. A higher number means more capacity for everything, from racing a 5K to carrying groceries up the stairs at eighty."},
 {"m": 6, "tag": "Cardio", "t": "Why I care about it", "b": "In a Cleveland Clinic study of more than 120,000 adults who had treadmill tests, fitter people lived longer at every level, with no upper limit to the benefit. Being in the least-fit group carried a risk on par with smoking or diabetes. Fitness is one of the best predictors of longevity we can measure."},
 {"m": 6, "tag": "Cardio", "t": "How to get a number", "b": "A lab test with a mask is the gold standard. Your watch gives an estimate; Apple calls it Cardio Fitness. The estimate can be off by a fair amount, so don't compare yours with a friend's. Use the same device and watch your own trend over months."},
 {"m": 6, "tag": "Cardio", "t": "A test without a watch", "b": "Pick a fixed route, like a mile on a track or a loop near home. Every couple of months, cover it at a steady, hard pace and write down your time and how it felt. A faster time or the same time with less effort means your engine has grown."},
 {"m": 6, "tag": "Cardio", "t": "It drops with age", "b": "VO2 max falls steadily from your thirties on, and it falls faster in people who stop moving. You can't stop the decline. You can slow it a great deal and start from a much higher place. A fit seventy-year-old can have the capacity of an inactive adult decades younger."},
 {"m": 6, "tag": "Cardio", "t": "It responds at any age", "b": "People in their sixties and seventies improve their fitness with training, the same as younger people. The biggest health payoff comes from moving out of the least-fit group, not from getting to elite. If you're starting from low, you have the most to gain."},
 {"m": 6, "tag": "Cardio", "t": "Resting heart rate", "b": "As you get fitter, your resting heart rate tends to come down, because a stronger heart moves more blood per beat. Check it first thing in the morning or let your watch track it. A number that sits well above your usual for a few days can mean illness, poor sleep or too much training."},
 {"m": 6, "tag": "Cardio", "t": "Steps", "b": "Steps are a fine measure of how much you move in a day. In pooled data from fifteen studies, the benefit leveled off around 6,000 to 8,000 a day for adults over sixty and 8,000 to 10,000 for younger adults. If you're far below that, adding steps is the easiest win there is."},
 {"m": 6, "tag": "Cardio", "t": "Walk after you eat", "b": "A ten or fifteen minute walk after a meal blunts the rise in blood sugar that follows it. Working muscle pulls sugar out of the blood. After dinner is the best time, since that's usually the biggest meal and the one followed by the couch."},
 {"m": 6, "tag": "Cardio", "t": "Sport counts", "b": "Pickleball, tennis, basketball, soccer, a long hike, a day of skiing. Each counts as your cardio for the day. Games bring things a treadmill can't: quick changes of direction, reaction, other people, and a reason to show up. Tap it in the app and move on."},
 {"m": 6, "tag": "Cardio", "t": "Sport isn't strength", "b": "Two hours of pickleball is good cardio. It doesn't replace a strength day. Sport loads your body in the same few patterns again and again, and it leaves out most of what lifting covers. Play the game, and keep your strength days."},
 {"m": 6, "tag": "Cardio", "t": "Weekend warriors", "b": "If your week only allows one or two big sessions, take them. Large studies have found that people who pack their activity into a day or two get most of the health benefit of people who spread it out. The risk is injury, so warm up and build gradually."},
 {"m": 6, "tag": "Cardio", "t": "Heat", "b": "Hot weather adds stress to every session. Go early or late, slow down, and drink before you're thirsty. Your body adapts to heat over a week or two if you ease into it. Dizziness, chills, a headache or confusion mean stop, get to shade and cool off."},
 {"m": 6, "tag": "Cardio", "t": "Test week", "b": "It's the end of your sixth month, and every second month we measure. Repeat what you did last time, under the same conditions: your weigh-in and body composition, your waist, and your fitness test. This month, look hardest at the fitness number. Compare it with your earlier tests, not with last week."},
 {"m": 6, "tag": "Cardio", "t": "A good cardio week", "b": "A good week looks like this: two or three easy sessions of thirty to forty-five minutes, one or two hard ones, and a day with a lot of walking or a game. Nothing in the mushy middle. Add your strength days and daily mobility and the week is full."},
 {"m": 6, "tag": "Cardio", "t": "Cardio in one line", "b": "Easy most days, hard once or twice a week, enough steps, and a game when you can get one. Then check the fitness number every couple of months. Next month covers what makes all of the training work: sleep."},
 {"m": 7, "tag": "Sleep", "t": "The multiplier", "b": "Six months in, here's the habit that makes the others work. Muscle is repaired during sleep. Appetite is set by it. So is your willingness to train tomorrow. A person who lifts, eats well and sleeps five hours gets a fraction of what the work should give them."},
 {"m": 7, "tag": "Sleep", "t": "Seven or more", "b": "Most adults need at least seven hours of sleep a night, and many need eight. Very few people do well on six, although many believe they do. Being used to feeling tired isn't the same as being rested. The app gives the point at seven hours."},
 {"m": 7, "tag": "Sleep", "t": "The wake time", "b": "If you fix one thing, fix when you get up. Rising at the same time every day, weekends included, anchors your body clock. Sleepiness then arrives at about the same time each night. A steady wake time is easier to control than a bedtime, and it pulls the bedtime into line."},
 {"m": 7, "tag": "Sleep", "t": "Work backward", "b": "Take your wake time and count back eight hours. That's when the lights go out, and it leaves room for the time it takes to fall asleep. If you get up at six, you're in bed by ten. Most people who are short on sleep never did that subtraction."},
 {"m": 7, "tag": "Sleep", "t": "Short sleep and hunger", "b": "After a short night you're hungrier, and you want sugar and starch. In sleep-restriction studies, the hormone that drives appetite goes up and the one that signals fullness goes down. If your eating falls apart on certain days, check how you slept the night before."},
 {"m": 7, "tag": "Sleep", "t": "Short sleep and training", "b": "A short night makes the same workout feel harder, slows reaction time and dulls coordination. Recovery suffers too. One bad night won't undo anything, so train anyway and keep it moderate. A steady run of short nights is when people stall or get hurt."},
 {"m": 7, "tag": "Sleep", "t": "Weekend drift", "b": "Staying up two hours later on Friday and Saturday and then sleeping in is like flying two time zones west and back every week. Monday morning is the jet lag. Keep your weekend wake time within an hour of your weekday one, and Monday gets easier."},
 {"m": 7, "tag": "Sleep", "t": "Your body clock", "b": "Your body runs on a clock of about twenty-four hours, and light is what sets it. Bright light in the morning tells the clock the day has started. That starts a timer for sleepiness roughly sixteen hours later. This week is about using light and caffeine with the clock instead of against it."},
 {"m": 7, "tag": "Sleep", "t": "Morning light", "b": "Get outside within an hour of waking, for ten minutes or so. Outdoor light is far brighter than indoor light, even on a cloudy Rochester morning. A walk with the dog or coffee on the porch does it. It's free, and it's one of the more dependable sleep habits we have."},
 {"m": 7, "tag": "Sleep", "t": "Dim the evening", "b": "Bright light at night tells the clock it's still daytime and pushes sleep later. In the last hour or two before bed, turn off the overhead lights and use a lamp. Lower the brightness on your screens. Evening is when you want your house to look like evening."},
 {"m": 7, "tag": "Sleep", "t": "Screens", "b": "The light from a phone is part of the problem. The bigger part is what's on it. News, work email and scrolling keep your brain switched on. Charge the phone outside the bedroom, or at least across the room, and use an ordinary alarm clock. It's a hard habit to start and it works."},
 {"m": 7, "tag": "Sleep", "t": "Caffeine lasts", "b": "Caffeine blocks the signal that makes you feel sleepy, and it stays in your system for hours. Half of a cup of coffee is still circulating five or six hours later. You may fall asleep fine and still sleep more lightly without knowing it."},
 {"m": 7, "tag": "Sleep", "t": "A caffeine cutoff", "b": "In one study, 400 milligrams of caffeine, about two large coffees, taken six hours before bed cut sleep by more than an hour. People in the study often didn't notice. Set a cutoff of noon or early afternoon. Enjoy the morning coffee and switch to decaf or water after lunch."},
 {"m": 7, "tag": "Sleep", "t": "Cool, dark, quiet", "b": "Your body temperature has to drop for you to fall asleep, so a cool room helps; the mid-sixties suits most people. Make the room as dark as you can, and cover or remove anything that glows. If noise wakes you, a fan or a white-noise machine is cheap and effective."},
 {"m": 7, "tag": "Sleep", "t": "The nightcap", "b": "Alcohol makes you sleepy, which is why people think it helps them sleep. It's a sedative, and sedation isn't the same as sleep. You fall asleep faster and then sleep worse. This week covers what a few drinks do to the night and how to limit the damage."},
 {"m": 7, "tag": "Sleep", "t": "The second half of the night", "b": "As your body clears alcohol, sleep gets lighter and more broken. People wake at three in the morning, hot and thirsty with a racing heart, and can't get back down. Alcohol also cuts into REM sleep, the stage tied to memory and mood."},
 {"m": 7, "tag": "Sleep", "t": "The next day", "b": "After a night of drinking, your resting heart rate runs higher and your recovery numbers run lower, if you wear something that tracks them. You feel it in the workout. This is why the app counts drinks on their own line, apart from your food ratio."},
 {"m": 7, "tag": "Sleep", "t": "Earlier is better", "b": "If you're going to drink, drink earlier. A beer at a five o'clock cookout is mostly cleared by bedtime. The same beer at ten is still being processed at two. Leaving about three hours between your last drink and bed makes a real difference in how you sleep."},
 {"m": 7, "tag": "Sleep", "t": "Fewer is better", "b": "The effect on sleep rises with the dose. One drink has a small effect, and three or four have a large one. Alternate with water, pour smaller, and decide your number before you go out. You can enjoy the evening and still get a decent night."},
 {"m": 7, "tag": "Sleep", "t": "Snoring", "b": "Alcohol relaxes the muscles of the throat, so snoring and sleep apnea get worse after drinking. If someone tells you that you snore loudly or stop breathing in your sleep, or you're tired every day despite enough hours in bed, ask your doctor about a sleep study. Apnea is common and treatable."},
 {"m": 7, "tag": "Sleep", "t": "A dry stretch", "b": "Try a week or two without alcohol and watch what happens to your sleep, your morning energy and your workouts. Many people are surprised by the difference. You don't have to quit. You'll just know what it costs, which makes it easier to decide what's worth it."},
 {"m": 7, "tag": "Sleep", "t": "Naps", "b": "A short nap is a good tool. Keep it to about twenty minutes and take it before mid-afternoon. Longer or later naps leave you groggy and steal from the coming night. If you need a long nap every day to function, the nights are what need attention."},
 {"m": 7, "tag": "Sleep", "t": "One bad night", "b": "Everyone has them. One poor night changes very little, and your body makes up some of it the next night on its own. Get up at your usual time, get outside, and go easy on the caffeine. Sleeping in or napping for hours tends to wreck the following night as well."},
 {"m": 7, "tag": "Sleep", "t": "Awake at 3 a.m", "b": "If you're awake for more than about twenty minutes, get out of bed. Sit somewhere dim and read something dull until you're sleepy, then go back. Lying there frustrated teaches your brain that bed is a place to worry. And turn the clock so you can't see it."},
 {"m": 7, "tag": "Sleep", "t": "Travel", "b": "Your clock shifts roughly an hour a day, so a six-hour time change takes most of a week. Help it along: switch to local time as soon as you board, get outdoor light in the new morning, and eat meals on the local schedule. Skip the long nap on arrival day."},
 {"m": 7, "tag": "Sleep", "t": "Early mornings and shift work", "b": "If your job has you up before dawn or working nights, the principles hold. Keep the schedule as regular as the job allows, get bright light at the start of your \"day,\" and make the bedroom truly dark for daytime sleep. Protect your sleep window the way you'd protect a meeting."},
 {"m": 7, "tag": "Sleep", "t": "When sleep stays bad", "b": "If you've had trouble falling or staying asleep at least three nights a week for three months, that's insomnia, and it's treatable. The best first treatment is a structured program called CBT-I, which works better over time than sleeping pills. Ask your doctor about it."},
 {"m": 7, "tag": "Sleep", "t": "Sleep aids", "b": "Melatonin is a timing signal more than a sedative. A small dose can help with jet lag; for ordinary nights the effect is modest. Over-the-counter sleep aids leave many people foggy the next day and aren't meant for regular use. Fixing light, caffeine and timing does more."},
 {"m": 7, "tag": "Sleep", "t": "About sleep trackers", "b": "A watch or ring estimates your sleep, and it's reasonably good at total time. It's less reliable on stages like deep and REM. Use it to spot patterns, like what alcohol or a late meal does. If the score makes you anxious, stop looking. How you feel matters more."},
 {"m": 7, "tag": "Sleep", "t": "A wind-down", "b": "Give yourself thirty minutes before bed with the same short routine. Dim the lights, put the phone on its charger, stretch for ten minutes, read a few pages. Your mobility work fits here well. The routine is a cue, and after a few weeks your body starts getting sleepy when it begins."},
 {"m": 7, "tag": "Sleep", "t": "Sleep in one line", "b": "Seven or more hours, the same wake time every day, light in the morning, caffeine before noon, the last drink early, and a cool, dark room. Next month we take the plan out of the house: restaurants, cookouts, games and travel."},
 {"m": 8, "tag": "Real world", "t": "Out of the house", "b": "The plan is easy in your own kitchen. This month is about everywhere else: restaurants, cookouts, ball games, bars and vacations. None of them are off limits. The 70/30 split was built for a life with these in it. You only need a few habits that travel."},
 {"m": 8, "tag": "Real world", "t": "Find the protein", "b": "At any restaurant, start with one question: where's the protein? Pick the dish built around chicken, fish, steak, eggs, shrimp, tofu or beans. Then find a vegetable or a salad to go with it. Order those two things and whatever else lands on the plate matters much less."},
 {"m": 8, "tag": "Real world", "t": "Trade a side", "b": "Most places will swap fries for a salad, vegetables or fruit if you ask. One trade turns an in-between meal into a quality one. Or keep the fries and add a side salad. The goal is to get produce onto the table, not to take the fun off it."},
 {"m": 8, "tag": "Real world", "t": "Portions", "b": "Restaurant plates are often two meals' worth. You don't have to finish. Eat the protein and the vegetables first, slow down, and stop when you're satisfied. Take the rest home. The leftover half makes a good lunch tomorrow, and it's already paid for."},
 {"m": 8, "tag": "Real world", "t": "The bread and the chips", "b": "The basket arrives when you're hungriest, before any real food does. Have a piece if you like it. Then ask for it to be taken away, or slide it down the table. Almost nobody eats chips because they decided to. They eat them because they're there."},
 {"m": 8, "tag": "Real world", "t": "Fast food", "b": "When it's the drive-through or nothing, you can still do fine. A grilled chicken sandwich, a burrito bowl, a burger with a side salad, egg bites and fruit. Protein first, some produce if they have it, water or unsweetened to drink. It counts as in-between at worst."},
 {"m": 8, "tag": "Real world", "t": "Rate it and move on", "b": "After a meal out, log it honestly. Had protein and produce? Quality. Had one of them? In-between. Neither? Off plan, and that's fine; you have room for it. The meal is over. It doesn't need to be made up for at the next one."},
 {"m": 8, "tag": "Real world", "t": "The cookout", "b": "A backyard cookout is friendlier to the plan than it looks. The grill is all protein: burgers, chicken, sausages, fish. There's usually fruit, corn, a salad or a vegetable tray. Build the same plate you'd build at home, then have the thing you came for."},
 {"m": 8, "tag": "Real world", "t": "Bring the side", "b": "If you're a guest, bring what you'd want to eat: a big salad, cut watermelon, grilled vegetables, a bean dish. You've guaranteed there's produce on the table, and the host is glad not to make it. It's the easiest way I know to keep a party on plan."},
 {"m": 8, "tag": "Real world", "t": "Don't stand by the food", "b": "Most party eating is grazing. A handful of chips every time you pass the table adds up to a meal you don't remember. Make one plate, sit down with it, then move your conversation to the other side of the yard."},
 {"m": 8, "tag": "Real world", "t": "Eat before you go", "b": "Arriving hungry at a party or a ballpark is how the plan falls apart. Have some protein an hour before: yogurt, eggs, a shake. You'll still enjoy the food there. You'll just pick what you want instead of eating whatever is closest."},
 {"m": 8, "tag": "Real world", "t": "At the game", "b": "Stadium food is off plan nearly by design, and that's all right. A hot dog and a beer at the ballpark is one of the things the thirty percent exists for. Eat well earlier in the day, enjoy the game, log it and go back to normal at the next meal."},
 {"m": 8, "tag": "Real world", "t": "One meal, not one day", "b": "The trouble is rarely the cookout. It's deciding that the day is ruined and carrying on through the evening and into tomorrow. One off-plan meal out of twenty-one in a week is under five percent. Treat it as a single meal and the week barely notices."},
 {"m": 8, "tag": "Real world", "t": "Dessert", "b": "If you love it, have it and enjoy it. If it's only there, skip it. That one question, \"do I really want this?\", sorts most desserts. Sharing one works well, since the first few bites are the best ones anyway."},
 {"m": 8, "tag": "Real world", "t": "An honest look at alcohol", "b": "Nothing is banned in this program, and that includes a drink. But be clear about what alcohol is. It doesn't improve your health at any dose, and the risks rise with how much you drink. This week is about fitting it in on purpose, with the costs in view."},
 {"m": 8, "tag": "Real world", "t": "What counts as a drink", "b": "One drink is twelve ounces of regular beer, five ounces of wine or a shot and a half of liquor. A pint of strong IPA is closer to two. So is a generous pour of wine at home. Count by those standards when you tap a drink into the app."},
 {"m": 8, "tag": "Real world", "t": "The weekly line", "b": "The program's line is seven drinks a week or fewer, with less being better. Spread out, that's about one a day. Saved up for Saturday, it's a different thing entirely, and your sleep, your Sunday and your recovery will show it."},
 {"m": 8, "tag": "Real world", "t": "Alcohol and muscle", "b": "In a lab study, a heavy night of drinking after a workout cut the muscle-building response by about a quarter, even with plenty of protein. That was a big dose, around twelve drinks. A beer after a game won't erase your training. A regular habit of heavy nights will hold it back."},
 {"m": 8, "tag": "Real world", "t": "Alcohol and appetite", "b": "Drinks carry a lot of energy and no protein, and they lower your guard around food. The late-night pizza is part of the cost of the third beer. If you're stuck on body fat and can't see why, look at your drinks line before anything else."},
 {"m": 8, "tag": "Real world", "t": "Make the swap easy", "b": "A few things that work: a glass of water between drinks, a light beer in place of a strong one, a smaller wine glass at home. Non-alcoholic beer has become quite good. Or don't keep it in the house, and have your drinks when you're out with people."},
 {"m": 8, "tag": "Real world", "t": "When it's more than a habit", "b": "If you often drink more than you meant to, need it to unwind or sleep, or the people close to you have said something, take that seriously. Talk to your doctor. It's a common medical problem with good treatments, and asking about it is ordinary."},
 {"m": 8, "tag": "Real world", "t": "Vacation isn't a break from you", "b": "The goal on a trip is to come home about where you left. Not to make progress, and not to throw away a month of work. Keep two habits: protein at each meal and some movement every day. Let the rest go and enjoy where you are."},
 {"m": 8, "tag": "Real world", "t": "The hotel breakfast", "b": "Hotel buffets are better than they look. Eggs, yogurt, fruit and oatmeal are nearly always there. Start with those, and then have the waffle if you still want it. A quality breakfast is the easiest win of a travel day, and it steadies the rest of your eating."},
 {"m": 8, "tag": "Real world", "t": "Airports and road trips", "b": "Pack for it. Nuts, jerky, a protein bar, an apple and a water bottle cover most of a travel day. In the airport, look for a salad with chicken, a burrito bowl or a sandwich with real meat. Gas stations now carry yogurt, cheese sticks and hard-boiled eggs."},
 {"m": 8, "tag": "Real world", "t": "Training on the road", "b": "You need very little. A hotel gym with dumbbells covers a strength day. Without one, do twenty minutes in the room: squats, push-ups, lunges, planks, a single-leg deadlift. One or two short sessions in a week away is enough to hold what you've built."},
 {"m": 8, "tag": "Real world", "t": "Walk the place", "b": "Vacations are the easiest step days of the year. Explore on foot, take the stairs, swim, hike, rent a bike. That's your cardio, and it counts in the app. I'd much rather you see a city on foot than spend your trip in a hotel gym."},
 {"m": 8, "tag": "Real world", "t": "Coming home", "b": "The first day back decides a lot. Go to the grocery store before you unpack, or have an order waiting. Do a workout within a day, even a short one. The scale will be up a few pounds from salt and travel. Ignore it for a week."},
 {"m": 8, "tag": "Real world", "t": "Test week", "b": "It's the end of your eighth month, and every second month we measure. Repeat your weigh-in and body composition, your waist and your fitness test, under the same conditions as last time. A month full of meals out is a hard one to stay on plan. Holding steady through it is a good result."},
 {"m": 8, "tag": "Real world", "t": "Decide beforehand", "b": "Most of this month comes down to one habit: decide before you get there. Before the restaurant, the party or the trip, pick what you'll order, how many drinks you'll have and when you'll move. Decisions made ahead of time hold up. Ones made hungry in front of the menu don't."},
 {"m": 8, "tag": "Real world", "t": "The people you eat with", "b": "We tend to eat like the people we eat with. You don't need new friends. It helps to say out loud what you're doing, and to be the one who orders first, suggests the walk or brings the fruit. People often follow, and several are glad someone else started."},
 {"m": 8, "tag": "Real world", "t": "The real world in one line", "b": "Find the protein, add produce, enjoy the rest, count your drinks, and treat every meal as one meal. Next month is about why some people keep doing this for years while others stop: habits."},
 {"m": 9, "tag": "Habits", "t": "Why habits get a month", "b": "You know what to do by now. Eight months of lessons have covered it. This month is about the harder part, which is doing it on an ordinary Tuesday for years. People who stay fit into their seventies aren't more disciplined than everyone else. They've built routines that take very little thought."},
 {"m": 9, "tag": "Habits", "t": "Make it small", "b": "The most reliable way to start a habit is to shrink it until it's almost too easy. Ten minutes of stretching. One quality meal. A walk around the block. Small things get done on bad days, and the bad days are when habits are won or lost."},
 {"m": 9, "tag": "Habits", "t": "One at a time", "b": "If something in the program still isn't sticking, pick only that one. Give it your attention for two or three weeks and let everything else run as it is. People who try to fix five things at once usually fix none. One at a time is slower and it works."},
 {"m": 9, "tag": "Habits", "t": "Attach it to something", "b": "A new habit holds best when it's tied to something you already do every day. After I pour my coffee, I take my creatine. After my workout, I stretch. After dinner, we walk. The existing routine is the reminder, so you don't have to remember."},
 {"m": 9, "tag": "Habits", "t": "Make it specific", "b": "\"I'll exercise more\" isn't a plan. \"Tuesday at six, strength class in the basement\" is. Decide the day, the time and the place ahead of time. In studies, people who write down when and where they'll do something follow through far more often than people with good intentions."},
 {"m": 9, "tag": "Habits", "t": "Set up the room", "b": "Make the good choice the easy one. Lay out your clothes the night before. Keep the dumbbells where you can see them. Put fruit on the counter and the cookies on a high shelf. You'll rely on willpower less when the room is arranged in your favor."},
 {"m": 9, "tag": "Habits", "t": "The two-minute start", "b": "On days you don't want to train, agree to do two minutes. Put on the shoes, start the warm-up, and give yourself permission to stop. You almost never will. Getting started is the hard part, and once you're moving the rest usually follows."},
 {"m": 9, "tag": "Habits", "t": "You will miss", "b": "Everyone misses days. Kids get sick, work blows up, you travel, you just don't feel like it. The plan was never to be perfect. What matters is what you do the day after, and that's what this week is about."},
 {"m": 9, "tag": "Habits", "t": "Don't miss twice", "b": "The rule is simple. One missed day is a rest day. Two in a row is the beginning of a different habit. After a miss, the only job is to do something the next day, however small. Open the app, tap one thing, and you're back."},
 {"m": 9, "tag": "Habits", "t": "One miss doesn't count against you", "b": "In the best-known study of how habits form, people who skipped a single day did just as well in the end as people who didn't. One miss had no measurable effect. What undid people was the long gap that follows when someone decides they've already failed."},
 {"m": 9, "tag": "Habits", "t": "The all-or-nothing trap", "b": "\"I've blown it, so I'll start again Monday.\" That one thought does more damage than any dessert. There's nothing to start over. A week is twenty-one meals and seven days of movement, and one of them went sideways. The next one is the one that counts."},
 {"m": 9, "tag": "Habits", "t": "Have a short version", "b": "For every habit, keep a backup that takes five minutes. No time for the class? Do one set each of squats, push-ups and rows. No time to cook? Yogurt, fruit and a handful of nuts. A short version keeps the routine alive on days the full one won't fit."},
 {"m": 9, "tag": "Habits", "t": "Sick and hurt", "b": "Being sick or injured isn't a missed day. With a fever or anything in your chest, rest until it clears. With a head cold, an easy walk is fine. With an injury, train around it. Keep the easy habits going, like protein and sleep, so there's less to restart."},
 {"m": 9, "tag": "Habits", "t": "After a long break", "b": "If you've been away for weeks, don't try to pick up where you left off. Come back at about half and build over two or three weeks. Start with the easiest habit and add from there. It returns faster the second time, because your body remembers."},
 {"m": 9, "tag": "Habits", "t": "Motivation fades", "b": "Motivation is high in the first weeks of anything new and gone within a couple of months, for nearly everyone. That's normal and it isn't a flaw in you. If the plan only works when you feel like it, the plan will fail. Build something that runs on the days you don't."},
 {"m": 9, "tag": "Habits", "t": "Routine carries you", "b": "You don't decide each morning whether to brush your teeth. It just happens, at the same point in the day. That's where you want your workouts and your meals: same days, same time, same place. The fewer decisions involved, the more often it gets done."},
 {"m": 9, "tag": "Habits", "t": "How long it takes", "b": "A habit doesn't form in twenty-one days. In one study, the average was sixty-six days, and people ranged from eighteen days to more than eight months. If something still takes effort after a month, nothing is wrong. Keep going. It gets easier and then automatic."},
 {"m": 9, "tag": "Habits", "t": "Change who you are", "b": "\"I'm trying to work out more\" is easy to drop. \"I'm someone who trains three days a week\" is harder to walk away from. Every session you log is a small piece of evidence for that. After enough of them, it's simply true, and it's part of how you see yourself."},
 {"m": 9, "tag": "Habits", "t": "Watch the inputs", "b": "You can't make the scale move today. You can lift, eat the protein and get to bed. That's why the app scores what you do and not what you weigh. Results show up weeks later and unevenly. Keep the score on the part that's in your hands."},
 {"m": 9, "tag": "Habits", "t": "The streak", "b": "A streak is useful because you won't want to break it. It becomes a problem when one missed day makes you feel the whole thing is lost. Count it another way: how many of the last thirty days did you show up? Twenty-five out of thirty is excellent."},
 {"m": 9, "tag": "Habits", "t": "When you're bored", "b": "Boredom ends more programs than injury does. The habit can stay the same while the details change. Try a different class or a new instructor, take the ride outside, cook a new protein, find a new trail. Keep the day and the time fixed, and vary what fills it."},
 {"m": 9, "tag": "Habits", "t": "It's easier together", "b": "People who train with someone show up more often. A partner is waiting, and you don't want to be the one who cancels. Find one person: a spouse, a neighbor, a friend with the same app. Even a text that says \"done\" each morning helps."},
 {"m": 9, "tag": "Habits", "t": "Tell people", "b": "Say what you're doing, plainly and without a sermon. \"I lift Tuesday and Thursday mornings.\" \"I'm eating protein at every meal.\" Once people know, they stop offering you the things you're avoiding, and a few of them will quietly ask how to start."},
 {"m": 9, "tag": "Habits", "t": "Your house", "b": "If the people you live with eat differently, don't fight about it. Cook the protein and vegetables for everyone and let each person add what they like. You're not putting the family on a program. You're making a good dinner, and people eat what's served."},
 {"m": 9, "tag": "Habits", "t": "Kids are watching", "b": "Children copy what they see far more than what they're told. A parent who exercises, eats vegetables and goes to bed on time is teaching all of it without a word. Bring them along for the walk or the stretch. It doesn't have to be a lesson."},
 {"m": 9, "tag": "Habits", "t": "When someone isn't on board", "b": "Not everyone will cheer. Some people take your changes as a comment on their own choices, though you never said a thing. Don't argue or recruit. Keep doing it without fuss. Results over time tend to settle it, and people often come around."},
 {"m": 9, "tag": "Habits", "t": "Find your people", "b": "A class, a running group, a pickleball league, the Saturday morning regulars. Showing up is easier when people expect you and notice if you don't. Ask around; most towns have more of these than you'd guess. For many people the company is what keeps them coming back."},
 {"m": 9, "tag": "Habits", "t": "Help someone start", "b": "Once you've done this for a while, someone will ask about it. Share the app and offer to do the first week with them. Explaining it makes it clearer in your own head, and having someone count on you is one of the better reasons to keep going."},
 {"m": 9, "tag": "Habits", "t": "Check your system", "b": "Look back over the month. Which habit runs on its own now, and which still needs a push? For the one that needs a push, ask what would make it easier: a different time of day, a smaller version, a partner. Change the setup and stop blaming your willpower."},
 {"m": 9, "tag": "Habits", "t": "Habits in one line", "b": "Start small, tie it to something you already do, make the plan specific, never miss twice, and bring someone with you. Next month: supplements. What has good evidence, what doesn't, and how to keep from wasting your money."},
 {"m": 10, "tag": "Supplements", "t": "Why supplements come tenth", "b": "We left supplements until month ten on purpose. Food, training and sleep do nearly all of the work, and nothing in a bottle makes up for skipping them. A few products do have solid research behind them, though. This month covers those, the many that don't, and how to tell them apart."},
 {"m": 10, "tag": "Supplements", "t": "Creatine", "b": "Creatine monohydrate is the most studied sports supplement there is. Three to five grams a day helps you get an extra rep or two, and over months that adds up to more strength and muscle. It's cheap and has a long safety record in healthy adults. It's first on my list for most people who lift."},
 {"m": 10, "tag": "Supplements", "t": "Taking creatine", "b": "Take three to five grams once a day, at any time, mixed into anything. You don't need a loading phase or a fancy form; plain monohydrate is the one that was studied. Expect a pound or two of water weight in the muscle. It can nudge a kidney lab called creatinine, so tell your doctor you take it."},
 {"m": 10, "tag": "Supplements", "t": "Protein powder", "b": "Protein powder is food in a convenient form. A scoop of whey gives you twenty to twenty-five grams, which helps on mornings when breakfast would otherwise be toast. It isn't better than chicken or yogurt. Use it to fill a gap, and get most of your protein from meals."},
 {"m": 10, "tag": "Supplements", "t": "Vitamin D", "b": "Vitamin D matters for bone and muscle, and many people in northern places like Rochester run low, especially by the end of winter. But in a large trial, giving it to adults who weren't deficient didn't prevent heart disease or cancer. So test first. If you're low, supplement, and recheck."},
 {"m": 10, "tag": "Supplements", "t": "Fish oil", "b": "The case for fish oil is weaker than most people think. In a trial of nearly 26,000 adults, a gram a day didn't lower major heart events overall. Eating fish twice a week is still a good idea. Prescription-strength omega-3 for high triglycerides is a separate matter for you and your doctor."},
 {"m": 10, "tag": "Supplements", "t": "Caffeine", "b": "Caffeine is a performance aid with good evidence behind it. A cup or two of coffee about an hour before training makes hard efforts feel easier. You don't need a pre-workout powder for that. Keep it to the morning, because we spent a whole month protecting your sleep."},
 {"m": 10, "tag": "Supplements", "t": "Nobody checks first", "b": "In the United States, supplements go on sale without anyone verifying what's in the bottle or whether it works. The FDA steps in only after problems are reported. So the label is a claim made by the seller. That's the starting point for everything this week."},
 {"m": 10, "tag": "Supplements", "t": "Third-party tested", "b": "Look for a seal from an independent lab: NSF Certified for Sport, Informed Sport or USP. It means someone other than the manufacturer confirmed that the contents match the label and checked for contaminants. It doesn't prove the product works. It's the minimum I'd ask of anything you swallow daily."},
 {"m": 10, "tag": "Supplements", "t": "One ingredient", "b": "Buy single-ingredient products. Creatine monohydrate and nothing else. Whey protein with a short ingredient list. Blends with a dozen ingredients hide the dose of each one and make it impossible to know what's helping or what's upsetting your stomach."},
 {"m": 10, "tag": "Supplements", "t": "\"Proprietary blend.\"", "b": "When a label lists a proprietary blend with only a total weight, the company is declining to tell you how much of each ingredient you're getting. Usually that means a sprinkle of the expensive ones and a lot of the cheap ones. Put it back on the shelf."},
 {"m": 10, "tag": "Supplements", "t": "Check the dose", "b": "A product can contain the right ingredient at a dose too small to do anything. Creatine works at three to five grams, and some gummies and blends give you a fraction of that. Compare the label with the dose used in the research before you pay for it."},
 {"m": 10, "tag": "Supplements", "t": "Price", "b": "The supplements that work are cheap. Creatine costs pennies a day and plain whey not much more. A high price pays for marketing, packaging and a sponsored athlete. If a product is expensive and promises a lot, that's two reasons to doubt it."},
 {"m": 10, "tag": "Supplements", "t": "Tell your doctor", "b": "Bring your supplements, or a list of them, to your appointments. Some interact with medications, some change lab results, and a few should be stopped before surgery. Your doctor can't account for what they don't know about. Tell them, even if it feels minor."},
 {"m": 10, "tag": "Supplements", "t": "The long list", "b": "Most supplements fall into one of three groups: they've been tested and don't work, they haven't been tested in people, or they work a little at a price that isn't worth it. This week goes through the ones I'm asked about most, and why they're not in the program."},
 {"m": 10, "tag": "Supplements", "t": "Testosterone boosters", "b": "The herbal products sold to raise testosterone don't do it in any way that matters. If you have real symptoms of low testosterone, that calls for a morning blood test and a conversation with your doctor. Lifting, sleeping well and losing excess body fat are what reliably help."},
 {"m": 10, "tag": "Supplements", "t": "Fat burners", "b": "Fat-burner pills are mostly caffeine with a few plant extracts. The effect on body fat is close to nothing. The effects on heart rate, blood pressure and sleep are real, and some of the extracts have caused liver injury. A cup of coffee does the same job for less."},
 {"m": 10, "tag": "Supplements", "t": "BCAAs", "b": "Branched-chain amino acids are three of the building blocks found in any complete protein. If you're eating enough protein, you already get plenty, and extra adds nothing. If you aren't, the answer is more protein, not three amino acids in a flavored drink."},
 {"m": 10, "tag": "Supplements", "t": "Greens powders", "b": "A scoop of greens powder doesn't replace vegetables. The fiber is mostly gone, the amounts are small, and the blends are rarely tested. For the price of one tub you could buy a month of frozen spinach and berries. Put those in a smoothie and you've done it properly."},
 {"m": 10, "tag": "Supplements", "t": "Multivitamins", "b": "For adults who eat a reasonable diet, large trials of multivitamins haven't shown fewer heart attacks, less cancer or longer life. They aren't harmful, and they're sensible in some situations, such as pregnancy or a restricted diet. For most of us, the money is better spent on groceries."},
 {"m": 10, "tag": "Supplements", "t": "The maybes", "b": "A few are in between. Magnesium may help some people who get little from food, though the evidence for sleep is thin. Collagen has small studies suggesting a benefit for joints and tendons, and more are needed. They're reasonable to try and reasonable to skip. They aren't essentials."},
 {"m": 10, "tag": "Supplements", "t": "GLP-1 medications", "b": "Semaglutide and tirzepatide are real medicines with strong trials behind them. People lose a large share of their body weight on them, and for someone with obesity or diabetes they can change the course of their health. They're prescriptions that need a doctor's supervision. They aren't supplements or shortcuts."},
 {"m": 10, "tag": "Supplements", "t": "What gets lost", "b": "In the main semaglutide trial, a body-scan substudy found that roughly a third or more of the weight lost was lean tissue rather than fat. That's why anyone on these drugs needs two things from this program more than anyone: protein at every meal and strength training three days a week."},
 {"m": 10, "tag": "Supplements", "t": "What happens after", "b": "When people in that trial stopped the drug, they regained about two-thirds of the weight within a year. The medicine works while you take it. So the habits have to be built during treatment, because they're what remains once the appetite comes back."},
 {"m": 10, "tag": "Supplements", "t": "If you're on one", "b": "If you take a GLP-1, this program fits you well. Eat your protein first, since you'll be eating less overall. Lift three days a week. Track body composition, not only weight, so you can see that you're keeping muscle. And stay in touch with whoever prescribes it."},
 {"m": 10, "tag": "Supplements", "t": "Peptides", "b": "BPC-157 and the other \"healing\" peptides sold online are nearly all supported by animal studies and testimonials. They haven't been through proper human trials, they aren't approved by the FDA, and what's in the vial is anyone's guess. Patients ask me about them all the time. I don't recommend them."},
 {"m": 10, "tag": "Supplements", "t": "CBD", "b": "CBD is sold for pain, sleep and recovery. The human evidence for those uses is thin, and tests of store products have often found that the contents don't match the label. It can also interact with medications. I'm not against it. I just haven't seen enough to tell you it's worth buying."},
 {"m": 10, "tag": "Supplements", "t": "How to read a health claim", "b": "When you see a claim online, ask a few questions. Was it tested in people or in mice? How many people, and for how long? Compared with what? Is the person telling you selling it? Most claims fall apart by the second question."},
 {"m": 10, "tag": "Supplements", "t": "Blood work", "b": "A yearly check with your doctor tells you more than any supplement can. The basics are lipids, blood sugar, kidney and liver function, and vitamin D if you're at risk of being low. Keep the results from year to year. Seeing those numbers improve over the years is one of the better rewards of this."},
 {"m": 10, "tag": "Supplements", "t": "Test week", "b": "It's the end of your tenth month, so it's time to measure. Repeat your weigh-in and body composition, your waist and your fitness test, under the same conditions as last time. You now have five sets of numbers going back to your second month. Look at the direction across all of them."},
 {"m": 10, "tag": "Supplements", "t": "Supplements in one line", "b": "Creatine daily, protein powder when food falls short, vitamin D if a test says you're low, and coffee before a workout if you like it. Buy tested, single-ingredient products and skip the rest. Next month: sauna, cold, stress and getting through the holidays."},
 {"m": 11, "tag": "Recovery", "t": "The extras", "b": "Sauna, cold and breathing work are the extras in this program. They earn bonus points, and none of them replaces lifting, eating well or sleeping. Some have decent research behind them and some have less than the internet suggests. This month goes through which is which."},
 {"m": 11, "tag": "Recovery", "t": "The Finnish data", "b": "The best sauna evidence comes from a study that followed about 2,300 Finnish men for twenty years. Men who used a sauna two or three times a week had roughly a quarter fewer deaths from heart disease than men who went once. Those who went four to seven times had about half."},
 {"m": 11, "tag": "Recovery", "t": "What that study can't say", "b": "That study watched people; it didn't assign them to a sauna. Men who use one often may be healthier, wealthier or more relaxed to begin with. So it shows a strong link and stops short of proof. Smaller experiments on blood pressure and blood vessels do point the same way."},
 {"m": 11, "tag": "Recovery", "t": "What heat does", "b": "In a sauna your heart rate climbs to what you'd see on a brisk walk, your blood vessels open up and you sweat. It's a mild workout for the circulation while you sit still. Blood pressure tends to run a little lower afterward. Most people also just feel better and sleep well that night."},
 {"m": 11, "tag": "Recovery", "t": "How to do it", "b": "In the Finnish study, sessions longer than about nineteen minutes were linked to the most benefit. A fair target is fifteen to twenty minutes, three times a week. Build up from five or ten. Get out if you feel lightheaded or unwell, and drink water afterward."},
 {"m": 11, "tag": "Recovery", "t": "Who should be careful", "b": "Skip the sauna after drinking alcohol; that combination is behind most sauna accidents. If you have heart disease, low blood pressure, or you're pregnant, check with your doctor first. Stand up slowly when you're done, since blood pressure can dip."},
 {"m": 11, "tag": "Recovery", "t": "No sauna?", "b": "A hot bath does some of the same things, and small studies suggest benefits for blood vessels and sleep. Many gyms and Ys have a sauna or steam room you may be walking past. If neither is handy, let it go. It's a bonus, and you can do the whole program without it."},
 {"m": 11, "tag": "Recovery", "t": "Cold, honestly", "b": "Cold plunges are everywhere right now, and the claims have run well ahead of the research. The studies are small and short. Some effects are real: you feel alert, and soreness eases. The larger promises, like fat loss, immunity and a longer life, aren't supported yet."},
 {"m": 11, "tag": "Recovery", "t": "What cold does", "b": "Cold water sets off a burst of adrenaline-type hormones. Heart rate and breathing jump, and blood vessels in the skin clamp down. A few minutes later most people feel awake and in a better mood, sometimes for hours. That part is dependable, and it's why people keep going back."},
 {"m": 11, "tag": "Recovery", "t": "Where the \"11 minutes\" comes from", "b": "The popular target of eleven minutes of cold a week traces back to a Danish study of eight winter swimmers compared with eight other men. It was observational and it didn't test doses. Use the number as a rough guide if you like. It isn't a proven threshold."},
 {"m": 11, "tag": "Recovery", "t": "Not right after lifting", "b": "One finding is worth knowing. In a twelve-week study, men who sat in cold water for ten minutes after every strength session gained less muscle and strength than men who did an easy cooldown. The cold seems to blunt the signal to adapt. Keep it away from your lifting."},
 {"m": 11, "tag": "Recovery", "t": "When it helps", "b": "Cold water does ease soreness after hard endurance work or a tournament weekend, when feeling fresh tomorrow is the point. A morning cold shower on a non-lifting day is a fine use too. Think of it as a tool for feeling good and for recovery in a pinch."},
 {"m": 11, "tag": "Recovery", "t": "How to start", "b": "You don't need a tub in the garage. Finish your shower with thirty seconds of cold and work toward two or three minutes. Breathe out slowly as the cold hits. Water in the fifties is plenty cold enough. Colder and longer hasn't been shown to be better."},
 {"m": 11, "tag": "Recovery", "t": "Cold safety", "b": "The first seconds in very cold water cause a gasp reflex and a spike in heart rate and blood pressure. People have drowned and had heart rhythm problems that way. Never plunge alone in open water, get in gradually, and skip it if you have heart disease unless your doctor has cleared it."},
 {"m": 11, "tag": "Recovery", "t": "Stress counts", "b": "Stress gets into every part of this program. It shortens sleep, pushes you toward sugar and alcohol, and makes a workout feel like one more chore. You can't remove stress from a full life. You can get better at coming down from it, and that's a skill you can practice."},
 {"m": 11, "tag": "Recovery", "t": "Exercise is the first tool", "b": "The best-studied stress reliever is the one you're already doing. Regular exercise lowers symptoms of anxiety and depression in trial after trial. That's worth remembering on the days you're too stressed to train. Those are the days it does the most good."},
 {"m": 11, "tag": "Recovery", "t": "The long exhale", "b": "The fastest way to settle your body is through your breathing. When you make the exhale longer than the inhale, your heart rate slows within a few breaths. Nobody can see you do it, and it works in a meeting, in traffic or before a hard conversation."},
 {"m": 11, "tag": "Recovery", "t": "Five minutes a day", "b": "In a Stanford study, people who practiced a breathing pattern for five minutes a day for a month improved their mood more than people who did mindfulness meditation. The pattern: two inhales through the nose, the second one short, then a long, slow exhale through the mouth. Repeat."},
 {"m": 11, "tag": "Recovery", "t": "Get outside", "b": "A walk outdoors does several things at once: movement, daylight, and a break from screens. Twenty minutes among trees or near water leaves most people calmer than twenty minutes on a treadmill. On a stressful day, take the walk first and then go back to the problem."},
 {"m": 11, "tag": "Recovery", "t": "People", "b": "Time with people you like is one of the strongest protections for health that we know of, and long studies keep finding it. It also tends to be the first thing dropped when life gets busy. Put the coffee, the phone call or the walk with a friend on the calendar."},
 {"m": 11, "tag": "Recovery", "t": "When it's more than stress", "b": "If you've felt down, anxious or unable to enjoy things for more than a couple of weeks, or it's affecting your work or your sleep, talk to your doctor. These are common medical problems and treatment works. Breathing exercises aren't a substitute for getting help."},
 {"m": 11, "tag": "Recovery", "t": "Holiday season", "b": "Every year has stretches built around food and travel. From Thanksgiving to New Year's is the big one, and there are weddings, reunions and long weekends as well. The aim in those stretches is modest: hold steady. Keep your training days and your protein, enjoy the meals that matter, and come out about where you went in."},
 {"m": 11, "tag": "Recovery", "t": "How much people gain", "b": "The holiday weight gain you hear about is overstated. In the best study, the average was under a pound. The catch is that most people never lost it, so it adds up over the years. Preventing one pound now is much easier than losing ten later."},
 {"m": 11, "tag": "Recovery", "t": "It's a few days", "b": "Count the real holiday meals in the season. Thanksgiving, a party or two, Christmas or Hanukkah dinners, New Year's Eve. Maybe eight meals out of more than a hundred. The damage comes from the weeks of leftovers, cookies and skipped workouts around them."},
 {"m": 11, "tag": "Recovery", "t": "The big meal", "b": "At a holiday dinner, eat the meal and enjoy it. Start with the meat and vegetables, then take the sides you love and skip the ones you don't. One plate, then dessert if you want it. It may well be the best meal of your year. Log it as whatever it was and don't give it another thought."},
 {"m": 11, "tag": "Recovery", "t": "Move that morning", "b": "Train on the morning of a holiday. A turkey trot, a walk with family, a quick strength session before the cooking starts. It doesn't cancel the meal and it isn't supposed to. It keeps the routine going on a day when routines disappear, and you'll feel better at the table."},
 {"m": 11, "tag": "Recovery", "t": "The day after", "b": "What you do the day after a feast matters more than the feast. Get up, eat a normal breakfast with protein, do your workout. Send the leftover pie home with the guests. The meat and vegetables make very good leftovers, so keep those."},
 {"m": 11, "tag": "Recovery", "t": "Schedule the workouts", "b": "Busy seasons fill up quickly. Before one starts, put your three strength days on the calendar, the way you would a party. If a week falls apart, do the short versions. Three twenty-minute sessions will hold your strength through the holidays, and you won't be starting over afterward."},
 {"m": 11, "tag": "Recovery", "t": "Say no kindly", "b": "You'll be offered food and drinks you don't want by people who mean well. \"No thanks, I'm good\" is a complete answer, and nobody is owed an explanation. Take a small serving of your aunt's specialty if it matters to her. Kindness and the plan can both fit."},
 {"m": 11, "tag": "Recovery", "t": "Month eleven in one line", "b": "Sauna if you have one, cold if you enjoy it and away from lifting, a long exhale when you need it, and steady habits through the holidays. Next month is the last one, and it's about the reason for all of this: the long game."},
 {"m": 12, "tag": "Long game", "t": "The long game", "b": "Everything this year has pointed at one goal, and it was never a number on a scale. The goal is to be strong, mobile and independent for as many years as you can. This last month is about what that takes, how far you've come, and how to keep it going next year."},
 {"m": 12, "tag": "Long game", "t": "Healthspan", "b": "Lifespan is how long you live. Healthspan is how long you live well: getting up the stairs, traveling, playing with grandchildren, living in your own home. Most people want the second as much as the first. The habits in this app are aimed squarely at it."},
 {"m": 12, "tag": "Long game", "t": "What changes with age", "b": "From your thirties on, muscle, bone, aerobic fitness and balance all decline slowly, and the decline speeds up after sixty. The rate isn't fixed, though. Much of what we blame on aging is the result of doing less. People who keep training lose all of these far more slowly."},
 {"m": 12, "tag": "Long game", "t": "Muscle is the reserve", "b": "Think of muscle as savings. An illness, a surgery or a few weeks in bed draws it down quickly, and the more you have going in, the better you come out. Older adults with more strength recover faster and stay independent longer. Every strength day is a deposit."},
 {"m": 12, "tag": "Long game", "t": "Strength and living longer", "b": "In pooled data from sixteen studies, people who did any muscle-strengthening exercise had a ten to seventeen percent lower risk of dying, and of heart disease, cancer and diabetes. The benefit peaked at around thirty to sixty minutes a week. Your three strength days cover that easily."},
 {"m": 12, "tag": "Long game", "t": "Fitness and living longer", "b": "We covered this in the cardio month and it bears repeating. In more than 120,000 people tested on a treadmill, higher fitness went with longer life at every level. Low fitness was as risky as smoking. You can change that number at any age, and you've been working on it all year."},
 {"m": 12, "tag": "Long game", "t": "It's never too late", "b": "People in their seventies, eighties and nineties gain strength and muscle when they start lifting. The improvements show up within weeks. If you know someone who believes they're too old to start, they aren't. They need a sensible beginning and a little encouragement, and you can offer both."},
 {"m": 12, "tag": "Long game", "t": "Bones", "b": "Bone is living tissue, and it responds to load the way muscle does. It builds until about thirty and then slowly thins, faster in women after menopause. You can't feel bone loss. Often the first sign is a fracture, which is why it's worth acting before then."},
 {"m": 12, "tag": "Long game", "t": "Load builds bone", "b": "Walking is good for you, but it's too gentle to do much for bone. Bone responds to heavier loads and impact. In an Australian trial, postmenopausal women with low bone mass who lifted heavy twice a week for eight months gained bone density in the spine, while the comparison group lost it."},
 {"m": 12, "tag": "Long game", "t": "What bone needs", "b": "Give your bones three things: strength training with real weight, enough protein, and enough calcium and vitamin D, mostly from food. Some impact helps as well, such as stairs, jogging or hopping, if your joints allow it. Smoking and heavy drinking both weaken bone."},
 {"m": 12, "tag": "Long game", "t": "Know your bone density", "b": "A bone density scan, called a DXA, takes a few minutes and uses very little radiation. It's recommended for women at sixty-five, and earlier for anyone with risk factors like a previous fracture, a parent who broke a hip, or long-term steroid use. Ask your doctor when yours is due."},
 {"m": 12, "tag": "Long game", "t": "Falls", "b": "More than one in four adults over sixty-five falls each year, according to the CDC, and falls cause the great majority of hip fractures. A hip fracture is often the event that ends someone's independence. Most falls can be prevented, and prevention starts decades before the risk feels real."},
 {"m": 12, "tag": "Long game", "t": "Preventing falls", "b": "Falls are prevented by strong legs, good balance and quick reactions. All three can be trained. Squats and lunges, single-leg work, yoga, and sports that make you move sideways and catch yourself. The one-leg stand at the sink from the mobility month belongs here too. Keep doing it."},
 {"m": 12, "tag": "Long game", "t": "Get up off the floor", "b": "Being able to get down to the floor and back up is one of the most useful abilities for an older person to keep. You tried it in the mobility month. Practice it every week for the rest of your life. And if you have older parents, practice it with them."},
 {"m": 12, "tag": "Long game", "t": "A year of inputs", "b": "Open Progress and scroll back to your first week. Count the workouts, the quality meals, the nights of seven hours. Each one was a small decision, and there are hundreds of them. However the outputs moved, that record is real work, and you did it."},
 {"m": 12, "tag": "Long game", "t": "Compare the tests", "b": "Pull up your test weeks, from month two through month ten. Look at body composition, waist and fitness across the full year. Compare the first with the latest and ignore the wobbles between. Small changes in the right direction, held for a year, are how this is supposed to look."},
 {"m": 12, "tag": "Long game", "t": "If the numbers didn't move", "b": "If your outputs are flat, don't call the year a loss. Look at the inputs honestly. Were the strength days truly three a week? Was protein there at most meals? How many drinks, and how much sleep? The answer is usually sitting in one of those four places."},
 {"m": 12, "tag": "Long game", "t": "What stuck", "b": "Some habits are now simply part of your week, and you don't think about them. Name them. Those are yours for good, and they're worth more than anything a test week can measure. A year ago they took effort. Now they're how you live."},
 {"m": 12, "tag": "Long game", "t": "What didn't", "b": "Something didn't stick, and that's true for everyone. Maybe mobility, or sleep, or the weekends. Pick the one that matters most and ask why it was hard. Wrong time of day? Too big? No one to do it with? That's your first project for the year ahead."},
 {"m": 12, "tag": "Long game", "t": "What you can do now", "b": "Set the numbers aside and think about what's different in your life. Stairs that don't wind you. A back that doesn't ache in the morning. Clothes that fit differently. Keeping up with your kids. Carrying the luggage. Those changes are what the numbers were standing in for."},
 {"m": 12, "tag": "Long game", "t": "Thank the people", "b": "Someone helped you this year. A workout partner, a spouse who changed how dinner gets made, a friend who sent a text every morning. Tell them so. And if you did this mostly alone, ask one person to join you next year."},
 {"m": 12, "tag": "Long game", "t": "Same program", "b": "The plan for next year is the plan you just did. There's no advanced version and no secret second phase. Strength three days, cardio, mobility every day, the plate, sleep. What changes is the load on the bar and how easily it all fits into your week."},
 {"m": 12, "tag": "Long game", "t": "One thing to improve", "b": "Choose one thing to do better next year. Just one. Make it the habit that didn't stick, or a habit you'd like to take up a level. Write down exactly what it looks like and where it goes in your week. In a couple of months you can choose another."},
 {"m": 12, "tag": "Long game", "t": "Progress the strength", "b": "If you've been lifting the same weights for months, start there. Muscle and bone respond to being asked for a little more. Add a small amount of weight or a rep or two each month. For classes at home, that might mean buying the next pair of dumbbells."},
