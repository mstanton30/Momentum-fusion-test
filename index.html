<style>
:root{
  --bg:#f4f1ea; --panel:#ffffff; --fg:#161718; --muted:#636a70; --line:#dcd8cf; --soft:#ebe7de;
  --accent:#d6451f; --accent-ink:#ffffff; --green:#1f7a4d; --amber:#c98a12; --blue:#2b5fa8; --red:#b3261e;
  --display:"Archivo","Avenir Next",Helvetica,Arial,sans-serif;
  --body:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1113; --panel:#191c1f; --fg:#eef0f2; --muted:#9aa3ab; --line:#2a2f34; --soft:#22272c;
  --accent:#ff6a3d; --accent-ink:#1a0b05; --green:#4fc38a; --amber:#e7b046; --blue:#6f9ae8; --red:#f28b82; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1113; --panel:#191c1f; --fg:#eef0f2; --muted:#9aa3ab; --line:#2a2f34; --soft:#22272c;
  --accent:#ff6a3d; --accent-ink:#1a0b05; --green:#4fc38a; --amber:#e7b046; --blue:#6f9ae8; --red:#f28b82; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;display:flex;flex-direction:column;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{flex:1;padding:14px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));max-width:560px;width:100%;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2.1rem;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
h2{font-size:1.25rem;font-weight:700;margin:26px 0 10px}
h3{font-size:1rem;font-weight:700}
p{margin:0 0 10px;max-width:62ch}
ul{margin:0 0 12px;padding-left:20px}li{margin-bottom:4px}
.muted{color:var(--muted)}
.sm{font-size:.85rem}.xs{font-size:.78rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600;font-family:var(--display)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card.hero{border:0;background:var(--fg);color:var(--bg)}
.card.hero .eyebrow,.card.hero .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-family:var(--display);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor;opacity:.85}
.btn.small{padding:7px 12px;font-size:.85rem}
.btn:focus-visible,.check:focus-visible,.tabbar button:focus-visible,input:focus-visible,select:focus-visible,.seg button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0;flex:1}
.row.tight>*{flex:0 0 auto}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:11px 14px;color:inherit;margin-top:8px}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.check[aria-checked="true"]{background:color-mix(in srgb,var(--green) 16%,var(--panel));border-color:var(--green)}
.check[aria-checked="true"] .box{background:var(--green);border-color:var(--green)}
.check .box svg{width:14px;height:14px}
.check .pts{margin-left:auto;font-family:var(--display);font-weight:900;font-size:.85rem;color:var(--muted);flex:none}
.check[aria-checked="true"] .pts{color:var(--green)}
.hero .check{background:color-mix(in srgb,var(--bg) 14%,transparent);color:inherit}
.hero .check .box{border-color:color-mix(in srgb,var(--bg) 60%,transparent)}
.hero .check[aria-checked="true"]{background:color-mix(in srgb,var(--green) 35%,transparent);border-color:var(--green)}
.hero .check .pts{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.hero .check[aria-checked="true"] .pts{color:#fff}
.minrow{display:flex;gap:6px;margin:6px 0 0 36px;flex-wrap:wrap}
.minrow button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:.75rem;font-family:var(--display);font-weight:700}
.minrow button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hero .minrow button{border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:inherit}
.hero .minrow button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-top:8px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:.8rem;font-weight:600;color:var(--muted);font-family:var(--display)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.q[aria-pressed="true"]{color:var(--green)}
.seg button.n[aria-pressed="true"]{color:var(--amber)}
.meal{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.meal b{font-family:var(--display)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{background:var(--soft);border:1px solid transparent;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;font-family:var(--display);color:var(--fg);display:inline-flex;gap:6px;align-items:center}
.chips button i{font-style:normal;background:var(--fg);color:var(--bg);border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:.72rem;font-weight:900}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.week .d{background:var(--soft);border-radius:10px;padding:8px 2px;text-align:center;font-size:.7rem;line-height:1.3;border:1px solid transparent}
.week .d b{display:block;font-family:var(--display);font-size:.8rem}
.week .d.today{border-color:var(--accent)}
.week .d.done{background:color-mix(in srgb,var(--green) 18%,var(--panel))}
.week .d .dot{display:block;width:8px;height:8px;border-radius:50%;margin:4px auto 0;background:var(--line)}
.week .d.done .dot{background:var(--green)}
.week .d.intense .dot{background:var(--accent)}
.week .d.done.intense .dot{background:var(--green)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);font-family:var(--display)}
.pill.hot{background:color-mix(in srgb,var(--accent) 18%,var(--panel));color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--green) 18%,var(--panel));color:var(--green)}
.pill.warn{background:color-mix(in srgb,var(--amber) 22%,var(--panel));color:var(--amber)}
.pill.bad{background:color-mix(in srgb,var(--red) 18%,var(--panel));color:var(--red)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat.two{grid-template-columns:repeat(2,1fr)}
.stat>div{background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;font-weight:900}
.stat span{font-size:.7rem;color:var(--muted)}
.hero .stat>div{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.hero .stat span{color:color-mix(in srgb,var(--bg) 70%,transparent)}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.del{background:none;border:0;color:var(--muted);font-size:1rem;padding:0 4px}
.meter{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.home-grid .card{min-width:0}.home-progress{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0}.home-progress>div{height:100%;background:var(--green);border-radius:6px}@media(max-width:350px){.home-grid{grid-template-columns:1fr}}
.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;max-width:100%;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabbar button{min-width:0;width:100%;background:none;border:0;padding:9px 2px 7px;color:var(--muted);font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-family:var(--display);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:.85rem;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:var(--panel)}
summary{cursor:pointer;font-family:var(--display);font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::after{content:"+";color:var(--muted);font-size:1.2rem}
details[open] summary::after{content:"–"}
details>div{padding-top:8px}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:10px 0}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.chart .base{stroke:var(--line);stroke-dasharray:3 3}
.chart .l{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .p{stroke-width:0}
.delta{font-family:var(--display);font-weight:900}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.flat{color:var(--muted)}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.onb{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.onb h1{font-size:2.6rem}
.opts{font-size:.85rem;margin-top:10px}
.opts b{display:block;font-family:var(--display);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:8px 0 2px}
.opts a{color:inherit}
.sharecard{display:none}
.week .d{cursor:pointer}.week .d.sel{background:var(--fg);color:var(--bg)}.week .d.sel .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.navrow button{background:var(--soft);border:0;border-radius:8px;padding:6px 10px;font-weight:700;font-family:var(--display)}
.counter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:8px}
.counter>div{background:var(--soft);border-radius:10px;padding:6px 2px;text-align:center;min-width:0}
.counter .lab{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);font-weight:700}
.counter .ctl{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:2px}
.counter .ctl button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-weight:900;font-size:1rem;line-height:1;padding:0}
.counter .ctl b{font-family:var(--display);min-width:14px;font-size:1rem}
.counter>div.on{background:color-mix(in srgb,var(--green) 16%,var(--panel))}
.gear{background:var(--soft);border:0;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:var(--fg);flex:0 0 auto}
.gear svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plan{white-space:pre-wrap;font-size:.9rem;background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:8px}
.hero .plan{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.goalbar{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:.85rem}

.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.fgrid label{font-size:.78rem;color:var(--muted);display:block}
.fgrid input,.fgrid select{width:100%;margin-top:3px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}.frow span{min-width:0;overflow-wrap:anywhere}
.fmeter{margin:12px 0}.fmeter .meter{margin-top:5px;height:8px}.fmeter .meter i{background:var(--accent)}
#fActivity textarea,#fMeal textarea{width:100%}
</style>
</head>

<script>
(function(){
"use strict";
const LS_KEY="momentumfusion.v1";
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>';
const GEAR='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';

/* =========================== PROGRAM CONTENT =========================== */
const PTS={main:5,mob:3,fin:2,meal:1,drink:1,supp:1,heat:2,cold:2,medit:1,roll:1,light:1,sleep:2};

/* Each day is a set of sessions. Each session is checked and timed on its own. */
const DAYS=[
 {k:"sun",name:"Sunday",title:"Yoga / Pilates day",intense:false,blurb:"Reset day. This is the group's weak point, so it stays.",
   sessions:[{id:"main",title:"Yoga or Pilates class",range:[20,30],kind:"mobility",mins:[20,30,45],pts:PTS.main},{id:"mob",title:"Stretch / mobility",range:[10,15],kind:"mobility",mins:[10,15,20],pts:PTS.mob}]},
 {k:"mon",name:"Monday",title:"Easy cardio + mobility",intense:false,blurb:"Conversational pace. Feeling good on Monday is the point.",
   sessions:[{id:"main",title:"Recovery / easy cardio",range:[20,30],kind:"cardio",mins:[20,30,45],pts:PTS.main},{id:"mob",title:"Mobility",range:[10,15],kind:"mobility",mins:[10,15,20],pts:PTS.mob}]},
 {k:"tue",name:"Tuesday",title:"Strength A + mobility",intense:false,blurb:"Five patterns: squat, hinge, push, pull, carry/core. Heavier than the cue, 8–10 reps near failure.",
   sessions:[{id:"main",title:"Strength A",range:[30,30],kind:"lift",mins:[20,30,45],pts:PTS.main},{id:"fin",title:"Finisher",range:[5,5],kind:"fin",mins:[5],pts:PTS.fin},{id:"mob",title:"Mobility",range:[10,15],kind:"mobility",mins:[10,15,20],pts:PTS.mob}]},
 {k:"wed",name:"Wednesday",title:"Intense cardio + mobility",intense:true,blurb:"Block focus day. Whatever this block is building, this is where it happens.",
   sessions:[{id:"main",title:"Intense cardio",range:[30,45],kind:"cardio",mins:[30,45,60],pts:PTS.main},{id:"mob",title:"Mobility",range:[10,15],kind:"mobility",mins:[10,15,20],pts:PTS.mob}]},
 {k:"thu",name:"Thursday",title:"Strength B + mobility",intense:false,blurb:"Same five patterns, different variations from Tuesday.",

];
const OPTIONS={
 lift:[["On your own","The five patterns with dumbbells or kettlebells. Log sets in Strong or Hevy (free)."],["Peloton Strength+","Build Strength A/B once, share the link, everyone logs their own weights."],["Peloton / Apple Fitness+","A 30-min full-body strength class; go heavier than the cue."],["YouTube","Jeff Nippard, Jeremy Ethier, Athlean-X 30-min dumbbell follow-alongs. Nike Training Club is free too."],["Trainer or gym","Hand them the five patterns and the rep scheme for the block."]],

};
/* What each block's cardio focus means, and which Peloton (or equivalent) class types fit it. m1/m2 = first and second month of the block. */
const BLOCKS=[
 {n:1,months:"Jan–Feb",cardio:"Base + baseline test",lift:"Heavy, 6–8 reps",

/* Plan for a given date: per-month editable text + link per day, defaulting to the block's lifts */
function defaultPlan(k){ const d=parseD(k), day=dayDef(k), b=blockFor(d), m=MONTH_MUSCLE[d.getMonth()];

  return `20–30 min easy cardio you can talk through, then 10–15 min mobility.`; }

/* Points for one day */
function fusionMealSlot(x){return ['b','l','d','s'].includes(x.mealSlot)?x.mealSlot:'s'}
function effectiveMeals(k){
 const original=S.meals[k]||{},result={...original};
 const groups={};
 for(const x of F.entries.filter(x=>x.type==='meal'&&x.date===k)){
  const slot=fusionMealSlot(x);(groups[slot]||(groups[slot]=[])).push(x);
 }
 for(const [slot,items] of Object.entries(groups)){
  const p=items.reduce((n,x)=>n+(Number(x.p)||0),0);
  const hasQuality=items.some(x=>x.qualityChoice==='quality');
  const hasOff=items.some(x=>x.qualityChoice==='off');
  // Logged meals are authoritative for their slot; do not count the original
  // manual quality toggle a second time. Unclassified is not quality.
  result[slot]={p:p>0?Math.max(1,Math.round(p/PROTEIN_PER_SERVING)):0,
   f:0,v:hasQuality?1:0,c:0,...(hasQuality?{q:1}:hasOff?{n:1}:{n:1})};
 }
 return result;
}
function fusionWeeklyMacros(d){return weekKeys(d).map(k=>({date:k,...fTotalsFor(k)}))}
// Custom activity points: capped at five exercise points per day across planned and custom main sessions.
// Mobility remains a separate category. A replacement never earns both scheduled and substitute points.
function customWorkoutPoints(x){
 const m=Number(x.minutes)||0,level=x.intensity||'moderate',description=String(x.description||'').toLowerCase();
 if(m<15)return 0;
 if(/mobility|stretching|yoga/.test(description)&&!(/trainer|basketball|pickleball|strength/.test(description)))return 3;
 if(level==='vigorous'&&m>=30)return 5;
 if(level==='moderate'&&m>=45)return 4;
 if(level==='moderate'&&m>=30)return 3;
 return 2;
}
function exercisePoints(k){
 const activities=fusionActivities(k);
 const planned=dayDef(k).sessions.filter(x=>x.id==='main'&&sessOf(k,x.id).done).reduce((a,x)=>a+x.pts,0);
 const replacements=activities.filter(x=>x.planAction&&x.planAction!=='extra');
 const extras=activities.filter(x=>!x.planAction||x.planAction==='extra');
 const replacementPoints=replacements.length?Math.max(...replacements.map(customWorkoutPoints)):0;
 const extraPoints=extras.length?Math.max(...extras.map(customWorkoutPoints)):0;
 return Math.min(5,Math.max(planned,replacementPoints,extraPoints));
}
function dayPoints(k){
  let p=0; const day=dayDef(k);
  for(const s of day.sessions) if(s.id!=='main'&&sessOf(k,s.id).done) p+=s.pts;
  p+=exercisePoints(k);
  const m=effectiveMeals(k); for(const [id] of MEALS) if(mealQuality(m[id])) p+=PTS.meal;
  const sp=S.supps[k]||{}; for(const s of SUPPS) if(sp[s.k]) p+=s.pts;
  p+=S.heat.filter(x=>x.d===k).length*PTS.heat + S.cold.filter(x=>x.d===k).length*PTS.cold;
  p+=S.medit.filter(x=>x.d===k).length*PTS.medit + S.roll.filter(x=>x.d===k).length*PTS.roll + S.light.filter(x=>x.d===k).length*PTS.light;
  const sl=sleepHours(k); if(sl!=null&&sl>=SLEEP_GOAL) p+=PTS.sleep;

  return p;
}
function weekPoints(d=today()){ return weekKeys(d).reduce((a,k)=>a+dayPoints(k),0) }
function mealLogged(m){ return !!(m&&(m.n||m.q||Object.values(m).some(n=>n>0))) }
function mealQuality(m){ if(!m) return false; if(m.q) return true; if(m.n) return false; return !!(m.p>0&&(m.f>0||m.v>0)) }
/* Day nutrition */
function dayNutrition(k){ const m=effectiveMeals(k); let p=0,f=0,v=0,c=0,q=0,n=0; for(const [id] of MEALS){ const x=m[id]; if(!mealLogged(x)) continue; p+=x.p||0; f+=x.f||0; v+=x.v||0; c+=x.c||0; if(mealQuality(x)) q++; else n++; } const rw=S.rewards[k]||{}; const r=Object.values(rw).reduce((a,b)=>a+b,0); const drink=!!(S.supps[k]||{}).drink; return {p,f,v,c,q,n,r,drink,protein:p*PROTEIN_PER_SERVING+(drink?DRINK_PROTEIN:0),produce:f+v} }
/* Week ratio: quality meals / (quality + off-plan meals + reward servings/3). Three beers after a quality day costs one "off" unit, not three. */
function weekNutrition(d=today()){ let q=0,n=0,r=0,prot=[],prod=[]; for(const k of weekKeys(d)){ const x=dayNutrition(k); q+=x.q; n+=x.n; r+=x.r; if(x.q+x.n){ prot.push(x.protein); prod.push(x.produce) } } const units=q+n+r/REWARD_PER_UNIT; return {q,n,r,units,pct:units?Math.round(q/units*100):null,protein:avg(prot),produce:avg(prod)} }
function ratioLabel(pct){ if(pct==null) return ["Nothing logged yet","pill"]; if(pct>=80) return ["80/20 · earned it","pill ok"]; if(pct>=70) return ["70/30 · on track","pill ok"]; if(pct>=60) return ["60/40 · adjust the ratio","pill warn"]; return ["50/50 · rewards are winning","pill bad"] }
/* Sleep: bed and wake as HH:MM; hours = wake − bed across midnight */
function sleepHours(k){ const s=S.sleep[k]; if(!s||!s.bed||!s.wake) return null; const [bh,bm]=s.bed.split(":").map(Number),[wh,wm]=s.wake.split(":").map(Number); let h=(wh+wm/60)-(bh+bm/60); if(h<0) h+=24; return Math.round(h*10)/10 }
function weekSleep(d=today()){ return avg(weekKeys(d).map(sleepHours)) }
function mobStreak(){ let n=0; const d=today(); if(!sessOf(ymd(d),"mob").done) d.setDate(d.getDate()-1); while(sessOf(ymd(d),"mob").done){ n++; d.setDate(d.getDate()-1) } return n }

/* VO2max estimates */
function vo2FromTest(t,kg){
  if(!kg) return null;
  if(t.mod==="bike"){ const pmax=t.v/0.75; return 10.8*pmax/kg+7 }
  if(t.mod==="row"){ const sec=t.v; if(!sec) return null; const pace=sec/2000; const w=2.8/Math.pow(pace,3); return 10.8*w/kg+7 }
  if(t.mod==="run"){ const sec=t.v; if(!sec) return null; const tmin=sec/60, v=1609.34/tmin; const vo2=-4.6+0.182258*v+0.000104*v*v; const pct=0.8+0.1894393*Math.exp(-0.012778*tmin)+0.2989558*Math.exp(-0.1932605*tmin); return vo2/pct }
  return null;
}
function testValueLabel(t){ return t.mod==="bike"?t.v+" W":fmtTime(t.v) }
function vo2Band(v,age,sex){ if(v==null) return ""; const a=age||40; let base=sex==="f"?36:44; base-=Math.max(0,(a-30))*0.3; if(v>=base+10) return "excellent"; if(v>=base+4) return "good"; if(v>=base-3) return "average"; return "below average" }

function chart(points,{color="var(--accent)",fmtV=v=>v,baseline=null,height=90}={}){
  const pts=points.filter(p=>p.v!=null&&!isNaN(p.v));
  if(pts.length<2) return `<p class="muted xs">Needs two or more entries to chart.</p>`;
  const W=320,H=height,pl=34,pr=8,pt=10,pb=18;
  const xs=pts.map(p=>parseD(p.d).getTime()); const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1;
  let vs=pts.map(p=>p.v); if(baseline!=null) vs=vs.concat(baseline);
  let lo=Math.min(...vs),hi=Math.max(...vs); if(hi-lo<1e-6){lo-=1;hi+=1} const pad=(hi-lo)*.15; lo-=pad; hi+=pad;
  const X=t=>pl+(t-x0)/(x1-x0)*(W-pl-pr), Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const path=pts.map((p,i)=>(i?"L":"M")+X(parseD(p.d).getTime()).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const dots=pts.map(p=>`<circle class="p" cx="${X(parseD(p.d).getTime()).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="${color}"/>`).join("");
  const base=baseline!=null?`<line class="base" x1="${pl}" x2="${W-pr}" y1="${Y(baseline).toFixed(1)}" y2="${Y(baseline).toFixed(1)}"/>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${base}<path class="l" d="${path}" stroke="${color}"/>${dots}
  <text x="2" y="${pt+4}">${fmtV(hi-pad)}</text><text x="2" y="${H-pb}">${fmtV(lo+pad)}</text>
  <text x="${pl}" y="${H-4}">${fmt(pts[0].d)}</text><text x="${W-pr}" y="${H-4}" text-anchor="end">${fmt(pts[pts.length-1].d)}</text></svg>`;
}
function delta(first,last,unit="",goodUp=true,dec=1){ if(first==null||last==null) return ""; const d=last-first, cls=Math.abs(d)<0.05?"flat":(d>0===goodUp?"up":"down"); return `<span class="delta ${cls}">${d>0?"+":""}${d.toFixed(dec)}${unit}</span>` }

function checkBtn(on,label,sub,pts,data){ return `<button class="check" role="checkbox" aria-checked="${on}" ${data}><span class="box">${on?CHECK:""}</span><span><b>${esc(label)}</b>${sub?`<br><span class="muted xs">${esc(sub)}</span>`:""}</span><span class="pts">${pts?"+"+pts:""}</span></button>` }
function minRow(k,id,choices,cur){ return `<div class="minrow">${choices.map(m=>`<button aria-pressed="${cur===m}" data-min-set="${id}" data-k="${k}" data-v="${m}">${m} min</button>`).join("")}</div>` }
function optionsBlock(kind,label){ return `<details><summary>${esc(label||"Where to do it")}</summary><div class="opts">${OPTIONS[kind].map(([t,d])=>`<b>${esc(t)}</b>${esc(d)}`).join("")}</div></details>` }
function header(title,sub){ return `<div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="eyebrow">${sub}</div><h1>${title}</h1></div><div class="row tight" style="gap:6px"><button class="gear" data-go="why" aria-label="Why we do this" style="width:auto;padding:0 12px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase">Why</button><button class="gear" data-go="onboard" aria-label="Edit profile">${GEAR}</button></div></div>` }

function vWhy(){
  return `<div class="onb"><div class="eyebrow">Momentum</div><h1>Why we do this</h1>
  <p class="muted">A year-long program built by sports medicine physicians who want to train hard and stay healthy, for anyone who wants the same. Everything in it is literature-based and cheap. Nothing in it needs a syringe, a subscription or an influencer.</p>
  <div class="card hero"><div class="eyebrow">The idea</div><h2 style="margin:4px 0 8px;font-size:1.4rem">Inputs in, outputs out</h2>
  <p style="opacity:.9">You control five inputs. The app scores them every week. Every two months you measure the outputs: fitness, muscle, body fat. Keep the input line high and the output lines follow. That's the whole program.</p></div>
  <h2>The five habits</h2>
  <div class="card">
   <p><b>1. Move 45 minutes a day.</b> Two strength days, two easy days, two hard days, one yoga day. Ten minutes of mobility every single day, because that's the part everyone skips and the part that keeps you lifting at 60.</p>
   <p><b>When:</b> mornings work best, before the day gets a vote. But a session at 6 pm counts exactly the same as one at 6 am. Done beats early.</p>
   <p><b>2. Protein and produce.</b> A palm of protein at every meal and five fists of fruit and veg a day. Hit that and the rest of your plate is your business.</p>
   <p><b>3. Sleep.</b> Seven-plus hours, same wake time, morning light. Every other habit works better on sleep.</p>
   <p><b>4. Heat and cold.</b> Three saunas and eleven minutes of cold a week. Optional, but the mortality data is hard to ignore.</p>
   <p><b>5. Weigh in on Friday.</b> Once. Same scale, same conditions. The trend is the signal; one bad morning is noise.</p>
  </div>
  <h2>The rules</h2>
  <div class="card">
   <p><b>Majority rules.</b> 80/20. Eat right most of the time and the beer and dessert are earned. We don't count calories; we count whether the right things got done.</p>
   <p><b>Muscle up, fat down beats pounds down.</b> Same weight with better composition is a win and the app shows it as one.</p>
   <p><b>Cheap and proven.</b> Creatine, collagen, fish oil, a recovery drink. Vitamin D if a lab says so. No peptides, no GLP-1s unless a doctor prescribes them, no proprietary blends.</p>
   <p><b>Fifteen seconds a day.</b> Tap what you did. If logging takes longer than that, we built it wrong.</p>
  </div>
  <h2>What to expect</h2>
  <div class="card">
   <p><b>Month 1:</b> the routine feels like work. Points are the only thing moving. That's normal.</p>
   <p><b>Month 2:</b> the first test week. FTP or your mile time improves a few percent; weigh-ins start trending.</p>
   <p><b>Month 6:</b> three test cycles in. Muscle mass up, body fat down, and the Wednesday ride that used to wreck you is just Wednesday.</p>
   <p><b>Month 12:</b> a year of receipts, and a December DEXA that proves it.</p>
  </div>
  <div class="row tight" style="margin-top:8px"><button class="btn" data-go="${S.profile?"workout":"onboard"}">${S.profile?"Back":"Set up my profile →"}</button></div>
  <p class="muted xs" style="margin-top:16px">Built on the evidence, not the algorithm. Questions and ideas go to Dan.</p></div>`;
}

function vWorkout(){
  const d=parseD(sel), key=sel, tk=ymd(today()), day=dayDef(key), blk=blockFor(d), muscle=MONTH_MUSCLE[d.getMonth()], test=isTestWeek(d);
  const isToday=key===tk, future=key>tk, plan=planFor(key);
  const mins=totalTrainingMinutes(key), wp=weekPoints(d), streak=mobStreak();
  const label=isToday?"Today":(future?"Coming up":"Looking back");
  let h=header("Momentum",d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}));
  h+=`<div class="row" style="margin:6px 0 12px"><span class="pill">${wp} pts this week</span><span class="pill ${streak>=7?"ok":""}">${streak}-day mobility streak</span>${test?'<span class="pill hot">Test week</span>':""}</div>`;
  h+=`<div class="card hero">
    <div class="eyebrow">${label}${S.profile&&isToday?", "+esc(S.profile.name):""}</div>
    <h2 style="margin:4px 0 2px;font-size:1.5rem">${esc(day.title)}</h2>
    <div class="muted" style="margin-bottom:8px">${day.intense?'<span class="pill hot">Intense</span> ':""}Goal ${DAY_GOAL}–50 min</div>
    <p style="opacity:.85">${esc(day.blurb)}</p>
    ${fusionReplacements(key).length?`<div class="note"><b>↔ Replacement completed:</b> ${fusionReplacements(key).map(x=>esc(x.description)+' · '+x.minutes+' min').join(', ')}. Original scheduled workout not marked complete.</div>`:''}<div class="plan">${esc(plan.text)}</div>
    ${plan.link?`<a class="btn" style="margin-top:10px" href="${esc(plan.link)}" target="_blank" rel="noopener">Start →</a>`:""}
    ${future?`<p class="muted xs" style="margin-top:10px">You can log this once the day arrives.</p>`:day.sessions.map(s=>{ const st=sessOf(key,s.id); const sub=s.id==="fin"?muscle+" · 2 sets to failure":s.range[0]===s.range[1]?s.range[0]+" min":s.range[0]+"–"+s.range[1]+" min"; return checkBtn(!!st.done,s.title,sub,s.pts,`data-sess="${s.id}" data-k="${key}"`)+(st.done?minRow(key,s.id,s.mins,st.min):"") }).join("")}
    ${future?"":`<div class="goalbar"><span class="muted">Minutes today</span><span><b style="font-family:var(--display);font-size:1.2rem">${mins}</b> <span class="muted">/ ${DAY_GOAL}</span></span></div><div class="meter"><i style="width:${Math.min(100,mins/DAY_GOAL*100)}%;background:${mins>=DAY_GOAL?"var(--green)":"var(--accent)"}"></i></div>`}
  </div>`;
  const kinds=[...new Set(day.sessions.map(s=>s.kind))];
  h+=kinds.map(k=>optionsBlock(k,k==="mobility"?"Where to do mobility":k==="fin"?"The finisher":"Where to do "+(k==="lift"?"the lift":k==="boot"?"bootcamp":"cardio"))).join("");
  h+=`<details><summary>Edit ${esc(monthName(d))}'s plan for ${esc(day.name)}s</summary><div><p class="muted xs">This replaces the generic plan for every ${esc(day.name)} in ${esc(monthName(d))}. Paste your Strength+ routine, or the class you want everyone on.</p>
  <form id="fPlan" data-mk="${monthKey(d)}" data-day="${day.k}"><div class="field"><label class="f">Plan</label><textarea name="text">${esc(plan.text)}</textarea></div><div class="field"><label class="f">Start link (Strength+ share link, Peloton class, YouTube…)</label><input type="url" name="link" value="${esc(plan.link)}" placeholder="https://…"></div><div class="row tight"><button class="btn small" type="submit">Save for ${esc(monthName(d))}</button>${plan.custom?`<button class="btn small ghost" type="button" data-plan-reset="1">Back to default</button>`:""}</div></form></div></details>`;
  if(day.k==="fri"&&!future){ const last=[...S.weigh].sort((a,b)=>a.d<b.d?1:-1)[0];
    h+=`<div class="card"><div class="eyebrow">Friday weigh-in</div><p style="margin:6px 0">${last&&last.d===key?"Logged. Nice.":"Same scale, same conditions, then log it in Track."}</p><button class="btn small" data-go="track">Go to weigh-in</button></div>`; }
  const sow=startOfWeek(d), wk=weekKeys(d);
  h+=`<div class="navrow"><button data-week="-1">‹ Prev</button><h2 style="margin:0">Week of ${fmt(wk[0])}</h2><button data-week="1">Next ›</button></div><div class="week">`+DAYS.map((x,i)=>{ const k=wk[i]; const p=dayPoints(k); const replacement=fusionReplacements(k).length>0; const done=!!sessOf(k,"main").done||replacement;
    return `<div class="d ${k===tk?"today":""} ${k===sel?"sel":""} ${done?"done":""} ${x.intense?"intense":""}" data-sel="${k}"><b>${x.name.slice(0,3)}</b>${replacement?"↔ ":""}${esc(x.title.split(" ")[0])}<span class="dot"></span><span class="muted xs">${p?p+"p":(k>tk?"":"–")}</span></div>` }).join("")+`</div>
  <p class="muted xs" style="margin-top:8px">Tap a day to see what's coming or what you did. Orange dot = intense day. Green = completed; ↔ = replacement activity.${sel!==tk?' <button class="del" data-sel="'+tk+'" style="text-decoration:underline">Back to today</button>':""}</p>`;
  h+=`<h2>Points</h2><div class="card sm"><div class="row" style="justify-content:space-between"><span>Main session (cardio, strength, class)</span><b>+${PTS.main}</b></div><div class="row" style="justify-content:space-between"><span>Mobility</span><b>+${PTS.mob}</b></div><div class="row" style="justify-content:space-between"><span>Finisher (Tue/Thu)</span><b>+${PTS.fin}</b></div><div class="row" style="justify-content:space-between"><span>Quality meal</span><b>+${PTS.meal} each</b></div><div class="row" style="justify-content:space-between"><span>Recovery drink / supplement</span><b>+${PTS.supp} each</b></div><div class="row" style="justify-content:space-between"><span>Sauna or cold session</span><b>+${PTS.heat} each</b></div><div class="row" style="justify-content:space-between"><span>Meditation, foam roll, morning light</span><b>+1 each</b></div><div class="row" style="justify-content:space-between"><span>${SLEEP_GOAL}+ hours sleep logged</span><b>+${PTS.sleep}</b></div><p class="muted xs" style="margin-top:8px">A full week is about 180. Points are inputs; Track shows whether the outputs follow.</p></div>`;
  const m2=d.getMonth()%2===1;
  h+=`<h2>Block ${blk.n} · ${esc(blk.months)}</h2><div class="card"><span class="pill">Cardio: ${esc(blk.cardio)}</span><p style="margin:10px 0 6px">${esc(blk.guide)}</p><p class="sm"><b>${esc(monthName(d))}:</b> ${esc(m2?blk.m2:blk.m1)}</p><p class="sm"><b>Peloton picks:</b> ${esc(blk.picks.join(" · "))}</p><p style="margin:10px 0 6px"><b>Lifts:</b> ${esc(blk.lift)}. Same five patterns every block, new variations each time.</p><p class="muted sm">Focus muscles: ${esc(MONTH_MUSCLE[(blk.n-1)*2])}, then ${esc(MONTH_MUSCLE[(blk.n-1)*2+1])}.</p>${test?`<div class="note">Test week: do your ${esc(MODALITIES[(S.profile||{}).modality||"bike"].test)}, log it in Track, and your 4-week body comp average rolls into this block's outcomes.</div>`:""}</div>
  <h2>The year</h2>`+BLOCKS.map(b=>`<details ${b.n===blk.n?"open":""}><summary>Block ${b.n} · ${esc(b.months)}</summary><div><p><b>Cardio:</b> ${esc(b.cardio)}. ${esc(b.guide)}</p><p class="sm"><b>Month 1:</b> ${esc(b.m1)}<br><b>Month 2:</b> ${esc(b.m2)}<br><b>Peloton picks:</b> ${esc(b.picks.join(" · "))}</p><p><b>Lifts:</b> ${esc(b.lift)}</p><div class="plan"><b>A</b>\n${esc(b.A)}</div><div class="plan"><b>B</b>\n${esc(b.B)}</div></div></details>`).join("");
  return h+fWorkoutPanel();
}

  <div class="card hero"><div class="eyebrow">Post-workout recovery drink</div><h2 style="margin:4px 0 8px;font-size:1.4rem">All in one shaker</h2>
  <ul style="opacity:.92">${S.drink.split("\n").filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
  <p class="muted xs">Whey for the protein, bicarb and potassium to replace what you sweat out and buffer the hard days, magnesium for recovery and sleep, collagen for tendons. Creatine goes in here too.</p>
  <details style="background:transparent;border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:inherit"><summary>Edit recipe</summary><div><form id="fDrink"><textarea name="drink">${esc(S.drink)}</textarea><button class="btn small" style="margin-top:8px">Save recipe</button></form></div></details></div>
  <h2>What to buy</h2>
  <p class="muted xs">Rated for purity on Labdoor or ConsumerLab, cheap per dose. Edit any line to the brand you actually use.</p>
  ${SUPPS.map(s=>`<details><summary>${esc(s.name)}</summary><div><p class="sm">${esc((S.src||{})[s.k]||s.src)}</p><p class="xs"><a href="${esc((S.buy||{})[s.k]||BUY[s.k])}" target="_blank" rel="noopener">Buy link →</a></p><form class="fSrc" data-k="${s.k}"><div class="field"><label class="f">My pick</label><input name="src" value="${esc((S.src||{})[s.k]||"")}" placeholder="Brand, where you buy it, price"></div><div class="field"><label class="f">My link</label><input type="url" name="buy" value="${esc((S.buy||{})[s.k]||"")}" placeholder="https://…"></div><button class="btn small">Save</button></form></div></details>`).join("")}
  <h2>The evidence</h2>
  <details><summary>Creatine monohydrate</summary><div><p>The most studied supplement in sport. Strength, lean mass, and growing data on cognition and recovery. 3–5 g daily, every day, no loading needed. Timing barely matters. Skip HCl, buffered, gummies.</p></div></details>
  <details><summary>Collagen peptides</summary><div><p>15 g about an hour before loading increases collagen synthesis in tendon and ligament. Modest but real, and cheap. Vitamin C helps the reaction but a normal diet covers it; no need to add any.</p></div></details>
  <details><summary>Omega-3 fish oil</summary><div><p>Anti-inflammatory, supports recovery and cardiovascular health when EPA+DHA is dosed properly: 2–3 g combined daily with a meal. Read the label; that's often 3–4 capsules of a cheap bottle. Two servings of fatty fish a week does the same job.</p></div></details>
  <details><summary>Vitamin D</summary><div><p>Only worth taking if you're low, which is common in Rochester from October to April. It doesn't help if your level is normal. Ask primary care for a level, then dose to it.</p></div></details>
  <details><summary>Electrolytes and magnesium</summary><div><p>Sodium and potassium are what you sweat out in a bootcamp; the drink covers it. Magnesium glycinate 200–400 mg: weak-to-moderate evidence for sleep and cramps, very safe, easy on the stomach.</p></div></details>
  <h2>Use with a plan</h2>
  <details><summary>Caffeine</summary><div><p><b>Helps:</b> 1–3 mg per kg (roughly 100–250 mg, one to two coffees) 30–60 minutes before a hard session improves power, endurance and perceived effort. It's one of the few supplements with decades of evidence.</p><p><b>Hurts:</b> anything within 8–10 hours of bed cuts deep sleep even if you fall asleep fine. More than ~400 mg a day raises anxiety and resting heart rate. Daily use builds tolerance, so the pre-workout boost fades unless you keep most days modest.</p><p><b>How to use it:</b> wait 60–90 minutes after waking for the first cup; coffee or plain caffeine, not pre-workout blends; last caffeine by early afternoon; keep two or three days a week low so hard days still feel the kick.</p></div></details>
  <details><summary>Nicotine</summary><div><p><b>What's real:</b> at very low doses (1–2 mg, gum or pouch) nicotine modestly improves attention and reaction time in some studies, which is why it's had a moment in productivity circles.</p><p><b>Why we don't bother:</b> the doses that help are smaller than most products sell, the window between "a little sharper" and "dependent" is narrow, it raises blood pressure and heart rate, and the upside is the same you'd get from caffeine, sleep and a walk outside. Addiction risk for a small cognitive bump isn't a trade worth making. If you're already using it, this is the place to taper, not add.</p></div></details>
  <h2>Not on the list, on purpose</h2>
  <details><summary>CBD</summary><div><p>No good evidence for pain, recovery or sleep at the doses in gummies and oils. Products vary widely in what they actually contain, and some include THC.</p></div></details>
  <details><summary>Peptides (BPC-157, TB-500 and friends)</summary><div><p>Animal data and anecdotes, no controlled human trials, no quality control on what's in the vial, and banned in tested sport. Not something to buy off the internet.</p></div></details>
  <details><summary>GLP-1s (semaglutide, tirzepatide)</summary><div><p>Real drugs with real evidence, for people who medically need them. They cost muscle as well as fat unless protein and strength training are dialed in, which is this whole program. Use only if medically indicated and prescribed, never from a compounding website.</p></div></details>
  <details><summary>Testosterone, pre-workouts, fat burners, "joint blends"</summary><div><p>Testosterone is a medical decision based on symptoms and labs, not a supplement. The rest are caffeine and marketing. Proprietary blends hide the doses so you can't tell what you're taking.</p></div></details>
  <div class="note">Rule of thumb: if it's cheap, single-ingredient, and has been studied for decades, it's on the list. If it needs a syringe, a subscription, or an influencer, it isn't.</div>`;
}

async function analyzeHealthScreenshot(){

 if(!file){if(message)message.textContent='Choose a screenshot first.';return}
 if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>5*1024*1024){if(message)message.textContent='Choose a PNG, JPG, or WebP screenshot under 5 MB.';return}

 try{

  const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image})});

function saveHealthImport(d){
 const n=k=>d[k]===''?null:Number(d[k]);
 const date=d.date,kind=d.kind,source=d.source;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>ymd(today()))return 'Choose a valid date that is not in the future.';
 const cutoff=new Date(today());cutoff.setFullYear(cutoff.getFullYear()-2);if(date<ymd(cutoff))return 'The date is more than two years old. Please correct the year before saving.';
 if(!['workout','recovery','weight'].includes(kind))return 'Choose a measurement type.';
 const record={id:fusionId(),date,kind,source,values:{}};
 if(kind==='workout'){
  const minutes=n('minutes');if(!(minutes>0&&minutes<=1440)||!String(d.activity||'').trim())return 'Enter a workout name and valid duration.';
  const activeCalories=n('activeCalories');if(activeCalories!==null&&(!Number.isFinite(activeCalories)||activeCalories<0||activeCalories>20000))return 'Check active calories.';
  const duplicate=F.entries.some(x=>x.type==='activity'&&x.date===date&&Math.abs((Number(x.minutes)||0)-minutes)<=5&&String(x.description||'').toLowerCase()===String(d.activity).trim().toLowerCase());
  if(duplicate)return 'Possible duplicate workout: a matching activity and duration are already logged. No changes saved.';
  record.entryId=fusionId();record.summary=`${String(d.activity).trim()} · ${minutes} min`;
  record.values={activity:String(d.activity).trim(),minutes,activeCalories,heartRate:n('heartRate')};
  F.entries.push({id:record.entryId,date,type:'activity',description:record.values.activity,minutes,intensity:d.intensity||'moderate',planAction:'extra',caloriesBurned:activeCalories,calorieSource:activeCalories===null?null:'wearable-active',source:'screenshot-confirmed'});
 }else if(kind==='weight'){
  const weight=n('weight');if(!(weight>0&&weight<=1400))return 'Enter a valid weight in pounds.';
  if(F.healthImports.some(x=>x.kind==='weight'&&x.date===date&&x.source===source))return 'A measurement from this source is already logged on that date. Remove it before replacing.';
  record.values={weight,bodyFat:n('bodyFat'),muscle:n('muscle')};record.summary=`${weight} lb`;
  record.weighId=Date.now()+Math.floor(Math.random()*1000);
  S.weigh.push({id:record.weighId,d:date,wt:String(weight),bf:record.values.bodyFat==null?'':String(record.values.bodyFat),mm:record.values.muscle==null?'':String(record.values.muscle)});
  save();
 }else{
  const vals=['recovery','sleep','strain','hrv','heartRate'].map(k=>n(k));if(vals.every(x=>x===null))return 'Enter at least one recovery or sleep measurement.';
  if(F.healthImports.some(x=>x.kind==='recovery'&&x.date===date&&x.source===source))return 'A recovery entry from this source is already logged for that date.';
  record.values=Object.fromEntries(['recovery','sleep','strain','hrv','heartRate'].map((k,i)=>[k,vals[i]]));
  record.summary=[vals[0]!=null?`Recovery ${vals[0]}%`:'',vals[1]!=null?`Sleep ${vals[1]} h`:'',vals[2]!=null?`Strain ${vals[2]}`:''].filter(Boolean).join(' · ')||'Recovery metrics';
 }
 F.healthImports.push(record);fsave();return null;
}

  const re=/\b(for\s+|at\s+)?(breakfast|lunch|dinner|supper|snack)\b/g; let cursor=0, cur="s", mm;

    if(mm[1]){ if(before.trim()) segs.push([meal,before]); cur=meal; }
    else { if(before.trim()) segs.push([cur,before]); cur=meal; }

    for(const cat of ["p","f","v","c"]){ let n=0; for(const w of WORDS[cat]) n+=count(seg,w); if(n){ out[meal][cat]=(out[meal][cat]||0)+Math.min(3,Math.ceil(n)); } }
    for(const cat of ["alc","dessert","snack"]){ let n=0; for(const w of WORDS[cat]) n+=count(seg,w); if(n) rewards[cat]=(rewards[cat]||0)+Math.ceil(n) }

  return {meals:out,rewards,smoothie,drink};

function groceryIngredients(text,servings=1){
 const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

   const m=line.match(/^([\d.]+)\s+(cups?|tbsp|tsp|oz|lb|g|kg|ml|l|pcs?|pieces?|whole)\s+(.+)$/i);

function fCoachAdvice(m){

function fDailyCoach(reference=today()){

 const totals=fTotalsFor(k), previous=fTotalsFor(yesterday);
 const yesterdayMeals=F.entries.filter(x=>x.type==='meal'&&x.date===yesterday);
 const weekly=fCoachMetrics(reference);
 let focus='',reason='',category='Training';
 if(!workouts){
   focus='Choose a manageable activity today, or use today as a recovery day if needed.';
   reason='No workout has been logged today. This does not mean you missed a workout.';
 }else if(meals.length===0){
   category='Nutrition';focus='Log one meal when convenient so your nutrition review can reflect today.';
   reason=`${workouts} workout(s) recorded today; no meals recorded yet.`;
 }else if(totals.p < (Number(F.targets.p)||0)*0.5){
   category='Nutrition';focus='Consider including a protein-rich food in your next meal.';
   reason=`${Math.round(totals.p)}g protein logged toward your ${F.targets.p}g daily target; your day may not be complete.`;
 }else if(totals.fiber < (Number(F.targets.fiber)||0)*0.5){
   category='Nutrition';focus='Consider adding a fiber-rich food such as fruit, vegetables, beans, or whole grains.';
   reason=`${Math.round(totals.fiber)}g fiber logged so far; your day may not be complete.`;
 }else{

   reason=`${workouts} workout(s), ${minutes} training minutes, and ${meals.length} meal entry/entries recorded today.`;
 }
 const yesterdaySummary=yesterdayMeals.length?`Yesterday: ${yesterdayMeals.length} meal entry/entries, ${Math.round(previous.p)}g protein logged.`:'No meal entries recorded yesterday; that is missing data, not evidence of missed meals.';
 return {date:k,category,focus,reason,workouts,minutes,meals:meals.length,weekly,yesterdaySummary,hasWearableRecovery:false};
}

function fAI(kind){

 const description=form?.elements.description?.value?.trim()||'';
 const status=document.getElementById('fAiStatus');
 if(kind!=='coach'&&!description){toast('Describe it first');return}
 if(kind==='coach'){
  const count=F.entries.filter(x=>x.type==='activity').length;
  const meals=F.entries.filter(x=>x.type==='meal').length;
  if(status)status.textContent='SIMULATED AI COACH PREVIEW — You have '+count+' logged activities and '+meals+' macro-tracked meals. A future AI coach could compare weekly training, protein consistency, recovery and body-composition trends, then suggest one next step. This text is a demonstration, not personalized medical advice.';
  return;
 }
 if(kind==='meal'){
  const d=description.toLowerCase();let p=30,c=45,f=18,fiber=5;

  else if(/pizza/.test(d)){p=25;c=65;f=28;fiber=4}

  if(/beer|ipa|wine|martini/.test(d))c+=20;
  const est={p,c,f,fiber,calories:Math.round(p*4+c*4+f*9)};

  return;
 }
 if(kind==='activity'){

  if(ds.mealset!==undefined){ const k=nutDay; S.meals[k]=S.meals[k]||{}; const v=ds.v;
   const fusionSlotMeals=F.entries.filter(x=>x.type==='meal'&&x.date===k&&fusionMealSlot(x)===ds.mealset);
   if(fusionSlotMeals.length){for(const x of fusionSlotMeals)x.qualityChoice=v==='q'?'quality':v==='n'?'off':'unknown';fsave();render();toast('Meal quality updated');return;}
 if(v==="q") S.meals[k][ds.mealset]=(mealQuality(S.meals[k][ds.mealset])?S.meals[k][ds.mealset]:{p:1,f:0,v:1,c:0,q:1}); else if(v==="n") S.meals[k][ds.mealset]={p:0,f:0,v:0,c:0,n:1}; else delete S.meals[k][ds.mealset]; save(); render(); return }
  if(ds.food){ const k=nutDay; S.meals[k]=S.meals[k]||{}; const m=S.meals[k][ds.meal]||{p:0,f:0,v:0,c:0}; m[ds.food]=Math.max(0,(m[ds.food]||0)+ +ds.dv); delete m.q; delete m.n; S.meals[k][ds.meal]=m; save(); render(); return }
  if(ds.reward){ const k=nutDay; S.rewards[k]=S.rewards[k]||{}; S.rewards[k][ds.reward]=Math.max(0,(S.rewards[k][ds.reward]||0)+ +ds.dv); save(); render(); return }
  if(ds.supp){ const k=ds.k; S.supps[k]=S.supps[k]||{}; const on=!S.supps[k][ds.supp]; S.supps[k][ds.supp]=on; if(ds.supp==="drink"){ for(const x of IN_DRINK) S.supps[k][x]=on } save(); render(); if(ds.supp==="drink"&&on) toast("Drink logged: +"+DRINK_PROTEIN+" g protein, creatine and collagen ticked"); return }
  if(ds.vitd){ S.profile.vitd=!S.profile.vitd; save(); render(); return }
  if(ds.planReset){ const f=$("#fPlan"); const mk=f.dataset.mk, day=f.dataset.day; if(S.plans[mk]) delete S.plans[mk][day]; save(); render(); toast("Back to the default plan"); return }
  if(ds.log){ S[ds.log].push({id:Date.now(),d:ymd(today()),min:+ds.min}); save(); render(); toast("+"+ds.min+" min · +"+PTS[ds.log]+" pt"+(PTS[ds.log]>1?"s":"")); return }
  if(ds.del){ S[ds.del]=S[ds.del].filter(x=>String(x.id)!==ds.id); save(); render(); return }
  if(ds.say){ startSpeech(); return }
  if(t.id==="share"){ shareCard(); return }
  if(t.id==="export"){ exportData(); return }
  if(t.id==="wipe"&&confirm("Erase everything on this phone?")){ S=structuredClone(DEFAULT); save(); render() }
});

document.addEventListener('change',async e=>{
 if(e.target.id!=='renphoCsv')return;
 const file=e.target.files?.[0];if(!file)return;
 const status=document.getElementById('renphoImportStatus');
 try{
  if(file.size>1000000)throw Error('CSV exceeds 1 MB');
  const text=await file.text(),lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);
  if(lines.length<2)throw Error('CSV has no data rows');
  const parseLine=line=>{const out=[];let cur='',quote=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++}else quote=!quote}else if(c===','&&!quote){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out};
  const header=parseLine(lines.shift()).map(x=>x.toLowerCase().replace(/\s+/g,'_'));
  const ix=k=>header.indexOf(k);
  if(ix('date')<0||ix('weight_lb')<0)throw Error('Required headers: date,weight_lb');
  let added=0;
  for(const line of lines.slice(0,5000)){
   if(!line.trim())continue;
   const row=parseLine(line),date=row[ix('date')],wt=Number(row[ix('weight_lb')]);
   if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(wt)||wt<30||wt>1000)continue;
   const num=k=>ix(k)<0||row[ix(k)]===''?'':Number(row[ix(k)]);
   const bf=num('body_fat_pct'),mm=num('muscle_mass_lb');
   if(bf!==''&&(!Number.isFinite(bf)||bf<0||bf>80))continue;
   if(mm!==''&&(!Number.isFinite(mm)||mm<0||mm>1000))continue;
   S.weigh=S.weigh.filter(x=>x.d!==date);
   S.weigh.push({id:Date.now()+added,d:date,wt:String(wt),bf:String(bf),mm:String(mm),source:'RENPHO CSV'});
   added++;
  }
  if(!added)throw Error('No valid rows found. Check the CSV format.');
  save();render();toast('Imported '+added+' RENPHO measurements');
 }catch(err){if(status)status.textContent=err.message||'Import failed'}
});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f), d=Object.fromEntries(fd);
  if(f.id==="fOnboard"){ const prev=S.profile||{}; S.profile={...prev,name:d.name.trim(),age:+d.age,sex:d.sex,heightIn:(+d.ft)*12+(+d.inch),weightLb:d.weightLb,bf:d.bf,mm:d.mm,modality:d.modality,goal:d.goal,why:d.why.trim(),start:prev.start||ymd(today())};
    if(!S.weigh.length) S.weigh.push({id:Date.now(),d:S.profile.start,wt:d.weightLb,bf:d.bf,mm:d.mm});
    tab="home"; location.hash=tab; save(); render(); toast(prev.name?"Profile saved":"Baseline set. Let's go."); return }
  if(f.id==="fWeigh"){ let photo=null; const file=fd.get("photo"); if(file&&file.size) photo=await shrinkImage(file); S.weigh=S.weigh.filter(x=>x.d!==d.d); S.weigh.push({id:Date.now(),d:d.d,wt:d.wt,bf:d.bf,mm:d.mm,photo,source:"manual"}); toast("Weigh-in logged") }
  if(f.id==="fTest"){ let v=d.mod==="bike"?+d.v:parseTime(d.v); if(v==null||isNaN(v)){ toast("Check the result format"); return } S.tests.push({id:Date.now(),d:d.d,mod:d.mod,v,watch:d.watch,note:d.note}); toast("Test logged") }
  if(f.id==="fPlan"){ const mk=f.dataset.mk, day=f.dataset.day; S.plans[mk]=S.plans[mk]||{}; S.plans[mk][day]={text:d.text.trim(),link:d.link.trim()}; toast("Plan saved for the month") }
  if(f.id==="fSay"){ const txt=d.text.trim(); if(!txt) return; const res=parseMeal(txt); const touched=applyParsed(nutDay,res); save(); render(); const out=$("#sayOut"); if(out) out.textContent=touched.length?"Added: "+touched.join(" · ")+". Fix any counts above.":"Didn't recognize any food words in that. Try naming the foods: eggs, chicken, salad, rice, a beer."; return }
  if(f.id==="fExtra"){ S.extras.push({id:Date.now(),d:d.d,kind:d.kind,v:d.v.trim(),note:d.note.trim()}); toast("Logged") }
  if(f.id==="fSleep"){ S.sleep[ymd(today())]={bed:d.bed,wake:d.wake}; const h=sleepHours(ymd(today())); toast(h!=null?h+" h logged"+(h>=SLEEP_GOAL?" · +"+PTS.sleep:""):"Sleep saved") }
  if(f.id==="fSmoothie"){ S.smoothie=d.smoothie.trim()||DEFAULT_SMOOTHIE; toast("Recipe saved") }
  if(f.id==="fDrink"){ S.drink=d.drink.trim()||DEFAULT_DRINK; toast("Recipe saved") }
  if(f.classList.contains("fSrc")){ S.src=S.src||{}; S.src[f.dataset.k]=d.src.trim(); S.buy=S.buy||{}; S.buy[f.dataset.k]=d.buy.trim(); toast("Saved") }
  save(); render();
});
window.addEventListener("hashchange",()=>{ const h=location.hash.replace("#",""); if(TABS.find(t=>t.id===h)&&h!==tab){ tab=h; render() } });
render();
})();
