 const replacementPoints=replacements.length?Math.max(...replacements.map(customWorkoutPoints)):0;

  const all={activity:0,nutrition:0,benefits:0,sleep:0,total:0};
  const byDate=new Map();

function dashboardPointAverages(points,d){
  const todayKey=ymd(d), sunday=ymd(startOfWeek(d));
  const dayNumber=key=>Date.parse(key+'T00:00:00Z')/86400000;
  let firstEarned=null;
  for(const [key,value] of points.byDate){
    if(value>0&&(firstEarned===null||key<firstEarned))firstEarned=key;
  }
  const daysThisWeek=dayNumber(todayKey)-dayNumber(sunday);
  const daysAllTime=firstEarned===null?0:dayNumber(todayKey)-dayNumber(firstEarned);
  const firstSunday=firstEarned===null?null:ymd(startOfWeek(parseD(firstEarned)));
  const firstFullWeek=firstSunday===firstEarned?firstEarned:firstSunday&&shiftDate(firstSunday,7);
  const fullWeeks=firstFullWeek===null?0:(dayNumber(sunday)-dayNumber(firstFullWeek))/7;
  let completedWeekPoints=0, completedLifetimeWeekPoints=0;
  for(const [key,value] of points.byDate){
    if(key>=sunday&&key<todayKey)completedWeekPoints+=value;
    if(firstFullWeek!==null&&key>=firstFullWeek&&key<sunday)completedLifetimeWeekPoints+=value;
  }
  return {
    weeklyDaily:daysThisWeek>0?completedWeekPoints/daysThisWeek:null,
    lifetimeDaily:daysAllTime>0?(points.all.total-(points.byDate.get(todayKey)||0))/daysAllTime:null,
    lifetimeWeekly:fullWeeks>0?completedLifetimeWeekPoints/fullWeeks:null
  };
}

function dayNutrition(k){

 let p=0,f=0,v=0,c=0,q=0,n=0;
 for(const [id] of MEALS){
  const meal=meals[id],rating=mealRating(meal);
  if(!rating)continue;
  p+=meal.p||(meal.guideProtein?1:0); f+=meal.f||0; v+=meal.v||0; c+=meal.c||0;
  if(rating==='q')q++; else n++;
 }
 const rewards=S.rewards[k]||{};
 const r=Object.values(rewards).reduce((a,b)=>a+b,0), drink=!!(S.supps[k]||{}).drink;
 return {p,f,v,c,q,n,r,alcohol:rewards.alc||0,drink,protein:p*PROTEIN_PER_SERVING+(drink?DRINK_PROTEIN:0),produce:f+v};
}
function weekNutrition(d=today()){
 let q=0,n=0,r=0,alcohol=0;
 const protein=[],produce=[];
 for(const k of weekKeys(d)){
  const day=dayNutrition(k);
  q+=day.q; n+=day.n; r+=day.r; alcohol+=day.alcohol;
  if(day.p||day.drink)protein.push(day.protein);
  if(day.produce)produce.push(day.produce);
 }
 const units=q+n+r/REWARD_PER_UNIT;
 return {q,n,r,alcohol,units,pct:units?Math.round(q/units*100):null,protein:avg(protein),produce:avg(produce)};
}

/* Sleep: bed and wake as HH:MM; hours = wake − bed across midnight */
function sleepHours(k){ const s=S.sleep[k]; if(!s||!s.bed||!s.wake) return null; const [bh,bm]=s.bed.split(":").map(Number),[wh,wm]=s.wake.split(":").map(Number); let h=(wh+wm/60)-(bh+bm/60); if(h<0) h+=24; return Math.round(h*10)/10 }
function weekSleep(d=today()){ return avg(weekKeys(d).map(sleepHours)) }
function mobStreak(){ let n=0; const d=today(); if(!sessOf(ymd(d),"mob").done) d.setDate(d.getDate()-1); while(sessOf(ymd(d),"mob").done){ n++; d.setDate(d.getDate()-1) } return n }

/* VO2max estimates */
function vo2FromTest(t,kg){
  if(!kg) return null;
  if(t.mod==="bike"){ const pmax=t.v/0.75; return 10.8*pmax/kg+7 }
  if(t.mod==="row"){ const sec=t.v; if(!sec) return null; const pace=sec/2000; const w=2.8/Math.pow(pace,3); return 10.8*w/kg+7 }
  if(t.mod==="run"){ const sec=t.v; if(!sec) return null; const tmin=sec/60, v=1609.34/tmin; const vo2=-4.6+0.182258*v+0.000104*v*v; const pct=0.8+0.1894393*Math.exp(-0.012778*tmin)+0.2989558*Math.exp(-0.1932605*tmin); return vo2/pct }
  return null;
}
function testValueLabel(t){ return t.mod==="bike"?t.v+" W":fmtTime(t.v) }
function vo2Band(v,age,sex){ if(v==null) return ""; const a=age||40; let base=sex==="f"?36:44; base-=Math.max(0,(a-30))*0.3; if(v>=base+10) return "excellent"; if(v>=base+4) return "good"; if(v>=base-3) return "average"; return "below average" }

const HEALTH_GOALS={health:{name:'General health',minutes:150},enhanced:{name:'Additional health benefits',minutes:300},weight:{name:'Weight management',minutes:225}};
function healthGoal(){return HEALTH_GOALS[F.healthGoal]||HEALTH_GOALS.health}
function healthClassify(text){const t=String(text||'').toLowerCase();if(/bootcamp|cardio.*strength|strength.*cardio/.test(t))return 'mixed';if(/stretch|yoga|pilates|mobility|foam roll/.test(t))return 'mobility';if(/strength|weight|lift|resistance|deadlift|squat|bench|trainer/.test(t))return 'strength';return 'aerobic'}
function strengthPoints(r){
 if(!r||!['full','upper','lower','partial','limited'].includes(r.coverage)||!['light','challenging'].includes(r.effort)||!['single','multiple'].includes(r.volume))return 5; // Unassessed logged strength receives provisional minimum credit.
 if(r.effort==='light'||r.coverage==='limited')return 5;
 if(r.effort==='challenging'&&r.volume==='multiple'&&['full','upper','lower'].includes(r.coverage))return 15;
 return 10;
}
function strengthAssessmentFields(r={}){
 r={coverage:'partial',effort:'light',volume:'single',...r};
 const opt=(value,label,current)=>`<option value="${value}" ${current===value?'selected':''}>${label}</option>`;
 return `<div class="fgrid"><label>Muscle groups<select name="strengthCoverage">${opt('full','Full body',r.coverage)}${opt('upper','Upper-body split',r.coverage)}${opt('lower','Lower-body split',r.coverage)}${opt('partial','Several groups / partial',r.coverage)}${opt('limited','One or two groups',r.coverage)}</select></label><label>Training effort<select name="strengthEffort">${opt('challenging','Challenging reps',r.effort)}${opt('light','Light / easy',r.effort)}</select></label><label>Working sets<select name="strengthVolume">${opt('multiple','Multiple sets per exercise',r.volume)}${opt('single','Mostly one set',r.volume)}</select></label></div>`;
}
function strengthAssessmentFrom(d){return {coverage:d.strengthCoverage||'partial',effort:d.strengthEffort||'light',volume:d.strengthVolume||'single'}}
function activityMinutes(value){const n=Number(value);return Number.isFinite(n)?Math.max(0,n):0}
function healthWeekly(ref=today()){
 const wk=weekKeys(ref),goal=healthGoal();let aerobic=0;const dailyStrength=[];const coverage=new Set();
 for(const k of wk){
  const day=dayDef(k),source=F.daySources?.[k]||'dan',replaced=fusionReplacements(k).length>0;
  let best=0;
  const addStrength=assessment=>{
   best=Math.max(best,strengthPoints(assessment));
   // Coverage is a weekly union, independent of session order and daily score ties.
   if(assessment?.coverage==='full'){coverage.add('upper');coverage.add('lower')}
   else if(['upper','lower'].includes(assessment?.coverage))coverage.add(assessment.coverage);
  };
  if(source==='dan')for(const x of day.sessions){
   const st=sessOf(k,x.id);if(!st.done||replaced&&x.id==='main')continue;
   const min=activityMinutes(st.min??x.range[1]);if(!min)continue;
   if(x.kind==='cardio')aerobic+=min*(day.intense?2:1);
   if(x.kind==='boot')aerobic+=min; // half vigorous cardio, half resistance: no double counting
   if(x.kind==='lift'||x.kind==='boot'){
    addStrength((F.strengthAssessments||{})[k]);
   }
  }
  for(const x of fusionActivities(k)){
   const min=activityMinutes(x.minutes);if(!min)continue;
   const cat=x.healthCategory||healthClassify((x.description||'')+' '+(x.components||''));
   const effort=x.intensity==='vigorous'?2:x.intensity==='light'?0:1;
   if(cat==='aerobic')aerobic+=min*effort;
   if(cat==='mixed'){const cardioPart=String(x.components||'').match(/(?:^|;)\s*(\d+(?:\.\d+)?)\s*min(?:utes)?\s*(?:dedicated\s*)?cardio/i);aerobic+=(cardioPart?Math.min(min,Number(cardioPart[1])):min*.5)*effort;}
   if(cat==='strength'||cat==='mixed'){
    addStrength(x.strengthAssessment);
   }
  }
  if(best)dailyStrength.push(best);
 }
 const cardio=Math.min(70,Math.round(70*aerobic/goal.minutes));
 // Max two scored strength days; complete 30 requires upper AND lower coverage.
 const top=dailyStrength.sort((a,b)=>b-a).slice(0,2).reduce((a,b)=>a+b,0);
 const strength=Math.min(top,coverage.has('upper')&&coverage.has('lower')?30:25);
 return {cardio,strength,score:cardio+strength,aerobic:Math.round(aerobic),strengthDays:dailyStrength.length,goal,coverageComplete:coverage.has('upper')&&coverage.has('lower')};
}
function healthCard(ref=today()){const h=healthWeekly(ref);return `<div class="card" style="border:2px solid var(--green)"><div class="eyebrow">Weekly Activity Score</div><h2 style="margin:5px 0">${h.score}<span class="muted sm"> / 100 · activity goal</span></h2><div class="meter"><i style="width:${h.score}%"></i></div><div class="stat two"><div><b>${h.cardio}/70</b><span>Aerobic · ${h.aerobic}/${h.goal.minutes} equivalent min</span></div><div><b>${h.strength}/30</b><span>Strength · ${h.strengthDays} day(s)</span></div></div><p class="muted xs" style="margin-top:10px">${esc(h.goal.name)} · ${h.coverageComplete?'Upper and lower body covered':'Full strength credit needs upper- and lower-body coverage'} · 100 means weekly activity prescription completed, not perfect health.</p><button class="btn small ghost" data-go="workout">View workouts & scoring</button></div>`}
function healthReading(){return `<details><summary>The science behind your Activity Score</summary><div class="sm"><p><b>Aerobic:</b> 70 points × logged moderate-equivalent minutes ÷ your selected weekly target (capped at 70). Vigorous aerobic minutes count double; light activity does not count toward moderate-equivalent minutes.</p><p><b>Strength:</b> Up to 30 points from your two highest-scoring resistance-training days. Each day earns 5 for limited/light work, 10 for meaningful partial work, or 15 for challenging, multiple-set full-body or upper/lower split training. Unassessed logged resistance work gets provisional 5 points. Full 30 points also requires both upper and lower body to be covered over the week. Several workouts on the same day count as one strength day; their muscle-group coverage is combined across the week. Without upper and lower coverage, strength is capped at 25.</p><p><b>Mixed workouts:</b> A bootcamp is split approximately half aerobic and half resistance, rather than counting all minutes twice. Custom mixed workouts use the same approximation. Review the category and assessment before saving.</p><p><b>Evidence:</b> WHO recommends 150–300 minutes moderate aerobic activity weekly (or 75–150 vigorous) plus major-muscle-group strengthening on at least two days. The 70/30 weighting, 5/10/15 rubric, and 225-minute weight-management option are Momentum design choices, not validated clinical thresholds.</p><p><a href="https://www.who.int/publications/i/item/9789240015128" target="_blank" rel="noopener">WHO physical activity guidelines</a> · <a href="https://www.cdc.gov/physical-activity-basics/guidelines/adults.html" target="_blank" rel="noopener">CDC adult recommendations</a></p><p class="muted xs">This is an activity-adherence score. Nutrition, sleep, and perks remain separate while an overall health score is developed.</p></div></details>`}

/* =========================== CHARTS =========================== */
function chart(points,{color="var(--accent)",fmtV=v=>v,baseline=null,height=90}={}){
  const pts=points.filter(p=>p.v!=null&&Number.isFinite(p.v));
  if(!pts.length) return `<p class="muted xs">No entries in this period.</p>`;
  const W=320,H=height,pl=34,pr=8,pt=10,pb=18;
  const xs=pts.map(p=>parseD(p.d).getTime()); const x0=Math.min(...xs),x1=Math.max(...xs);
  let vs=pts.map(p=>p.v); if(baseline!=null) vs=vs.concat(baseline);
  let lo=Math.min(...vs),hi=Math.max(...vs); if(hi-lo<1e-6){lo-=1;hi+=1} const pad=(hi-lo)*.15; lo-=pad; hi+=pad;
  const X=t=>x0===x1?(pl+W-pr)/2:pl+(t-x0)/(x1-x0)*(W-pl-pr), Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const path=pts.map((p,i)=>(i?"L":"M")+X(parseD(p.d).getTime()).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const dots=pts.map(p=>`<circle class="p" cx="${X(parseD(p.d).getTime()).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="${color}"><title>${esc(p.label||p.d)} · ${esc(fmtV(p.v))}</title></circle>`).join("");
  const base=baseline!=null?`<line class="base" x1="${pl}" x2="${W-pr}" y1="${Y(baseline).toFixed(1)}" y2="${Y(baseline).toFixed(1)}"/>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${base}<path class="l" d="${path}" stroke="${color}"/>${dots}
  <text x="2" y="${pt+4}">${fmtV(hi-pad)}</text><text x="2" y="${H-pb}">${fmtV(lo+pad)}</text>
  <text x="${pl}" y="${H-4}">${fmt(pts[0].d)}</text>${x0!==x1?`<text x="${W-pr}" y="${H-4}" text-anchor="end">${fmt(pts[pts.length-1].d)}</text>`:""}</svg>`;
}

function weeklyPlanFor(date){
 return (F.weeklyPlanHistory||[]).findLast(version=>version.from<=date)?.days??null;
}
function workoutPlanForProgress(date){
 const now=today(), currentWeek=weekKeys(now);
 return weeklyPlanFor(currentWeek.includes(date)?ymd(now):date);
}
function weeklyPlanLog(date,id){
 return fusionActivities(date).find(entry=>entry.weeklySessionId===id);
}
function linkableWeeklyActivities(date,session){
 const isStrength=['strength','mixed'].includes(session.category);
 return fusionActivities(date).filter(entry=>!entry.weeklySessionId&&
  (!isStrength||['strength','mixed'].includes(entry.healthCategory)));
}
function weeklyPlanStrength(week){
 let planned=0,completed=0;
 for(const date of week){
  const plan=workoutPlanForProgress(date);
  if(!plan)continue;
  for(const session of plan[parseD(date).getDay()]){
   if(!['strength','mixed'].includes(session.category))continue;
   planned++;
   const entry=weeklyPlanLog(date,session.id);
   if(entry&&['strength','mixed'].includes(entry.healthCategory))completed++;
  }
 }
 return {planned,completed};
}

  ${SUPPS.map(s=>`<details><summary>${esc(s.name)}</summary><div><p class="sm">${esc((S.src||{})[s.k]||s.src)}</p><p class="xs"><a href="${esc((S.buy||{})[s.k]||BUY[s.k])}" target="_blank" rel="noopener">Buy link →</a></p><form class="fSrc" data-k="${s.k}"><div class="field"><label class="f">My pick</label><input name="src" value="${esc((S.src||{})[s.k]||"")}" placeholder="Brand, where you buy it, price"></div><div class="field"><label class="f">My link</label><input type="url" name="buy" value="${esc((S.buy||{})[s.k]||"")}" placeholder="https://…"></div><button class="btn small">Save</button></form></div></details>`).join("")}
  <h2>The evidence</h2>
  <details><summary>Creatine monohydrate</summary><div><p>The most studied supplement in sport. Strength, lean mass, and growing data on cognition and recovery. 3–5 g daily, every day, no loading needed. Timing barely matters. Skip HCl, buffered, gummies.</p></div></details>
  <details><summary>Collagen peptides</summary><div><p>15 g about an hour before loading increases collagen synthesis in tendon and ligament. Modest but real, and cheap. Vitamin C helps the reaction but a normal diet covers it; no need to add any.</p></div></details>
  <details><summary>Omega-3 fish oil</summary><div><p>Anti-inflammatory, supports recovery and cardiovascular health when EPA+DHA is dosed properly: 2–3 g combined daily with a meal. Read the label; that's often 3–4 capsules of a cheap bottle. Two servings of fatty fish a week does the same job.</p></div></details>
  <details><summary>Vitamin D</summary><div><p>Only worth taking if you're low, which is common in Rochester from October to April. It doesn't help if your level is normal. Ask primary care for a level, then dose to it.</p></div></details>
  <details><summary>Electrolytes and magnesium</summary><div><p>Sodium and potassium are what you sweat out in a bootcamp; the drink covers it. Magnesium glycinate 200–400 mg: weak-to-moderate evidence for sleep and cramps, very safe, easy on the stomach.</p></div></details>
  <h2>Use with a plan</h2>
  <details><summary>Caffeine</summary><div><p><b>Helps:</b> 1–3 mg per kg (roughly 100–250 mg, one to two coffees) 30–60 minutes before a hard session improves power, endurance and perceived effort. It's one of the few supplements with decades of evidence.</p><p><b>Hurts:</b> anything within 8–10 hours of bed cuts deep sleep even if you fall asleep fine. More than ~400 mg a day raises anxiety and resting heart rate. Daily use builds tolerance, so the pre-workout boost fades unless you keep most days modest.</p><p><b>How to use it:</b> wait 60–90 minutes after waking for the first cup; coffee or plain caffeine, not pre-workout blends; last caffeine by early afternoon; keep two or three days a week low so hard days still feel the kick.</p></div></details>
  <details><summary>Nicotine</summary><div><p><b>What's real:</b> at very low doses (1–2 mg, gum or pouch) nicotine modestly improves attention and reaction time in some studies, which is why it's had a moment in productivity circles.</p><p><b>Why we don't bother:</b> the doses that help are smaller than most products sell, the window between "a little sharper" and "dependent" is narrow, it raises blood pressure and heart rate, and the upside is the same you'd get from caffeine, sleep and a walk outside. Addiction risk for a small cognitive bump isn't a trade worth making. If you're already using it, this is the place to taper, not add.</p></div></details>
  <h2>Not on the list, on purpose</h2>
  <details><summary>CBD</summary><div><p>No good evidence for pain, recovery or sleep at the doses in gummies and oils. Products vary widely in what they actually contain, and some include THC.</p></div></details>
  <details><summary>Peptides (BPC-157, TB-500 and friends)</summary><div><p>Animal data and anecdotes, no controlled human trials, no quality control on what's in the vial, and banned in tested sport. Not something to buy off the internet.</p></div></details>
  <details><summary>GLP-1s (semaglutide, tirzepatide)</summary><div><p>Real drugs with real evidence, for people who medically need them. They cost muscle as well as fat unless protein and strength training are dialed in, which is this whole program. Use only if medically indicated and prescribed, never from a compounding website.</p></div></details>
  <details><summary>Testosterone, pre-workouts, fat burners, "joint blends"</summary><div><p>Testosterone is a medical decision based on symptoms and labs, not a supplement. The rest are caffeine and marketing. Proprietary blends hide the doses so you can't tell what you're taking.</p></div></details>
  <div class="note">Rule of thumb: if it's cheap, single-ingredient, and has been studied for decades, it's on the list. If it needs a syringe, a subscription, or an influencer, it isn't.</div>`;
}

function saveHealthImport(d){
 const n=k=>d[k]===''?null:Number(d[k]);
 const date=d.date,kind=d.kind,source=d.source;
 if(!validLogDate(date))return 'Choose a valid date that is not in the future.';
 const cutoff=new Date(today());cutoff.setFullYear(cutoff.getFullYear()-2);if(date<ymd(cutoff))return 'The date is more than two years old. Please correct the year before saving.';
 if(!['workout','recovery','weight'].includes(kind))return 'Choose a measurement type.';
 const record={id:fusionId(),date,kind,source,values:{}};
 if(kind==='workout'){
  const minutes=n('minutes');if(!(minutes>0&&minutes<=1440)||!String(d.activity||'').trim())return 'Enter a workout name and valid duration.';
  const activeCalories=n('activeCalories');if(activeCalories!==null&&(!Number.isFinite(activeCalories)||activeCalories<0||activeCalories>20000))return 'Check active calories.';
  const duplicate=F.entries.some(x=>x.type==='activity'&&x.date===date&&Math.abs((Number(x.minutes)||0)-minutes)<=5&&String(x.description||'').toLowerCase()===String(d.activity).trim().toLowerCase());
  if(duplicate)return 'Possible duplicate workout: a matching activity and duration are already logged. No changes saved.';
  record.entryId=fusionId();record.summary=`${String(d.activity).trim()} · ${minutes} min`;
  record.values={activity:String(d.activity).trim(),minutes,activeCalories,heartRate:n('heartRate')};
  F.entries.push({id:record.entryId,date,type:'activity',description:record.values.activity,minutes,intensity:d.intensity||'moderate',planAction:'extra',caloriesBurned:activeCalories,calorieSource:activeCalories===null?null:'wearable-active',source:'screenshot-confirmed'});
 }else if(kind==='weight'){
  const weight=n('weight');if(!(weight>0&&weight<=1400))return 'Enter a valid weight in pounds.';
  const bodyFat=n('bodyFat'),muscle=n('muscle'),metrics={};
  if(bodyFat!==null&&!(bodyFat>=0&&bodyFat<=100))return 'Check body fat percentage.';
  if(muscle!==null&&!(muscle>=0&&muscle<=1000))return 'Check muscle mass.';
  for(const [key,label,,limit] of RENPHO_METRICS){
   const value=d.metrics?.[key];if(value==null)continue;
   if(!(typeof value==='number'&&value>=0&&value<=limit))return 'Check '+label.toLowerCase()+'.';
   metrics[key]=value;
  }
  const prior=F.healthImports.find(x=>x.kind==='weight'&&x.date===date&&String(x.source).toLowerCase()===source.toLowerCase());
  const existing=prior&&S.weigh.find(x=>String(x.id)===String(prior.weighId));
  if(existing){
   if(Number(existing.wt)!==weight)return 'A different weight from this source is already logged on that date. Remove it before replacing.';
   const added=Object.fromEntries(Object.entries(metrics).filter(([key])=>existing.metrics?.[key]==null));
   const addFat=!existing.bf&&bodyFat!==null,addMuscle=!existing.mm&&muscle!==null;
   if(!Object.keys(added).length&&!addFat&&!addMuscle)return 'These readings are already saved.';
   existing.metrics={...existing.metrics,...added};
   if(addFat){existing.bf=String(bodyFat);prior.values.bodyFat=bodyFat}
   if(addMuscle){existing.mm=String(muscle);prior.values.muscle=muscle}
   save();fsave();return null;
  }
  record.values={weight,bodyFat,muscle};record.summary=`${weight} lb`;
  record.weighId=fusionId();
  S.weigh.push({id:record.weighId,d:date,source:source+' image',wt:String(weight),bf:bodyFat==null?'':String(bodyFat),mm:muscle==null?'':String(muscle),metrics});
  save();
 }else{
  const vals=['recovery','sleep','strain','hrv','heartRate'].map(k=>n(k));if(vals.every(x=>x===null))return 'Enter at least one recovery or sleep measurement.';
  if(F.healthImports.some(x=>x.kind==='recovery'&&x.date===date&&x.source===source))return 'A recovery entry from this source is already logged for that date.';
  record.values=Object.fromEntries(['recovery','sleep','strain','hrv','heartRate'].map((k,i)=>[k,vals[i]]));
  record.summary=[vals[0]!=null?`Recovery ${vals[0]}%`:'',vals[1]!=null?`Sleep ${vals[1]} h`:'',vals[2]!=null?`Strain ${vals[2]}`:''].filter(Boolean).join(' · ')||'Recovery metrics';
 }
 F.healthImports.push(record);fsave();return null;
}

const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,couple:2,few:3,half:0.5};
function parseMeal(text){
  const t=" "+text.toLowerCase().replace(/[.,;!]/g," ")+" ";
  const out={b:{},l:{},d:{},s:{}}, rewards={}, notes=[];
  // Clauses: "X for lunch" assigns X to lunch; "lunch: X" / "lunch was X" assigns what follows to lunch.
  const segs=[]; const MK={breakfast:"b",lunch:"l",dinner:"d",supper:"d",snack:"s"};
  const re=/\b(for\s+|at\s+)?(breakfast|lunch|dinner|supper|snack)\b/g; let cursor=0, cur="s", mm;
  while((mm=re.exec(t))){ const before=t.slice(cursor,mm.index); const meal=MK[mm[2]];
    if(mm[1]){ if(before.trim()) segs.push([meal,before]); cur=meal; }
    else { if(before.trim()) segs.push([cur,before]); cur=meal; }
    cursor=mm.index+mm[0].length; }
  const rest=t.slice(cursor); if(rest.trim()) segs.push([cur,rest]);
  function count(seg,word){ const esc=word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); const r=new RegExp("(?:(\\d+|"+Object.keys(NUMW).join("|")+")\\s+)?"+esc+"\\b","g"); let n=0, mm; while((mm=r.exec(seg))){ n+=mm[1]?(NUMW[mm[1]]||parseFloat(mm[1])):1 } return n }
  for(const [meal,seg] of segs){
    for(const cat of ["p","f","v","c"]){ let n=0; for(const w of WORDS[cat]) n+=count(seg,w); if(n){ out[meal][cat]=(out[meal][cat]||0)+Math.min(3,Math.ceil(n)); } }
    for(const cat of ["alc","dessert","snack"]){ let n=0; for(const w of WORDS[cat]) n+=count(seg,w); if(n) rewards[cat]=(rewards[cat]||0)+Math.ceil(n) }
  }
  const drink=/recovery drink|post.?workout (drink|shake)|protein shake/.test(t);
  let smoothie=null; for(const [meal,seg] of segs){ if(/smoothie/.test(seg)){ smoothie=meal==="s"&&!/snack/.test(seg)?"b":meal } }
  return {meals:out,rewards,smoothie,drink};
}
function applyParsed(k,res){ S.meals[k]=S.meals[k]||{}; S.rewards[k]=S.rewards[k]||{}; const touched=[];
  if(res.drink){ S.supps[k]=S.supps[k]||{}; S.supps[k].drink=true; for(const x of IN_DRINK) S.supps[k][x]=true; touched.push("Recovery drink (+"+DRINK_PROTEIN+" g)") }
  if(res.smoothie){ const id=res.smoothie; const m=S.meals[k][id]||{p:0,f:0,v:0,c:0}; delete m.q; delete m.n; m.p+=2; m.f+=1; m.v+=1; m.c+=1; S.meals[k][id]=m; touched.push("Smoothie → "+MEALS.find(x=>x[0]===id)[1]+" P2 F1 V1 C1") }
  for(const [id,name] of MEALS){ const r=res.meals[id]; if(!r||!Object.keys(r).length) continue; const m=S.meals[k][id]||{p:0,f:0,v:0,c:0}; delete m.q; delete m.n; for(const c in r) m[c]=(m[c]||0)+r[c]; S.meals[k][id]=m; touched.push(name) }
  for(const [id] of MEALS){
   if(id!==res.smoothie&&!Object.keys(res.meals[id]).length)continue;
   const meal=S.meals[k][id];
   meal.suggestion=meal.p>0&&(meal.f>0||meal.v>0)?'q':'n';
  }
  for(const [id,name] of REWARDS){ if(res.rewards[id]){ S.rewards[k][id]=(S.rewards[k][id]||0)+res.rewards[id]; touched.push(name+" ×"+res.rewards[id]) } }
  return touched; }

function shrinkImage(file,maxSide=480,quality=.7){

  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   try{
    const scale=Math.min(1,maxSide/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL('image/jpeg',quality));
   }catch{resolve(null)}finally{URL.revokeObjectURL(url)}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);resolve(null)};
  img.src=url;
 });

   const m=line.match(/^([\d.]+)\s+(cups?|tbsp|tsp|oz|lb|g|kg|ml|l|pcs?|pieces?|whole)\s+(.+)$/i);
   if(m)return {name:m[3],qty:(Number(m[1])*servings)+' '+m[2]};

 });

// Rule-based coaching uses the same completed sessions and nutrition records as Track.
// It never fabricates recovery data or claims a live AI analysis.
function fCoachMetrics(reference=today()){
 const keys=Array.from({length:7},(_,i)=>shiftDate(ymd(reference),i-6));
 const completed=keys.map(k=>({date:k,planned:dayDef(k).sessions.filter(x=>sessOf(k,x.id).done).length,custom:fusionActivities(k).length,minutes:totalTrainingMinutes(k)}));
 const workouts=completed.reduce((n,x)=>n+x.planned+x.custom,0);
 const activeDays=completed.filter(x=>x.planned+x.custom>0).length;
 const minutes=completed.reduce((n,x)=>n+x.minutes,0);
 const nutrition=keys.map(k=>({date:k,meals:F.entries.filter(x=>x.type==='meal'&&x.date===k),totals:fTotalsFor(k)}));
 const logged=nutrition.filter(x=>x.meals.length>0);
 const avg=(key)=>logged.length?Math.round(logged.reduce((n,x)=>n+x.totals[key],0)/logged.length):null;
 const quality=keys.reduce((n,k)=>{const d=dayNutrition(k);return {good:n.good+d.q,off:n.off+d.n}}, {good:0,off:0});
 return {workouts,activeDays,minutes,nutritionDays:logged.length,protein:avg('p'),fiber:avg('fiber'),calories:avg('calories'),quality,weightTrend:rolling('wt'),bodyFatTrend:rolling('bf')};
}
function fCoachAdvice(m){
 if(!m.workouts&&!m.nutritionDays)return 'Start by logging a workout or meal; your review will become more useful as data accumulates.';
 if(m.nutritionDays<3)return 'Focus this week: log meals on at least three days so nutrition patterns are easier to interpret.';
 if(m.protein!=null&&m.protein<F.targets.p*.8)return 'Focus this week: improve protein consistency toward your chosen daily target, using foods that fit your preferences.';
 if(m.fiber!=null&&m.fiber<F.targets.fiber*.8)return 'Focus this week: add a fiber-rich food to a meal each day.';
 if(m.activeDays<3)return 'Focus this week: build a consistent, manageable activity routine rather than chasing points.';
 return 'Focus this week: maintain consistency and review trends across several weeks rather than reacting to a single day.';

function fAI(kind){

 const description=form?.elements.description?.value?.trim()||'';
 const status=document.getElementById('fAiStatus');
 if(kind!=='coach'&&!description){toast('Describe it first');return}
 if(kind==='coach'){
  const count=F.entries.filter(x=>x.type==='activity').length;
  const meals=F.entries.filter(x=>x.type==='meal').length;
  if(status)status.textContent='SIMULATED AI COACH PREVIEW — You have '+count+' logged activities and '+meals+' macro-tracked meals. A future AI coach could compare weekly training, protein consistency, recovery and body-composition trends, then suggest one next step. This text is a demonstration, not personalized medical advice.';
  return;
 }
 if(kind==='meal'){
  const d=description.toLowerCase();let p=30,c=45,f=18,fiber=5;
  if(/steak|ribeye|beef|burger/.test(d)){p=58;c=12;f=38;fiber=2}
  else if(/chicken|turkey/.test(d)){p=48;c=34;f=12;fiber=4}
  else if(/salad|vegetable/.test(d)){p=12;c=20;f=16;fiber=9}
  else if(/pizza/.test(d)){p=25;c=65;f=28;fiber=4}

  if(/beer|ipa|wine|martini/.test(d))c+=20;
  const est={p,c,f,fiber,calories:Math.round(p*4+c*4+f*9)};

  form.dataset.ai='yes';

 }
 if(kind==='activity'){

 }
}

  supplements:map(base.supplements,local.supplements,remote.supplements,(a,b,c)=>map(a,b,c)),
  savedMeals:choose(base.savedMeals,local.savedMeals,remote.savedMeals),

 };

async function syncWorkspace(preference){
 if(!activeWorkspace||!cloudSession||cloudBusy||(cloudConflict&&!preference))return;
 const user=activeWorkspace;
 cloudBusy=true;
 try{
  for(let attempt=0;attempt<4;attempt++){
   const remote=await cloudRequest('/workspace');
   if(activeWorkspace!==user)return;
   const auditBefore=stable(cloudAudit);
   cloudAudit={history:remote.history,pending:remote.pending};
   const local=workspaceData();
   const before=stable(local);
   let desired=local;
   if(remote.revision){
    if(!cloudBase){applyWorkspace(remote.data);desired=workspaceData()}
    else{
     const merged=mergeWorkspace(cloudBase,local,remote.data,preference);
     if(merged.conflict){cloudConflict=true;showCloudStatus('Resolve the conflicting changes to resume sync.',true);return}
     desired=merged.data;
    }
   }
   let saved=remote;
   if(stable(desired)!==stable(remote.data)){
    try{saved=await cloudRequest('/workspace','PUT',{revision:remote.revision,data:desired})}
    catch(error){if(error.status===409)continue;throw error}
   }
   if(activeWorkspace!==user)return;
   const after=workspaceData();
   const reconciled=mergeWorkspace(local,after,saved.data);
   if(stable(after)!==before&&reconciled.conflict){
    cloudBase=local;cloudConflict=true;saveWorkspaceDevice();
    showCloudStatus('Resolve the conflicting changes to resume sync.',true);return;
   }
   const final=stable(after)===before?saved.data:reconciled.data;
   if(stable(final.entries)!==stable(after.entries)||stable(final.supplements)!==stable(after.supplements)||
      stable(final.progress)!==stable(after.progress)||stable(final.savedMeals)!==stable(after.savedMeals)||stable(final.savedWorkouts)!==stable(after.savedWorkouts))applyWorkspace(final);
   const changed=stable(workspaceData())!==before;
   cloudBase=saved.data;cloudConflict=false;
   cloudAudit={history:saved.history,pending:saved.pending};
   saveWorkspaceDevice();
   if(stable(workspaceData())!==stable(cloudBase))queueWorkspaceSync();
   if((changed||auditBefore!==stable(cloudAudit))&&!document.activeElement?.matches('input,textarea,select'))render();
   return;
  }
  throw Error('Cloud data changed repeatedly. Refresh to try again.');
 }finally{cloudBusy=false}
}

function handleCloudAuth(event,session){
 const before=accountScreen;
 if(event==='PASSWORD_RECOVERY'&&session){
  recoveryAccount(session.user.id);
  accountScreen='update';
  cloudStatus='';
 }else if(event==='INITIAL_SESSION'&&session&&recoveryAccount()===session.user.id){
  accountScreen='update';
 }else if(event==='SIGNED_OUT'){
  recoveryAccount(null);
  if(accountScreen==='update')accountScreen='reset';
 }else if(session&&accountScreen==='callback'&&!authExchangePending){
  accountScreen='';
  tab='progress';
  connectionOpen=true;
 }
 const previousSession=cloudSession;
 changeCloudSession(session);
 if(before!==accountScreen&&previousSession?.user.id===session?.user.id)render();
}
async function finishCloudAuthCallback(code){
 try{
  const {data,error}=await cloudClient.auth.exchangeCodeForSession(code);
  if(error||!data.session)return;
  authExchangePending=false;
  handleCloudAuth(data.redirectType==='PASSWORD_RECOVERY'?'PASSWORD_RECOVERY':'SIGNED_IN',data.session);
 }catch{ /* The account page explains how to retry a failed link. */ }
 finally{
  const url=new URL(location.href);
  url.searchParams.delete('code');
  history.replaceState(null,'',url);
  authExchangePending=false;
 }
}

document.addEventListener('change',async e=>{
 if(e.target.id!=='renphoCsv')return;
 const file=e.target.files?.[0];if(!file)return;
 const status=document.getElementById('renphoImportStatus');
 try{
  if(file.size>1000000)throw Error('CSV exceeds 1 MB');
  const text=await file.text(),lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);
  if(lines.length<2)throw Error('CSV has no data rows');
  const parseLine=line=>{const out=[];let cur='',quote=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++}else quote=!quote}else if(c===','&&!quote){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out};
  const header=parseLine(lines.shift()).map(x=>x.toLowerCase().replace(/\s+/g,'_'));
  const ix=k=>header.indexOf(k);
  if(ix('date')<0||ix('weight_lb')<0)throw Error('Required headers: date,weight_lb');
  let added=0;
  for(const line of lines.slice(0,5000)){
   if(!line.trim())continue;
   const row=parseLine(line),date=row[ix('date')],wt=Number(row[ix('weight_lb')]);
   if(!validLogDate(date)||!Number.isFinite(wt)||wt<30||wt>1000)continue;
   const num=k=>ix(k)<0||row[ix(k)]===''?'':Number(row[ix(k)]);
   const bf=num('body_fat_pct'),mm=num('muscle_mass_lb'),metrics={};
   for(const [key,,,limit] of RENPHO_METRICS){const value=num(key);if(value!==''&&Number.isFinite(value)&&value>=0&&value<=limit)metrics[key]=value}
   if(bf!==''&&(!Number.isFinite(bf)||bf<0||bf>80))continue;
   if(mm!==''&&(!Number.isFinite(mm)||mm<0||mm>1000))continue;
   const fields={wt:String(wt),bf:String(bf),mm:String(mm),metrics};
   if(S.weigh.some(x=>x.d===date&&x.source==='RENPHO CSV'&&['wt','bf','mm'].every(k=>x[k]===fields[k])&&JSON.stringify(x.metrics||{})===JSON.stringify(metrics)))continue;
   S.weigh.push({id:fusionId(),d:date,...fields,source:'RENPHO CSV'});
   added++;
  }
  if(!added)throw Error('No new valid rows. Check the CSV format or existing imports.');
  save();render();toast('Imported '+added+' RENPHO measurements');
 }catch(err){if(status)status.textContent=err.message||'Import failed'}
});

<script>
/* Momentum PWA update manager. App data stays in browser storage; never clear storage to update. */
(function(){
 const VERSION='9.10.14';
 let pending=false;
  async function activateUpdate(){
    const status=document.getElementById('momentum-update-status');
    if(status){status.style.display='inline';status.textContent='Updating app…';}
    try{
      if('serviceWorker' in navigator){
        const reg=await navigator.serviceWorker.getRegistration();
        if(reg){await reg.update();if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});}
      }
      // Force a fresh navigation without deleting locally saved entries.
      const url=new URL(location.href);url.searchParams.set('momentum-refresh',Date.now().toString());
      location.replace(url.href);
    }catch(e){
      if(status)status.textContent='Update failed. Open this site in Safari and reload.';
    }
  }
  async function checkUpdate(showResult){
    const status=document.getElementById('momentum-update-status');
    try{
      const r=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw Error('Version check unavailable');
      const remote=await r.json();
      const button=document.getElementById('momentum-check-update');
      if(remote.version && remote.version!==VERSION){
        // A newer deployed version is required; older metadata is not an update.
        const newer=(a,b)=>{const aa=a.split('.').map(Number),bb=b.split('.').map(Number);for(let i=0;i<Math.max(aa.length,bb.length);i++){if((aa[i]||0)!==(bb[i]||0))return (aa[i]||0)>(bb[i]||0)}return false};
        if(newer(remote.version,VERSION)){
          pending=true;
          if(button){button.textContent='Install Momentum v'+remote.version;button.onclick=activateUpdate;}
          if(status){status.style.display='inline';status.textContent='New version available';}
        }else if(showResult&&status){status.style.display='inline';status.textContent='Installed version is newer than update metadata.';}
      }else if(showResult&&status){status.style.display='inline';status.textContent='You have the latest version';setTimeout(()=>{if(!pending)status.style.display='none'},3500);}
    }catch(e){if(showResult&&status){status.style.display='inline';status.textContent='Could not check. Try again.';}}
  }
 document.addEventListener('click',e=>{if(e.target?.id==='momentum-check-update'&&!pending)checkUpdate(true)});
 window.addEventListener('pageshow',()=>checkUpdate(false));
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});
 if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(pending)activateUpdate()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(console.warn));
 }
})();
</script>

<script>
/* Reminder sync: bounded requests, explicit app bridge, visible diagnostics. */
(function(){
 const endpoint='https://naomdmnfqudszqmcirrh.supabase.co/functions/v1/momentum-push';
 let active=null,queueTimer=null,attempt=0;
 function status(message){const bridge=window.momentumReminderBridge;
  if(bridge?.status)bridge.status(message);
  else {localStorage.setItem('momentum.reminder.syncstatus',message);const el=document.getElementById('momentumReminderSyncStatus');if(el)el.textContent=message}
 }
 function withDeadline(p,ms){return Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Request exceeded '+ms/1000+' seconds')),ms))])}
 async function sync(){
  if(active)return active;
  active=(async()=>{
   const n=++attempt;
   try{
    status('Preparing sync #'+n+'…');
    const secret=localStorage.getItem('momentum.push.device.secret.v1');
    if(!secret)throw Error('No registered push device. Enable push notifications first.');
    const bridge=window.momentumReminderBridge;
    if(!bridge?.snapshot)throw Error('App data bridge unavailable; reopen Momentum.');
    const snapshot=await withDeadline(Promise.resolve().then(()=>bridge.snapshot()),3000);
    const payload={action:'sync',deviceSecret:secret,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'America/New_York',
     preferences:snapshot.preferences,customReminders:snapshot.customReminders,dailyState:snapshot.dailyState};
    status('Sending sync #'+n+' ('+payload.customReminders.length+' custom reminders)…');
    const controller=new AbortController();
    let timeout=setTimeout(()=>controller.abort(),10000);
    try{
     const response=await withDeadline(fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal}),11000);
     const body=await withDeadline(response.text(),3000);
     let data={};try{data=JSON.parse(body)}catch{}
     if(!response.ok)throw Error((data.error||body.slice(0,140)||'Server error')+' (HTTP '+response.status+')');
     if(data.synced!==true)throw Error('Server did not confirm sync');
     localStorage.setItem('momentum.reminder.lastsync',new Date().toISOString());
     status('Synced successfully at '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+' ('+payload.customReminders.length+' custom reminders).');
    }finally{clearTimeout(timeout)}
   }catch(e){status('Sync failed: '+(e.name==='AbortError'?'Network timeout':e.message||String(e)))}
  })();
  try{return await active}finally{active=null}
 }
 function schedule(){clearTimeout(queueTimer);queueTimer=setTimeout(sync,500)}
 window.momentumSyncReminders=sync;
 window.addEventListener('load',()=>{schedule();setInterval(schedule,60000)});
 window.addEventListener('pageshow',schedule);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule()});
 document.addEventListener('submit',()=>setTimeout(schedule,700));
 document.addEventListener('click',e=>{if(e.target.closest('button,[data-sel],[data-go]'))setTimeout(schedule,800)});
 if(document.readyState==='complete'||document.readyState==='interactive')schedule();
})();
</script>
